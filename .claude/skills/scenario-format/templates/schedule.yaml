# schedule.yaml — template for scenarios/<scenario-id>/nodes/<node>/schedule.yaml,
# a scheduler node's schedule (brick `scheduler`)
#
# Version v0.5, expected to evolve as games are played.
# Shape: v0.3 master spec 7.1 ("The schedule"), with the forms capture W1 of
# specs/versions/v0.3/wave-log.md (item 7) settles, and v0.4 master spec 7.1
# (a node with jobs and no stream; spec D219), and v0.5 master spec 6.8 and
# 7.2 (the http driver, scheduler 0.3.0; capture W1 of
# specs/versions/v0.5/wave-log.md, item 3). Written in SCENARIO
# TIME. Never seen by players: render writes the game's copy (UTC shapes and
# timeline instants, the game's seed), read in place, root only ("0400").
#
# Markers:
#   every key is REQUIRED unless marked otherwise;
#   "# optional: <when>"  the key is present only when <when> holds.
# Replace every <placeholder>. A filled file keeps no <placeholder>.
# No other key: the game's seed is render's, never the scenario's.

intensity: <1.0>                    # a positive number; multiplies every stream's rate and is
                                    # passed to the builders; never rescaled by the GM
connections:                        # name -> connection; streams and jobs name them
  <app>:
    driver: sql/postgresql          # sql/postgresql | http (from scheduler 0.3.0, v0.5); the only
                                    # driver in v0.3 and v0.4 is sql/postgresql
    target: <db:5432/shop>          # sql/postgresql: <node>:<port>/<database>, a node of the
                                    # topology (the database, or a pooler). http: <host>:<port>,
                                    # a node, or a third party's hostname (an alias on the
                                    # partners' api node)
    role: <shop_app>                # optional: absent on an http connection; required on
                                    # sql/postgresql (checked by code). [a-z_][a-z0-9_]{0,40};
                                    # never postgres, dba, monitoring, gm_check,
                                    # pgbouncer_lookup, replicator or pg_*; its password is a
                                    # generated secret, never in this file
    pool: {size: <5>}               # sql/postgresql: {size: N}, N a positive integer, or
                                    # {per-call: true}. http: N, the kept-alive connections, a
                                    # positive integer
    credential: <interfaces_lab_api>   # optional: http only, absent for a public endpoint;
                                    # [a-z][a-z0-9_]*, the game's secret http_<credential>, never
                                    # its value; sent as Authorization: Bearer
    timeout: <10s>                  # optional: http only; per request, <n>s, 1 to 60; default 10s
  # An http connection (v0.5), as written:
  # <lab-api>:
  #   driver: http
  #   target: <lab-api:8000>        # <host>:<port>
  #   credential: <interfaces_lab_api>   # absent: a public endpoint
  #   pool: <2>                     # kept-alive connections
  #   timeout: <10s>                # absent: 10s
streams:                            # may be []: a node with fixed-time operations only (a
                                    # transformer running a purpose's jobs, v0.4)
  - key: <orders.insert>            # a key of the node's queries.yaml; a stream is known by
                                    # this initial key, unique among the node's streams. A call
                                    # key (v0.5) on an http connection, any other on a SQL one
    connection: <app>               # a connection above
    rate: <40/min>                  # <number>/s | /min | /h, positive, at intensity 1.0,
                                    # before the shape
    arrivals: <poisson>             # poisson | even
    shape: <business-hours>         # optional: a shape below; absent, multiplier 1
    concurrency: <2>                # optional: a positive integer, default 1
shapes:                             # optional: when a stream names a shape; name -> shape
  <business-hours>:                 # scenario time, either
    hours: {<"00-06">: <0.1>, <"07-23">: <1.0>}
                                    # hours: "HH" or "HH-HH" (quoted, 00 to 23, never wrapping)
                                    # -> a multiplier >= 0, covering 00 to 23 exactly once; or
                                    # days: {mon-fri: {hours: ...}, sat-sun: {hours: ...}}, the
                                    # days mon tue wed thu fri sat sun alone or as ranges (never
                                    # wrapping), covering the week exactly once
timeline:                           # optional: changes at fixed moments during aging
  - at: <handover-6h>               # T0 or handover-<N>h, N at most aging.minimum: before
                                    # hand-over, never at or after it
    stream: <orders.insert>         # a stream, by its initial key
    set:                            # at least one of:
      key: <orders.insert-v2>       # optional: a key of the node's queries.yaml, never a script
                                    # key (a script runs only as a job)
      rate: <80/min>                # optional: as a stream's rate
      connection: <app>             # optional: a connection above
