# answer-key.yaml — template for scenarios/<scenario-id>/gm/answer-key.yaml
#
# Version v0.3, expected to evolve as games are played.
# Shape: v0.1 master spec section 6.2 ("The answer key"), v0.2 master
# spec 6.3 (capture W1 of specs/versions/v0.2/wave-log.md) and v0.3 master
# spec 6.2 and 11 (capture W1 of specs/versions/v0.3/wave-log.md, item 4:
# a behavioural check's window and threshold). This file and
# scenario.yaml are AUTHORITATIVE. It lives under gm/, which is sealed:
# never shipped to any node, never shown to the players before their
# final answer.
#
# Markers:
#   every key is REQUIRED unless marked otherwise;
#   "# optional: <when>"  the key is present only when <when> holds.
# An empty list (`[]`) is a valid value where its comment says so; an
# absent key is not.
# Replace every <placeholder>. A filled file keeps no <placeholder>.

scenario:
  id: <scenario-id>                 # as in scenario.yaml
  version: <0.1.0>                  # as in scenario.yaml
notes: gm/notes.md                  # longer explanations the GM draws on for feedback

instances:                          # exactly one entry per fault instance in scenario.yaml
  - instance: <f1>                  # fault instance id from scenario.yaml
    what: <what is wrong, concretely, on this node>
    why: <why it is wrong, the risk or the cost>
    evidence:                       # as the `player` OS user (and `dba` in psql)
      - where: <node:db>            # where it is run: bastion (a shell on the bastion, psql
                                    # from there included) | node:<name> (a node other than the
                                    # bastion) | ui:<name> (a route of the bastion's web_routes)
                                    # | report:<tool> (a generated report; <tool> lowercase,
                                    # e.g. report:pgbadger). A fault definition reads only at
                                    # node, bastion or report:<tool> (v0.3 master spec 6.3): a
                                    # reading through a web interface, or on a node other than
                                    # the target, is the scenario's and lives here only (D167);
                                    # the fault's node is written node:<its target node>
        source: <file, view or command output>   # what is looked at (v0.1's free-text where, D101)
        how: <command run as player>
        shows: <what in the output reveals it>
    acceptable:                     # what counts as an acceptable answer
      diagnosis: <what a correct diagnosis names>
      proposal: <what an acceptable recommendation says>
                                    # optional: when an issue covering it expects propose,
                                    # or the fault lists propose
      fix: <what state counts as fixed, by any path (file and reload, ALTER SYSTEM)>
                                    # optional: when an issue covering it expects fix,
                                    # or the fault lists fix and the node is fixable
      improvement: <what counts as better>
                                    # optional: when an issue covering it expects improve,
                                    # or the fault lists improve and the node is fixable
    sealed_check:
      script: <faults/pg-hba-trust/checks/fixed.sh>   # the fault definition's check
      at_handover: 1                # expected exit code once planted (1: present); a check may
                                    # also exit 0 (fixed), 3 (too soon to tell, the remaining
                                    # window on its first line) or another code (error)
      window: <30m>                 # optional: required exactly when the fault's
                                    # sealed_check.behavioural is true (v0.3 master spec 6.2, 11);
                                    # a duration, the trailing window the check judges
      threshold: <0>                # optional: required exactly with window; a number, as
                                    # written, the limit the window is judged against (with a
                                    # margin, master spec 11 rule 2)
      notes: <anything scenario-specific about reading its result>
    interactions: []                # with other instances; may be []:
                                    # [{instance: <f2>, kind: masks | masked-by | conflicts-with,
                                    #   note: <how it changes the evidence or the answer>}]
    validators_left_red: []         # public validators the players cannot make green; may be [].
                                    # Reporting each is part of the expected answer:
                                    # [{node: <db>, rule: <validator output line>,
                                    #   why: <why it cannot be made green>}]

tooling_expectations:               # the GM's silent tooling expectations, apart from the fault
                                    # instances; may be []. No visibility, no sealed check:
                                    # judged in feedback. An issue covers one through its covers
                                    # list. Under-tooling and overkill are findings, never faults;
                                    # the bastion and its tools are the players' kit, not the
                                    # customer's tooling.
  - id: <t1>                        # unique across fault instance ids and expectation ids
    need: <log analysis>            # the need, in a few words
    expected: <what monitoring the GM silently expects of the customer>
    acceptable: <what is acceptable, e.g. any of the top three tools for the need>
    notes: <for feedback>           # optional
