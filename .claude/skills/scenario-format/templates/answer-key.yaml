# answer-key.yaml — template for scenarios/<scenario-id>/gm/answer-key.yaml
#
# Version v0.5, expected to evolve as games are played.
# Shape: v0.1 master spec section 6.2 ("The answer key"), v0.2 master
# spec 6.3 (capture W1 of specs/versions/v0.2/wave-log.md), v0.3 master
# spec 6.2 and 11 (capture W1 of specs/versions/v0.3/wave-log.md, item 4:
# a behavioural check's window and threshold) and v0.4 master spec 6.2,
# 12 and 13.4 (capture W1 of specs/versions/v0.4/wave-log.md, item 2: a
# check judging runs or triggers, its threshold) and v0.5 master spec 6.3
# and 6.8 (a register fault's diff, a cascade's backlog, a third party's
# evidence, a report-only fault outside the players' layers; capture W1 of
# specs/versions/v0.5/wave-log.md). This file and
# scenario.yaml are AUTHORITATIVE. It lives under gm/, which is sealed:
# never shipped to any node, never shown to the players before their
# final answer.
#
# Markers:
#   every key is REQUIRED unless marked otherwise;
#   "# optional: <when>"  the key is present only when <when> holds.
# An empty list (`[]`) is a valid value where its comment says so; an
# absent key is not.
# Replace every <placeholder>. A filled file keeps no <placeholder>.

scenario:
  id: <scenario-id>                 # as in scenario.yaml
  version: <0.1.0>                  # as in scenario.yaml
notes: gm/notes.md                  # longer explanations the GM draws on for feedback

instances:                          # exactly one entry per fault instance in scenario.yaml
  - instance: <f1>                  # fault instance id from scenario.yaml
    what: <what is wrong, concretely, on this node>
    why: <why it is wrong, the risk or the cost>
    evidence:                       # as the `player` OS user (and `dba` in psql)
      - where: <node:db>            # where it is run: bastion (a shell on the bastion, psql
                                    # from there included) | node:<name> (a node other than the
                                    # bastion) | ui:<name> (a route of the bastion's web_routes)
                                    # | report:<tool> (a generated report; <tool> lowercase,
                                    # e.g. report:pgbadger). A fault definition reads only at
                                    # node, bastion or report:<tool> (v0.3 master spec 6.3): a
                                    # reading through a web interface, or on a node other than
                                    # the target, is the scenario's and lives here only (D167);
                                    # the fault's node is written node:<its target node>
        source: <file, view or command output>   # what is looked at (v0.1's free-text where, D101)
        how: <command run as player>
        shows: <what in the output reveals it>
    acceptable:                     # what counts as an acceptable answer. A fault on a component
                                    # that is no layer of the players' (a ward display's firmware;
                                    # v0.5 master spec 6.3) resolves by report only: judged at the
                                    # final answer, never cleared by the GM during play. A register
                                    # fault resolves by propose: the corrected entry, judged at the
                                    # final answer against register_diff. No expected fix names a
                                    # third party's node (v0.5 master spec 10.1)
      diagnosis: <what a correct diagnosis names>
      proposal: <what an acceptable recommendation says>
                                    # optional: when an issue covering it expects propose,
                                    # or the fault lists propose
      fix: <what state counts as fixed, by any path (file and reload, ALTER SYSTEM)>
                                    # optional: when an issue covering it expects fix,
                                    # or the fault lists fix and the node is fixable
      improvement: <what counts as better>
                                    # optional: when an issue covering it expects improve,
                                    # or the fault lists improve and the node is fixable
    sealed_check:                   # from v0.5 a check may read a third party's side as evidence
                                    # (callbacks sent against callbacks received, a vault's
                                    # manifests); it judges the customer's side only (v0.5 master
                                    # spec 6.3, 10.1)
      script: <faults/pg-hba-trust/checks/fixed.sh>   # the fault definition's check
      at_handover: 1                # expected exit code once planted (1: present); a check may
                                    # also exit 0 (fixed), 3 (too soon to tell, the remaining
                                    # window on its first line) or another code (error).
                                    # 3 only for a check judging runs or triggers whose job
                                    # another instance, planted before it, keeps from a witness
                                    # until after the hand-over, named in interactions as
                                    # masked-by: the hand-over check then passes on a 3 and
                                    # fails on any other reading, a 1 included (v0.4 master
                                    # spec 12.2)
      window: <30m>                 # optional: required exactly when the fault's
                                    # sealed_check.behavioural is true (v0.3 master spec 6.2, 11);
                                    # a duration, the trailing window the check judges. Never
                                    # with judges
      judges: <runs>                # optional: exactly when the fault's sealed_check.judges is
                                    # set, and equal to it (runs | triggers); the check judges a
                                    # purpose's runs or triggers since the judged moment, which
                                    # it gets as CHECK_SINCE (v0.4 master spec 6.2, 12)
      threshold: <0>                # optional: required exactly with window (v0.3) or with judges
                                    # (v0.4). With window: a number, as written, the limit the
                                    # window is judged against (with a margin, v0.3 master spec
                                    # 11 rule 2). With judges: a non-negative integer, the
                                    # violations tolerated, 0 unless the scenario says otherwise
      notes: <anything scenario-specific about reading its result>
    interactions: []                # with other instances; may be []:
                                    # [{instance: <f2>, kind: masks | masked-by | conflicts-with,
                                    #   note: <how it changes the evidence or the answer>}]
    validators_left_red: []         # public validators the players cannot make green; may be [].
                                    # Reporting each is part of the expected answer:
                                    # [{node: <db>, rule: <validator output line>,
                                    #   why: <why it cannot be made green>}]
    register_diff:                  # optional: a register fault instance only (a fault planted in
                                    # the data register handout; v0.5 master spec 6.3, 6.8, D333):
                                    # non-empty, each item the entry, the field, the true value and
                                    # the value handed out, or the one item {absent: true} for a
                                    # register left out. Shown in the scenario document's "Data
                                    # register" section. The true key reads as a YAML boolean key
      - entry: <core-owners>        # optional: every item but an absent one; an entry id of the
                                    # true register (gm/data-register.yaml)
        field: <shared_with>        # optional: with entry; the entry's field the handout changes
        true: <[the portal, the back office, the messaging service, cold storage]>
                                    # optional: with entry; the field's value in the true register
        handed_out: <[the portal, the back office, the messaging service]>
                                    # optional: with entry; its value in player/data-register.md
        absent: true                # optional: alone, the item of a register left out (no
                                    # player/data-register.md handed over)
    backlog:                        # optional: a round-trip fault instance (a cascade; v0.5 master
                                    # spec 6.3): the requests the fault left stuck before the fix,
                                    # a consequence the GM may credit the players for cleaning up;
                                    # never a fault, never counted toward the fault cap or the score
      what: <the requests stuck, e.g. orders marked sent with no lab order behind them>
      cleanup: <what counts as cleaned up, e.g. each resent under its own key, or reconciled>

tooling_expectations:               # the GM's silent tooling expectations, apart from the fault
                                    # instances; may be []. No visibility, no sealed check:
                                    # judged in feedback. An issue covers one through its covers
                                    # list. Under-tooling and overkill are findings, never faults;
                                    # the bastion and its tools are the players' kit, not the
                                    # customer's tooling. From v0.4 one may name an unmonitored
                                    # instance (a second postgres node no exporter scrapes, by
                                    # design; v0.4 master spec 13.4): its need and expected name
                                    # the node in words, nothing more.
  - id: <t1>                        # unique across fault instance ids and expectation ids
    need: <log analysis>            # the need, in a few words
    expected: <what monitoring the GM silently expects of the customer>
                                    # (an unmonitored instance: "the agency's reporting instance
                                    # scraped by an exporter of its own, or its absence noted")
    acceptable: <what is acceptable, e.g. any of the top three tools for the need>
    notes: <for feedback>           # optional
