# fault.yaml — template for faults/<fault-id>/fault.yaml
#   (or scenarios/<scenario-id>/faults/<fault-id>/ for a scenario-only fault)
#
# Version v0.3, expected to evolve as games are played.
# Shape: v0.1 master spec sections 8 and 8.1, v0.2 master spec 6.4 and 6.5,
# v0.3 master spec 6.3, 6.5 and 6.7; keys of v0.2's capture W1
# (specs/versions/v0.2/wave-log.md, item 8) and v0.3's capture W1
# (specs/versions/v0.3/wave-log.md, item 2: aging, evidence locations,
# behavioural checks).
#
# Markers:
#   every key is REQUIRED unless marked otherwise;
#   "# optional: <when>"  the key is present only when <when> holds.
# An empty list (`[]`) or map (`{}`) is a valid value where its comment
# says so; an absent key is not.
# Replace every <placeholder>. A filled file keeps no <placeholder>.
#
# Known or hidden is NOT part of the definition: it is chosen per fault
# instance, in scenario.yaml.

# --- Identity ---------------------------------------------------------
id: <fault-id>                      # lowercase, hyphens (pg-hba-trust)
version: <0.1.0>                    # semver string; a fault never bumps (D60): it keeps its
                                    # version whatever changes in its folder
title: <one line>
family: <security>                  # security, performance, replication, backups, rules, ...
severity: <medium>                  # low | medium | high | critical

# --- Where it applies -------------------------------------------------
applies_to:
  bricks:                           # every brick this fault touches; a fault about mounted
                                    # material names only the brick that ships it
    - id: <postgres>
      versions: [<"0.1.0">]         # brick versions it is known to work on, one by one, exact
                                    # strings (["0.1.0", "0.1.1", "0.2.0"]), never a range; each
                                    # brick bump adds its version to every fault still applying
  preconditions: []                 # topology preconditions ("needs a standby"); may be []

# --- How long its evidence takes -----------------------------------------
aging:                              # v0.3 master spec 6.3 (D114)
  technique: real-time              # the only technique in v0.3: the system runs for real
  minimum: <2h>                     # a duration <integer><s|m|h|d> (30m, 2h, 2d): how long the
                                    # evidence takes to show under the load once planted; 0m when
                                    # it shows at once. Counted only in a scenario with scheduler
                                    # nodes (master spec 8, D160); an instance may raise it
                                    # (scenario.yaml aging_minimum)

# --- Parameters the scenario sets -------------------------------------
parameters:                         # map; may be {}. A fault about mounted material has a
                                    # required parameter `node`, naming the affected node
  <name>:                           # given to inject/ and checks/ scripts as FAULT_<NAME>
    description: <what it selects (which table, which setting)>
    default: <value or null>
    required: <false>

# --- How it is planted ------------------------------------------------
injection:
  kind: <seed-file>                 # seed-file: the change is part of a node's seed files,
                                    #   written into scenarios/<id>/nodes/<node>/ at authoring;
                                    # state: the GM streams inject/ scripts into the node;
                                    # parameter: a change to a parameter of the target node,
                                    #   applied by the renderer when it writes the local
                                    #   implementation (seed-file | state | parameter)
  stage: <seed>                     # seed (present from first start: seed-file, parameter)
                                    # | after-data-load (state faults, before hand-over)
  seed_changes:                     # optional: kind seed-file only
    - file: <pg_hba.conf>           # a seed file name the target brick declares in seed.files
      change: <what the scenario's copy of the file must contain>
      material: <inject/pg_hba.conf.snippet>   # optional: a snippet to paste
  scripts:                          # optional: kind state only; run in this order
    - <inject/10-plant.sh>
  parameter_changes:                # optional: kind parameter only; applied in this order
    - parameter: <node_health>      # a parameter of the target node's brick
      op: <remove-entry>            # set | remove-entry | remove-from-entry
      entry: "<{NODE}>"             # optional: remove-entry, remove-from-entry; the map key
      item: "<{SERVICE}>"           # optional: remove-from-entry; the list item removed (a
                                    # `default` entry is first expanded to the brick's processes)
      value: <scalar>               # optional: set; the new value
      change: <what the change does to the node, e.g. "the node gets no node-health script">
  # {NAME} in entry, item or value is replaced by the instance's fault
  # parameter NAME (the name upper-cased, - as _, as for FAULT_<NAME>). A
  # fault is about mounted material when a parameter_changes[].parameter is
  # the `parameter` of a companion.mounted item of the target brick.
  run_as: root                      # injection scripts run as root unless stated here
  # Contract (master spec 8.1): POSIX shell, fed on stdin to `sh -s` inside
  # the target container, parameters as FAULT_<NAME> environment variables.
  # Idempotent: running twice leaves the same state. Exit 0 on success; any
  # other code fails the setup. Nothing used for injection stays on the node.

# --- What the players can see ------------------------------------------
evidence:                           # as the `player` OS user (and `dba` in psql)
  - where: <node>                   # where it is read (v0.3 master spec 6.3, D145):
                                    #   node: a shell on the fault's target node;
                                    #   bastion: a shell on the bastion (psql from there included);
                                    #   report:<tool>: a report generated by <tool>, one of the
                                    #   target brick's report_tools (report:pgbadger).
                                    # Never ui:<name> or node:<name>: a reading through a web
                                    # interface or on another node is the scenario's, written in
                                    # its answer key only
    source: <file, view or command output looked at>   # v0.2's free-text where, moved
    how: <command run as player, e.g. "cat /etc/postgresql/pg_hba.conf">
    shows: <what in the output reveals the fault>

probe:                              # solvability probe: descriptive only in v0.1
  description: checks/probe.md      # what it would run as player and what it expects
  runs_as: player

# --- Resolutions and acceptance ----------------------------------------
resolutions:                        # which expected resolutions make sense for this fault
  - kind: <report>                  # report | propose | fix | improve
    write_policies: [<report-only>, <fixable>]   # node write policies under which it is possible
  - kind: <fix>
    write_policies: [<fixable>]
acceptance:                         # what counts as acceptable
  diagnosis: <what a correct diagnosis names>
  proposal: <what an acceptable proposal recommends>   # optional: when resolutions lists propose
  fix: <what state counts as fixed>                    # optional: when resolutions lists fix
  improvement: <what counts as better>                 # optional: when resolutions lists improve

# --- The sealed check ----------------------------------------------------
sealed_check:
  script: checks/fixed.sh
  run_as: root
  behavioural: true                 # optional: the check judges behaviour over a window (latency,
                                    # errors) rather than a cause; the answer key then gives the
                                    # instance's window and threshold (v0.3 master spec 6.2, 11)
  # Contract (master spec 8.1, v0.3 master spec 6.5): POSIX shell, fed on
  # stdin to `sh -s` in the target container, parameters as FAULT_<NAME>
  # environment variables (a behavioural check also gets
  # CHECK_WINDOW_SECONDS and CHECK_THRESHOLD).
  # Exit 0: the fault is no longer present in the EFFECTIVE LIVE STATE;
  # exit 1: still present; exit 3: too soon to tell, the remaining window
  # on the first output line; any other code: error.
  # First output line: why, in one sentence the GM can reuse in feedback.
  # A fix counts whichever path the player took (file edit and reload, or
  # ALTER SYSTEM): check the value in effect, not only the file.
  # PostgreSQL (v0.3): a check connects as the GM check role `gm_check`,
  # inside the GM's connection reserve, through the root-only helper
  #   /usr/local/lib/gm/check-psql -d <db> -Atq -v ON_ERROR_STOP=1 <<'SQL'
  # (postgres 0.3.0, capture W1 item 8). Never as dba, never as an
  # application role.

# --- Interactions with other faults ------------------------------------
interactions:                       # fault ids; each list may be []
  masks: []                         # this fault hides those
  masked_by: []                     # those hide this one
  conflicts_with: []                # cannot be planted together

# --- When the fault is known ---------------------------------------------
complaint_template: >-
  <How the customer would describe the symptom, in their words, without
  naming the cause. Parameters may appear as {NAME}.>
