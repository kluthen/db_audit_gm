# fault.yaml — template for faults/<fault-id>/fault.yaml
#   (or scenarios/<scenario-id>/faults/<fault-id>/ for a scenario-only fault)
#
# Version v0.6, expected to evolve as games are played.
# Shape: v0.1 master spec sections 8 and 8.1, v0.2 master spec 6.4 and 6.5,
# v0.3 master spec 6.3, 6.5 and 6.7, v0.4 master spec 6.3, 6.5 and 6.9;
# keys of v0.2's capture W1 (specs/versions/v0.2/wave-log.md, item 8),
# v0.3's capture W1 (specs/versions/v0.3/wave-log.md, item 2: aging,
# evidence locations, behavioural checks) and v0.4's capture W1
# (specs/versions/v0.4/wave-log.md, item 3: applies_to.purposes,
# needs_unshared_host, sealed_check.judges); v0.5 master spec 6.4 and 6.8
# (an option required or its absence planted, a register fault, a partner's
# misbehaviour; capture W1 of specs/versions/v0.5/wave-log.md, items 1 and 2);
# v0.6 master spec 6.3, 6.9, 6.10 and 9.5 (fake aging's support, the history
# signature, a seed change's declared lines, the documentation family;
# capture W1 of specs/versions/v0.6/wave-log.md, items 0, 4 and 5).
#
# Markers:
#   every key is REQUIRED unless marked otherwise;
#   "# optional: <when>"  the key is present only when <when> holds.
# An empty list (`[]`) or map (`{}`) is a valid value where its comment
# says so; an absent key is not.
# Replace every <placeholder>. A filled file keeps no <placeholder>.
#
# Known or hidden is NOT part of the definition: it is chosen per fault
# instance, in scenario.yaml.

# --- Identity ---------------------------------------------------------
id: <fault-id>                      # lowercase, hyphens (pg-hba-trust)
version: <0.1.0>                    # semver string; a fault never bumps (D60): it keeps its
                                    # version whatever changes in its folder
title: <one line>
family: <security>                  # security, performance, replication, backups, rules,
                                    # data-flow, ... From v0.4 (master spec 6.3): a purpose fault
                                    # is data-flow (duplicates, dropped records) or rules (a wrong
                                    # zone, a wrong segment); a governance or credential fault is
                                    # security, its id governance-<what> or security-<what>. From
                                    # v0.5 a register fault is security, its id
                                    # governance-register-<what> (master spec 6.4). From v0.6 a
                                    # network-overview fault is documentation, its id
                                    # docs-overview-<what>: a seed-file fault on the bastion
                                    # alone whose seed_changes name network-overview.md (the
                                    # handout), nothing else; the network-overview skill writes
                                    # the changed handout, the system is untouched, the answer
                                    # key's overview_diff states the change (v0.6 master spec 6.3)
severity: <medium>                  # low | medium | high | critical

# --- Where it applies -------------------------------------------------
applies_to:
  bricks:                           # every brick this fault touches; a fault about mounted
                                    # material names only the brick that ships it
    - id: <postgres>
      versions: [<"0.1.0">]         # brick versions it is known to work on, one by one, exact
                                    # strings (["0.1.0", "0.1.1", "0.2.0"]), never a range; each
                                    # brick bump adds its version to every fault still applying.
                                    # A purpose fault lists the scheduler versions its runner
                                    # needs, its sealed check running there (v0.4 master spec 6.3)
  purposes: [<shop-customer-mailing>]   # optional: a purpose fault; non-empty, purpose ids
                                    # (purposes/<id>/), the purposes it attaches to; a scenario
                                    # planting it maps each in its purposes:
  preconditions: []                 # topology preconditions ("needs a standby"); may be []
needs_unshared_host: true           # optional: the fault's node must never be placed on a shared
                                    # host (the out-of-memory incident); a boolean, absent read as
                                    # false; gmctl fit refuses a mapping that does (v0.4 master
                                    # spec 13.3)
requires_option: <monitoring>       # optional: the fault needs its target node to choose this
                                    # option (scenario.yaml options:), one its brick declares; a
                                    # lost pg_monitor grant on the monitoring role (v0.5 master
                                    # spec 6.4, 17.2)
option_absent: <monitoring>         # optional: the fault plants the option's absence: a
                                    # monitoring node scraping a node that does not choose it
                                    # (v0.5 master spec 6.4, s10); never with requires_option
                                    # naming the same option. Required by injection.kind
                                    # topology (spec D459)

# --- How long its evidence takes -----------------------------------------
aging:                              # v0.3 master spec 6.3 (D114)
  technique: real-time              # the only technique in v0.3: the system runs for real
  minimum: <2h>                     # a duration <integer><s|m|h|d> (30m, 2h, 2d): how long the
                                    # evidence takes to show under the load once planted; 0m when
                                    # it shows at once. Counted only in a scenario with scheduler
                                    # nodes (master spec 8, D160); an instance may raise it
                                    # (scenario.yaml aging_minimum). A fault whose evidence shows
                                    # only at a time of day (business hours) or at a job's runs (a
                                    # jobs.yaml job, a purpose's job, a database node's pg_cron job
                                    # or crontab entry; v0.4 master spec 6.3) counts it from that
                                    # moment's first occurrence after planting, the job's first
                                    # run after planting; the scenario then raises the instance's
                                    # aging_minimum to that moment's offset from its designed T0
                                    # plus this (spec D189; the loader cannot check it, the
                                    # fault's gm.md says so)
  fake:                             # optional: absent, "not assessed", refused in a fake game
                                    # (v0.6 master spec 6.3, 6.9, 9.5); in a real game unused
    support: <tail-only>            # supported | tail-only (genuine only in the real tail after
                                    # the restart) | real-only (fake aging cannot show it)
    reason: >-
      <One sentence: why this support (the autovacuum "not yet removable"
      lines are genuine only in the tail; the fill holds the snapshot).>
    tail_minimum: <2h>              # optional: tail-only only; a duration, the least tail the
                                    # evidence needs
    tail_covers: [<"12:00">]        # optional: tail-only only; quoted "HH:MM" scenario-time
                                    # instants the tail must hold (a job's run). A tail-only fault
                                    # gives tail_minimum, tail_covers or plant_in: tail
    plant_in: <any>                 # optional: any (the default) | tail, planted in the real tail
    fill:                           # optional: absent, the fill imitates nothing for it
      emulate: [<held-snapshot>]    # what the fill must imitate; may be []
  # gm.md gains a "Fake aging" note when the support is tail-only or
  # real-only (v0.6 master spec 6.3).

# --- Its history signature (v0.6) ---------------------------------------
history:                            # optional: mandatory unless aging.fake.support is real-only
                                    # (refused empty or missing on a supported or tail-only fault;
                                    # absent on a fault not assessed). The fault's trail in
                                    # Prometheus over the faked span (v0.6 master spec 6.3, 6.9,
                                    # 9.7); a fault with none says so with the one entry
                                    # - kind: none. Every number in it is measured
  - kind: <counter_per_call>        # counter_per_call | gauge_sawtooth | gauge_before |
                                    # daily_spike | remove | queue | none, its fields (W1 item 4):
                                    # counter_per_call: series, key, per_call (a number), and
                                    #   node when needed;
                                    # gauge_sawtooth: series, period (a duration), amplitude (a
                                    #   number); phase optional (a duration, 0s);
                                    # gauge_before: series, value (the level until the planting);
                                    # daily_spike: series, at ("HH:MM", scenario time), duration,
                                    #   value (the level during the spike);
                                    # remove: series;
                                    # queue: key, and exactly one of service {median, sigma} and
                                    #   lock {median, sigma, blocks: [<key>...]}; node optional;
                                    # none: no field, the list's only entry.
                                    # {NAME} (a parameter of the fault, as in parameter_changes)
                                    # or {INSTANCE_NODE} (the instance's node:) in strings only
                                    # (series, key, node); numbers are numbers
    series: <'node_health_cpu_seconds_total{node="{NODE}"}'>   # optional: per kind, above
    key: <'{KEY}'>                  # optional: per kind, above; the scheduler key
    per_call: <0.067>               # optional: per kind, above; measured
    node: <producer>                # optional: per kind, above; the scheduler node running key,
                                    # absent: the one scheduler node whose queries.yaml has it
    suppressed_by: [<pg-table-autovacuum-off>]   # optional: any kind; fault ids: the entry is
                                    # dropped while one of them is selected (it hides this trail)

# --- Parameters the scenario sets -------------------------------------
parameters:                         # map; may be {}. A fault about mounted material has a
                                    # required parameter `node`, naming the affected node
  <name>:                           # given to inject/ and checks/ scripts as FAULT_<NAME>
    description: <what it selects (which table, which setting)>
    default: <value or null>
    required: <false>

# --- How it is planted ------------------------------------------------
injection:
  kind: <seed-file>                 # seed-file: the change is part of a node's seed files,
                                    #   written into scenarios/<id>/nodes/<node>/ at authoring;
                                    # state: the GM streams inject/ scripts into the node;
                                    # parameter: a change to a parameter of the target node,
                                    #   applied by the renderer when it writes the local
                                    #   implementation;
                                    # topology (v0.5, spec D459): planted at render by the
                                    #   scenario's topology itself, its node not choosing the
                                    #   option the fault's option_absent names; no seed_changes,
                                    #   scripts or parameter_changes, stage seed; gmctl inject
                                    #   and inject --at run nothing for it
                                    #   (seed-file | state | parameter | topology).
                                    # A purpose fault is planted the same ways (v0.4 master spec
                                    #   6.3): a seed-file change (a runner's queries.yaml,
                                    #   scripts/ or jobs.yaml; a database node's data file,
                                    #   postgresql.conf or crontab), a state change during the
                                    #   aging, or a timeline change of a schedule for an outside
                                    #   party's behaviour, which the definition states and the
                                    #   scenario writes
  stage: <seed>                     # seed (present from first start: seed-file, parameter,
                                    # topology)
                                    # | after-data-load (state faults, before hand-over)
  seed_changes:                     # optional: kinds seed-file and state; a state fault's are
                                    # in the scenario's copies from T0 as a seed-file fault's,
                                    # its scripts planting the rest later (v0.4 master spec 6.3,
                                    # spec D254). A register fault (v0.5 master spec 6.4) is a
                                    # seed-file change on the bastion, seed_changes file
                                    # data-register.md (the handout, player/data-register.md):
                                    # its id governance-register-*, family security; the
                                    # data-register skill writes the changed handout, the answer
                                    # key's register_diff states the change
    - file: <pg_hba.conf>           # a seed file name the target brick declares in seed.files
                                    # (a directory entry as written there: builders/, scripts/);
                                    # an optional one (seed.optional) only on a node seeding it;
                                    # or `data`, the target node's data file (data.file), refused
                                    # on a node without one: not a seed file of the brick, the
                                    # scenario's copy carries the change, in place from the data
                                    # load, before T0 (v0.4 master spec 6.3, spec D226)
      change: <what the scenario's copy of the file must contain>
      material: <inject/pg_hba.conf.snippet>   # optional: a snippet to paste
      lines:                        # optional: the literal lines the change puts in the
                                    # scenario's copy, {NAME} parameter placeholders allowed (v0.6
                                    # master spec 6.3, 6.9; spec D510, D521), so a program can find
                                    # them (a change is prose, a material an example, a diff or a
                                    # whole file). The loader looks for each, placeholders
                                    # replaced from the instance's parameters (else the defaults),
                                    # in the node's copy of file (a folder entry: any file of the
                                    # folder; data: the node's data file), line by line anywhere:
                                    # found when a line of the copy, both stripped and their runs
                                    # of blanks made one, equals it or continues it with a comment
                                    # (# or -- after a blank). Refused on data-register.md and
                                    # network-overview.md, generated handouts. Give it whenever the
                                    # change's text is the same in every copy; without it the GM
                                    # reads the copy
        - <"host all all 0.0.0.0/0 trust">
  scripts:                          # optional: kind state only; run in this order, each on the
                                    # instance's node, as run_as, with the FAULT_<NAME> variables
    - <inject/10-plant.sh>
    # From v0.5 (spec D459) an item may run on another node:
    #   - {script: inject/20-elsewhere.sh, on: <parameter>}
    # <parameter> a required parameter of the fault (required: true) whose
    # value in the scenario's instance names a node of the topology whose
    # brick applies_to names; the script runs there under the same contract,
    # in this order (a planted report rewritten on the database node while
    # the instance's node is the runner reading it)
  parameter_changes:                # optional: kind parameter only; applied in this order
    - parameter: <node_health>      # a parameter of the target node's brick
      op: <remove-entry>            # set | remove-entry | remove-from-entry
      entry: "<{NODE}>"             # optional: remove-entry, remove-from-entry; the map key
      item: "<{SERVICE}>"           # optional: remove-from-entry; the list item removed (a
                                    # `default` entry is first expanded to the brick's processes)
      value: <scalar>               # optional: set; the new value
      change: <what the change does to the node, e.g. "the node gets no node-health script">
  # {NAME} in entry, item or value is replaced by the instance's fault
  # parameter NAME (the name upper-cased, - as _, as for FAULT_<NAME>). A
  # fault is about mounted material when a parameter_changes[].parameter is
  # the `parameter` of a companion.mounted item of the target brick.
  run_as: root                      # injection scripts run as root unless stated here
  # Contract (master spec 8.1): POSIX shell, fed on stdin to `sh -s` inside
  # the target container, parameters as FAULT_<NAME> environment variables.
  # Idempotent: running twice leaves the same state. Exit 0 on success; any
  # other code fails the setup. Nothing used for injection stays on the node.

# --- A partner's misbehaviour (v0.5) -------------------------------------
partner_behaviour:                  # optional: a partner's misbehaviour (master spec 6.4): an
                                    # outage, slow answers, errors, a lost, late, duplicated or
                                    # out-of-order callback; behaviour seen at the partner's
                                    # interface, never a root cause inside it. Its instance's
                                    # node is one of the partner's shared nodes (no-access); every
                                    # fix is on the customer's side (master spec 10.1)
  partner: <northfield-lab>         # the third party, by its third_parties id (a parameter's value)
  key: <xlab.outage>                # the state key switching that partner's state on the shared
                                    # nodes, read by its own routes; never a stop of a shared node
  placed: <timeline>                # timeline (a change at the planting moment) | standing (from T0)
  material: <material/>             # the fault's own material for the shared nodes, never the domain's

# --- What the players can see ------------------------------------------
evidence:                           # as the `player` OS user (and `dba` in psql)
  - where: <node>                   # where it is read (v0.3 master spec 6.3, D145):
                                    #   node: a shell on the fault's target node;
                                    #   bastion: a shell on the bastion (psql from there included);
                                    #   report:<tool>: a report generated by <tool>, one of the
                                    #   target brick's report_tools (report:pgbadger).
                                    # Never ui:<name> or node:<name>: a reading through a web
                                    # interface or on another node is the scenario's, written in
                                    # its answer key only
    source: <file, view or command output looked at>   # v0.2's free-text where, moved
    how: <command run as player, e.g. "cat /etc/postgresql/pg_hba.conf">
    shows: <what in the output reveals the fault>

probe:                              # solvability probe: descriptive only in v0.1
  description: checks/probe.md      # what it would run as player and what it expects
  runs_as: player

# --- Resolutions and acceptance ----------------------------------------
resolutions:                        # which expected resolutions make sense for this fault
  - kind: <report>                  # report | propose | fix | improve
    write_policies: [<report-only>, <fixable>]   # node write policies under which it is possible
  - kind: <fix>
    write_policies: [<fixable>]
acceptance:                         # what counts as acceptable
  diagnosis: <what a correct diagnosis names>
  proposal: <what an acceptable proposal recommends>   # optional: when resolutions lists propose
  fix: <what state counts as fixed>                    # optional: when resolutions lists fix
  improvement: <what counts as better>                 # optional: when resolutions lists improve

# --- The sealed check ----------------------------------------------------
sealed_check:
  script: checks/fixed.sh
  run_as: root
  behavioural: true                 # optional: the check judges behaviour over a window (latency,
                                    # errors) rather than a cause; the answer key then gives the
                                    # instance's window and threshold (v0.3 master spec 6.2, 11)
  judges: runs                      # optional: runs | triggers, a check judging a purpose's runs
                                    # or triggers since the judged moment (v0.4 master spec 6.3,
                                    # 12); absent: the check judges the live state, as in v0.3.
                                    # Never with behavioural; the answer key then gives the
                                    # instance's judges (the same) and threshold, and no window
  # Contract (master spec 8.1, v0.3 master spec 6.5, v0.4 master spec 6.5):
  # POSIX shell, fed on stdin to `sh -s` in the target container,
  # parameters as FAULT_<NAME> environment variables (a behavioural check
  # also gets CHECK_WINDOW_SECONDS and CHECK_THRESHOLD; a check with judges
  # gets CHECK_THRESHOLD and CHECK_SINCE, the judged moment as a UTC instant
  # YYYY-MM-DDTHH:MM:SSZ).
  # Exit 0: the fault is no longer present in the EFFECTIVE LIVE STATE;
  # exit 1: still present; exit 3: too soon to tell, the remaining window
  # on the first output line; any other code: error.
  # First output line: why, in one sentence the GM can reuse in feedback.
  # A fix counts whichever path the player took (file edit and reload, or
  # ALTER SYSTEM): check the value in effect, not only the file.
  # PostgreSQL (v0.3): a check connects as the GM check role `gm_check`,
  # inside the GM's connection reserve, through the root-only helper
  #   /usr/local/lib/gm/check-psql -d <db> -Atq -v ON_ERROR_STOP=1 <<'SQL'
  # (postgres 0.3.0, capture W1 item 8). Never as dba, never as an
  # application role. A check comparing two instances (v0.4) reaches each
  # as gm_check: from a scheduler node through check-sql, from a database
  # node through check-psql with the other node's name (postgres 0.4.0).

# --- Interactions with other faults ------------------------------------
interactions:                       # fault ids; each list may be []
  masks: []                         # this fault hides those
  masked_by: []                     # those hide this one
  conflicts_with: []                # cannot be planted together

# --- When the fault is known ---------------------------------------------
complaint_template: >-
  <How the customer would describe the symptom, in their words, without
  naming the cause. Parameters may appear as {NAME}.>
