# purpose.yaml — template for purposes/<purpose-id>/purpose.yaml
#
# Version v0.5, expected to evolve as games are played.
# Shape: v0.4 master spec 6.7 and 8 (kinds 8.2, trace 8.3, methods 8.6,
# invariants and witnesses 12), with the keys and closed values capture W1
# of specs/versions/v0.4/wave-log.md (item 5) settles; specs/formats.md,
# "Purpose definition"; v0.5 master spec 6.6 and 12.1 with formats.md
# "Purpose definition" (from v0.5: the round trip, the api and partner parts,
# HTTP connections, endpoint material, periodic purposes, judged:,
# classification:, the ops schema; capture W1 of
# specs/versions/v0.5/wave-log.md, items 2, 3 and 5). A purpose is a catalogue unit beside bricks, faults
# and scenarios: what some of the customer's data is FOR. Its material
# (material/) is copied into a scenario at design time, so a purpose carries
# no version and never bumps; a scenario names it in purposes: for
# provenance and for the faults attached to it (applies_to.purposes).
#
# Markers:
#   every key is REQUIRED unless marked otherwise;
#   "# optional: <when>"  the key is present only when <when> holds.
# An empty list (`[]`) or map (`{}`) is a valid value where its comment
# says so; an absent key is not.
# Replace every <placeholder>. A filled file keeps no <placeholder>.
# Paths are relative to the purpose folder.
#
# Parts are the roles a scenario fills with its own nodes and databases
# (scenario.yaml purposes[].parts): source and target are databases (of
# one instance or of two, possibly the same one), runner a scheduler node of
# role transformer, consumer a scheduler node reading published results,
# receiver a stub node of role producer (a pushed obligation). The material
# is written for the first v0.4 scenario's mapping (nodes db, reporting, bi,
# crm, consumer, gateway; databases shop, reporting); the GM adapts names as
# it copies. From v0.5 two more parts: api, a customer's api node the
# purpose calls or brings endpoints to, and partner, a declared third
# party's node; a pushed obligation's receiver is a declared third party.
# Endpoint material (v0.5): material/api/<node>/routes/ and db/, the
# endpoints a purpose brings to a customer's api node, the layout of a
# domain's producers/api/<node>/; a receiver with no stream of its own (an
# authority, a head office) keeps its stub in the purpose (material/receiver/),
# a partner with streams of its own stays in its domain's
# producers/partners/<partner>/.
#
# The ops schema (v0.5 master spec 12.1): a purpose's own tables in a
# domain's database (its ledgers, incidents, watermarks) live in schema ops,
# never in public, where the domains' tables live; a target belonging to no
# domain keeps them in public. Every run writes one ops.runs row (or the
# target's runs) in the same transaction as its output.

# --- Identity ---------------------------------------------------------
id: <shop-sales-reporting>          # [a-z][a-z0-9-]*, the folder's name
title: <one line>
domains: [<shop>]                   # non-empty; domain ids (domains/<id>/), the domains it fits;
                                    # each lists this purpose in its domain.yaml purposes
kind: <pulled>                      # pulled | transformed-in-place | pushed | pushed-obligation
                                    # (master spec 8.2) | round-trip (v0.5, with round_trips:)

# --- Parts the scenario maps ------------------------------------------
parts:                              # part -> one line saying what fills it
  source: <the shop's database>     # a database
  target: <the agency's reporting database>   # a database; may be the source's (in place)
  runner: <the agency's transformer>          # a scheduler node of role transformer
  consumer: <the back office's dashboards>    # optional: a purpose with a consumer
  receiver: <the customs gateway stub>        # optional: a pushed obligation only; from v0.5
                                              # a declared third party's node
  api: <the lab's order API>        # optional: a customer's api node the purpose calls or brings
                                    # endpoints to (v0.5)
  partner: <the external lab>       # optional: a declared third party's node (v0.5)

# --- Jobs -------------------------------------------------------------
jobs:                               # non-empty
  - name: <rollup-hourly>           # its name in the runner's jobs.yaml
    key: <rollup.hourly>            # its key in the runner's queries.yaml
    part: runner                    # the part that runs it: a declared runner (runner, the only
                                    # one in v0.4)
    source: <source>                # the database parts it reads and writes: declared source or
    target: <target>                #   target parts
    method: <script>                # sql | script | foreign-tables | procedure | pg_cron
                                    # | cron-daemon (master spec 8.6; sql: one plain statement on
                                    # one connection)
    computes: <what the job computes, in one sentence>
    cadence: <"5 * * * *">          # quoted 5-field cron, scenario time, in the subset render can
                                    # shift (capture W1 item 0), as jobs.yaml's at
    connections:                    # connection name -> the customer role it connects as: a
      <source>: <shop_etl>          #   script's names (its job's connections:), or the job's one
      <target>: <bi_etl>            #   connection's name. From v0.5 an HTTP connection (the
                                    #   scheduler's http driver), named for the part it reaches
                                    #   (api, partner, receiver), -> the HTTP credential it calls
                                    #   with (schedule.yaml's credential), or public for a public
                                    #   endpoint
    feeder: <feed-medicines-register>   # optional: a periodic job (weekly, monthly, yearly; v0.5):
                                    # its daily feeder, a job of this purpose, the witness within
                                    # the aging. No periodic report runs on demand in v0.5

# --- Trace ------------------------------------------------------------
trace:                              # non-empty: each place the purpose leaves something
  - kind: <published-results>       # outbox-rows | published-results | run-ledger | definitions
                                    # (master spec 8.3)
    part: <target>                  # a declared part, on whose node or database the trace lies
    table: <rpt.sales_hourly>       # optional: exactly one of table and file; a table,
                                    # schema-qualified unless in public
    run_column: <run_id>            # optional: with table; the column that ties a row to the run
                                    # that wrote it
    file: </var/log/scheduler/scheduler.log>   # optional: exactly one of table and file; an
                                    # absolute path on that part's node

# --- Invariants -------------------------------------------------------
invariants:                         # non-empty
  - id: <R1>                        # [A-Z][0-9]+, once in the purpose (R1, L2, M3, E4)
    statement: <one sentence, stated against the source>
    check: <checks/rollup-matches-source.sh>   # a file of checks/
    parameters: {}                  # may be {}: name -> {description, default, required}, the
                                    # shape of fault.yaml's parameters
    witness: <what must exist in the data for a run to be able to violate it (master spec 12.3)>
    judged: <runs>                  # optional: how it is judged (v0.5): runs | triggers |
                                    # end-to-end (on the trace after the fix, wherever the player
                                    # fixed it; the backlog the fault left is the answer key's,
                                    # never the purpose's) | code (the sealed check reading the
                                    # job's code) | definition. A round trip names exactly one
                                    # end-to-end invariant

# --- Round trips (v0.5) ----------------------------------------------------
round_trips:                        # optional: required of a round-trip purpose, refused on
                                    # another kind; non-empty, one entry per exchange the purpose
                                    # carries (an exchange both ways carries two)
  - asks: <customer>                # who asks: customer | partner
    request:
      job: <post-lab-orders>        # the job sending it (or, the partner asking, the domain's
                                    # stream that does, named)
      counterpart: <lab-api POST /orders>   # who answers it, and where
      sends: <a consultation's analysis requests, one order per consultation and priority>
    correlation: <client_ref, C-<consultation id>-<priority>, unique per account>   # what an
                                    # answer carries to name its request
    answers:                        # non-empty: the expected answers
      - form: <accepted>            # accepted | rejected | a result
        when: <at once (201)>
        carries: <the accession>
    timeout:
      after: <no 2xx within 10s>    # when an answer counts as missing
      then: <retried at the next run with the same client_ref; escalated past the turnaround>
    reactions: [<requests sent, the accession kept in ops.lab_orders_sent>]   # the processes an
                                    # answer starts, the purpose's jobs or a domain's streams, named

# --- History (v0.5) -----------------------------------------------------
history: material/history.sql       # optional: a periodic purpose (required when a job names
                                    # its feeder), or one planting a past no periodic job extends
                                    # (no feeder: from v0.5 chunk 29, D366, D404); plants the past
                                    # into the target before T0, the partners' database allowed.
                                    # In a scenario with domains:, load-data runs it in the target
                                    # database after the sources' loads and the derivations, as the
                                    # superuser, reading the other parts through a temporary
                                    # foreign server it drops afterwards, every session unseen

# --- Target DDL (v0.5, chunk 29) -------------------------------------------
ddl:                                # optional: the DDL a part's database needs (roles, grants,
                                    # policies, ops tables) when the scenario maps that part to a
                                    # composed domain's database (a domains: entry's at:); read
                                    # from the catalogue at every load, as history is, never
                                    # copied. Refused for a part mapped elsewhere (office,
                                    # partners): there the DDL goes into the node's data file
  target: material/target-ddl.sql   # a database part the purpose declares (source, target) -> a
                                    # file of material/. load-data runs each after every domain's
                                    # load and partner file, before the derivations, the purposes:
                                    # entries in list order, the parts in parts:' order, as
                                    # postgres connected to the mapped database, unseen, with
                                    # customer_timezone, customer_utc_offset and load_epoch, no
                                    # keys; never CREATE DATABASE nor \connect (refused, naming the
                                    # line), the database named :"DBNAME", roles at top level (a
                                    # role two purposes create on one node guarded, DO ... IF NOT
                                    # EXISTS, its CREATE ROLE at the start of a line), counted by
                                    # model.node_creates (each login role gets its secret)

# --- Data moved -------------------------------------------------------
data_moved:                         # one entry per job, so governance can be checked against it
  - job: <rollup-hourly>            # a job of this purpose
    reads: []                       # may be []: classification keys <database>.<table>.<column>
                                    # of a class other than internal the job reads
    writes: [<target:rpt.sales_hourly>]   # <part>:<table>, where it writes them

# --- Customer roles ---------------------------------------------------
roles:                              # the customer roles the purpose needs, with their grants
  - name: <shop_etl>
    part: <source>                  # the database part it lives in
    reads: [<orders without customer_id>, <order_lines>, <products>]   # free text, as master
                                    # spec 9.7 writes grants; may be []
    writes: []                      # free text; may be []

# --- Classes of the tables it brings (v0.5) ---------------------------------
classification:                     # optional: a purpose whose target belongs to no domain, or
                                    # which adds tables to a domain's database (schema ops): the
                                    # classes of those tables' columns, as a domain classes its
                                    # own (template classification.yaml), so governance reads them
  columns:                          # column -> its class (personal | customer-linked | internal),
                                    # keyed as a scenario's copy keys them:
                                    # <database>.<table>.<column>, or
                                    # <database>.<schema>.<table>.<column> outside public
    <clinic.ops.lab_orders_sent.client_ref>: <internal>
