# brick.yaml — template for bricks/<brick-id>/brick.yaml
#
# Version v0.3, expected to evolve as games are played.
# Shape: v0.1 master spec section 7, v0.2 master spec 6.1 and v0.3 master
# spec 6.4 and 6.7; top-level keys fixed by v0.1's capture W1-A
# (specs/versions/v0.1/wave-log.md), amended by v0.2's capture W1
# (specs/versions/v0.2/wave-log.md: the footprint's shape, `interfaces`
# required, `companion.mounted`, `receives`, secret kinds, parameter shapes)
# and v0.3's capture W1 (specs/versions/v0.3/wave-log.md, item 3: the roles
# list, the growth per hour, `writable_paths`, `seed.paths`, `seed.modes`,
# directory seed entries, `only_with_role`, `report_tools`, `snapshot`);
# D59 dropped `compatible_faults`. Do not
# add, rename or drop a top-level key here; brick-specific extras go under
# `extra`.
#
# Markers:
#   every key is REQUIRED unless marked otherwise;
#   "# optional in v0.1"  the key has no use yet; it is left commented out
#                         and may be omitted;
#   "# optional: <when>"  the key is present only when <when> holds.
# An empty list (`[]`) is a valid value for a required list key where its
# comment says so; an absent key is not.
# Replace every <placeholder>. A filled file keeps no <placeholder>.
#
# Platform-neutral rules (v0.1 master spec 7): seeds and secrets come from the
# fixed paths declared here, never Swarm's default mount locations; the
# health check is a command; interfaces are container ports; peers are
# reached by node name only; nothing here names a Swarm-only feature.

# --- Identity ---------------------------------------------------------
id: <brick-id>                      # lowercase, hyphens (postgres, bastion)
version: <0.1.0>                    # semver string; any change to the brick's folder bumps it,
                                    # a change made while the new version is unreleased folds
                                    # into it (released by its version's release gate, D100)
roles:                              # each one of the closed list (v0.3 master spec 6.4): bastion
  - <role>                          #   producer queue database pooler transformer consumer
                                    #   monitoring backup
technology:
  name: <technology>                # postgresql, openssh
  version: "<engine-version>"       # quoted ("18")
image: 127.0.0.1:5000/dbagm/<brick-id>:<version>   # registry-qualified, never Docker Hub

# --- Footprint --------------------------------------------------------
footprint:                          # the default the GM starts from when it sizes a scenario,
                                    # in the shape of a node's `resources` (D84); a scenario sets
                                    # its own resources per node. Excludes any material other
                                    # bricks mount into this one (their docs/gm.md state its cost)
  limits:       {cpu: <1>, memory: <1G>}                  # CPUs; memory as 512M, 1G
  reservations: {cpu: <0.5>, memory: <512M>, disk: <1G>}   # at rest
  disk_growth_per_hour: <40M>       # a size: the volumes' growth per hour of aging and of game,
                                    # as measured, so `fit` scales it to the scenario's aging;
                                    # 0 when nothing grows (v0.3 master spec 6.4)
# footprint_ranges:                 # optional in v0.1 (shape to settle when first used)
#   cpu: {min: <0.25>, max: <2>}
#   memory: {min: <256M>, max: <4G>}
#   disk: {min: <512M>, max: <20G>}
stateful: <true>                    # boolean; pinning is the renderer's business

# --- What the scenario sets -------------------------------------------
parameters:                         # map; may be {} when the scenario sets nothing
  <name>:                           # a scalar is passed to the container as GM_<NAME> (upper case)
    description: <what it sets>
    default: <value or null>        # may be {} (a web-routes map with no route)
    required: <false>
    shape: <node-map>               # optional: a map-valued parameter; absent for a scalar.
                                    # node-map: node name -> `default` (that node's brick's
                                    #   processes) or a non-empty list of names from them; never
                                    #   passed as GM_*, the renderer writes per-node configs
                                    # web-routes: route name -> "node:port"; passed as GM_<NAME>,
                                    #   "name=node:port" tokens sorted by name, space-separated
                                    #   ("" when the map is empty)
knobs:                              # settings the player may change; may be [] (bastion)
  - setting: <shared_buffers>
    file: <in-container path of the file holding it, /etc/postgresql/postgresql.conf>
    default: <128MB>                # written as the technology accepts it (128MB, 5s, on)
    envelope: {min: <64MB>, max: <256MB>}   # or {allowed: [<v1>, <v2>]}
                                    # default envelope; a scenario may tighten it, never widen it

# --- Player plane -----------------------------------------------------
write_policies:                     # policies this brick supports
  - <fixable>                       # fixable | report-only
writable_paths:                     # may be []: in-container paths the player may change on a
  - <path>                          # fixable node, and the only paths a report-only node's
                                    # write_overrides may name (v0.3 master spec 6.4); a file or a
                                    # directory, absolute, no whitespace, no trailing /
protected_files:                    # in-container paths, root-owned, read-only
  - <path>
player_access:
  ssh_account: <player>
  group: <group>
  sudo_wrappers:                    # absolute paths; may be []
    - </usr/local/sbin/gm-validate>
capabilities:                       # added back after cap_drop: ALL
  - <CAP_NAME>                      # e.g. SETUID, SETGID, CHOWN, ...

# --- Runtime ----------------------------------------------------------
healthcheck:
  command: ["/bin/sh", "-c", "<check command>"]   # exec form; run inside the container
  interval: <10s>
  timeout: <5s>
  retries: <5>
  start_period: <30s>
secrets:                            # per-game secrets gmctl deploy creates; may be []
  - name: <logical-name>            # Swarm name is <game-id>_<name>; a name two bricks declare
                                    # is one secret, declared alike by both
    kind: <password>                # password | key-pair
    handed_over: <true>             # optional: kind password; true for a password players type
                                    # (16 characters, the player alphabet); absent or false: 32
                                    # characters, the dba alphabet
    pair: <player_ssh_key>          # optional: kind key-pair; the pair's name (ed25519, no
                                    # passphrase; files <pair> and <pair>.pub)
    half: <private>                 # optional: kind key-pair; private | public, the file mounted
    only_with_role: <pooler>        # optional: generated and mounted only when a node of the
                                    # topology has this role; absent: always
    path: </opt/gm/secrets/<logical-name>>   # fixed in-container path
    uid: <0>
    gid: <0>
    mode: "<0400>"                  # quoted octal string ("0400"); the renderer parses it base 8
seed:                               # where the scenario's seed files land (read-only configs)
  dir: </opt/gm/seed/>              # fixed in-container directory
  files:                            # seed file names the scenario must provide; may be []
    - <postgresql.conf>             # an entry ending in / is a directory of files the scenario
                                    # names (builders/), optional in seed_files; each file becomes
                                    # one seed config at <dir><entry><file>
  paths:                            # may be {} (no seed file): each seed file -> its live
    <postgresql.conf>: </etc/postgresql/postgresql.conf>   # in-container path; a directory for a / entry
  modes:                            # optional: a seed file whose config mode is not "0444" (0:0)
    <schedule.yaml>: "<0400>"       # quoted octal string
protected_configs:                  # read-only configs rendered per game; may be []
  - name: <logical-name>            # e.g. envelopes
    path: </opt/gm/protected/<file>>
    uid: <0>
    gid: <0>
    mode: "<0444>"                  # quoted octal string, as above
volumes:                            # named volumes; may be [] for a stateless brick
  - name: <name>                    # volume name becomes <game-id>_<node>_<name>
    path: <in-container path>
processes:                          # s6-overlay service names
  - <sshd>
snapshot:                           # optional: how each volume is copied at hand-over (v0.3 master
  <volume>: <copy>                  # spec 6.4, 12): pg_basebackup (the database's data, online; at
                                    # most one per brick, which ships gm-snapshot-db) | copy (a
                                    # plain copy while the node runs: seeded, append-only or
                                    # whole-file-rewritten files) | stop (a brief s6 stop of the
                                    # brick's services while the volume is copied). When present,
                                    # names every volume but the one at /run, once; absent: every
                                    # volume but /run by stop. /run is never copied

# --- Catalog links ----------------------------------------------------
# No fault list: which faults a brick hosts is stated only by each fault's
# applies_to (D59).
interfaces:                         # container ports; a scenario's flows connect a consumer to
                                    # a matching provider
  provides:                         # what the brick serves
    - name: <sql>
      protocol: <postgresql>        # postgresql, ssh, http
      port: <5432>
      web_path: </prometheus/>      # optional: a web interface the bastion's web front publishes:
                                    # /<route>/, the fixed path the upstream serves under, and
                                    # the key of the bastion's web_routes route that names it
  consumes:                         # what it reaches on other nodes, by node name; may be []
    - name: <sql>
      protocol: <postgresql>
      port: <5432>
report_tools: [<pgbadger>]          # optional: report generators players run on this node; a
                                    # fault's evidence may name report:<tool> for one of them
companion:                          # optional: only when the brick ships companion/ material
  path: companion/
  when: <when the GM runs or uses it, e.g. "before deploying a scenario that uses this brick">
  mounted:                          # optional: material the GM mounts into other nodes at deploy
    - name: <node-health>           # item name, lowercase, hyphens
      parameter: <node_health>      # this brick's node-map parameter, set on its own node in the
                                    # scenario; its keys are the receiving nodes
      files:                        # root-owned (0:0), read-only configs in each receiving node
        - source: <companion/node-health/node-health.pl>   # relative to the brick folder, under companion/
          target: </usr/local/lib/gm/node-health/node-health.pl>   # absolute, in the receiving node
          mode: "<0555>"            # quoted octal string; no write bit
      node_config:                  # the per-node config the renderer writes from the map entry
        target: </opt/gm/node-health/node.conf>   # absolute, in the receiving node
        mode: "<0444>"              # quoted octal string; no write bit
      footprint:                    # added to each receiving node's resources by the GM
        limits:       {cpu: <0.005>, memory: <5M>}
        reservations: {cpu: <0.005>, memory: <5M>, disk: <0>}
      requires:                     # what a receiving image must declare under `receives`
        s6_overlay: "<3>"           # a version prefix: the receiver's version begins with it,
                                    # followed by "." or the end
        commands: [<sh>, <perl>]    # a subset of the command vocabulary (receives below)
receives:                           # optional: when the image accepts another brick's mounted material
  s6_overlay: "<3.2.3.2>"           # the s6-overlay version the Dockerfile installs
  commands: [<sh>, <cat>]           # executables `command -v` finds on an s6 service's PATH,
                                    # by basename. The v0.2 vocabulary: sh cat du df awk sed
                                    # grep sleep perl s6-svstat s6-setuidgid
# monitoring:                       # optional in v0.1 (metrics endpoints, logs)
#   metrics: []
#   logs: []
# extra: {}                         # optional: brick-specific keys not covered above
