# scenario.yaml — template for scenarios/<scenario-id>/scenario.yaml
#
# Version v0.5, expected to evolve as games are played.
# Shape: v0.1 master spec section 6, v0.2 master spec 6.3 (capture W1 of
# specs/versions/v0.2/wave-log.md), v0.3 master spec 6.1 and 6.7, with
# 7.1 for a scheduler's files (capture W1 of specs/versions/v0.3/wave-log.md,
# items 0 and 1), and v0.4 master spec 6.1 and 6.9, with 7.1 and 7.2 for a
# transformer and a database node's jobs, 11 for governance (capture W1 of
# specs/versions/v0.4/wave-log.md, items 0, 1, 7 and 8), and v0.5 master
# spec 6.2 and 6.8, with 7.1 for a standby, 8.4 and 8.5 for composed domains,
# 10 for third parties, 13.3 for the data register (capture W1 of
# specs/versions/v0.5/wave-log.md, items 0, 2, 5, 6 and 7). This file and
# gm/answer-key.yaml are AUTHORITATIVE;
# README.md (the scenario document) is generated from them.
# A scenario never bumps its version (D58, D75); git history is the record.
#
# Markers:
#   every key is REQUIRED unless marked otherwise;
#   "# optional: <when>"  the key is present only when <when> holds.
# An empty list (`[]`) or map (`{}`) is a valid value where its comment
# says so; an absent key is not.
# Replace every <placeholder>. A filled file keeps no <placeholder>.
# Paths are relative to the scenario folder.
#
# Units: cpu as a number of CPUs (0.5); memory and disk as 512M, 1G.
# Names (nodes, networks) are valid Kubernetes names: lowercase letters,
# digits and hyphens, starting with a letter, at most 63 characters.
# Durations: <integer><unit>, one unit of s, m, h, d (30m, 16h, 2d, 0m).
# Moments: T0, or handover-<N>h with <N> a whole number of hours, at least 1.
#
# A scheduler node is a node whose brick id is `scheduler`. Only a scenario
# with at least one scheduler node ages (v0.3 master spec 8, D157). One with
# none omits `aging:`, and has no plant_at other than T0, no instance
# aging_minimum and no {{customer_timezone}}; its fault definitions' aging
# minima are not counted (D158, D160): its times stay UTC, as in v0.2.
# From v0.4 {{customer_timezone}} also fills a scheduler node's seed files
# and a postgres node's seed postgresql.conf (cron.timezone), as the bare
# zone (Etc/GMT-2); the starter pack keeps its text form (master spec 8.5).

# --- Scenario information --------------------------------------------
id: <scenario-id>
version: <0.1.0>                    # semver string; kept whatever changes
title: <one line>
date: <YYYY-MM-DD>                  # date of this version
origin: <hand-written>              # hand-written | from-brief | gm-designed
session_length_minutes: <240>       # at most 240 (4 hours)
brief: brief.md                     # the initiator's inputs as given
                                    # (brief.md may say "hand-written, no brief")
background: >-
  <Short GM-facing summary of the customer and their context. The full
  story the players read is player/story.md.>

# --- Aging and difficulty (v0.3 master spec 6.1, 8, 15.1) ----------------
aging:                              # optional: with a scheduler node only, required there and
                                    # refused in a scenario with none (D157, D158)
  minimum: <16h>                    # a duration, at least 8h and as long as the evidence needs
                                    # (master spec 8.2): it covers every fault instance, its
                                    # planting offset plus its own aging minimum
  handover_at: <"14:00">            # the hand-over time of day designed for, in scenario time:
                                    # quoted "HH:00", 24-hour, minutes always 00
difficulty:
  score: <10>                       # an integer, equal to the number of fault_instances (each
                                    # fault is worth 1; tooling expectations do not count)
  level: <normal>                   # optional: easy | normal | hard, the level it targets

# --- Purposes, domains and governance (v0.4 master spec 6.1, 6.9, 11; v0.5 6.2) ---
domain: <shop>                      # optional: a scenario whose business comes from one domain;
                                    # a domain id (domains/<id>/), for provenance only. A static
                                    # scenario omits it. A scenario lists domain: or domains:,
                                    # never both (v0.5 capture W1 item 2)
domains:                            # optional: a scenario composed of domains (v0.5 master spec
                                    # 6.2, 8.4, 8.5; formats.md "Composing domains"); non-empty.
                                    # With it, composition.yaml (the composition record, template
                                    # composition.yaml) is required beside scenario.yaml, and
                                    # merge.yaml (the merge's resolutions, template merge.yaml)
                                    # when two profiles collided; governance.register is required
  - id: <vet-core>                  # a domain id (domains/<id>/), once in the list; every core a
                                    # part requires is listed
    variant: <regional-franchise>   # optional: required on the core's entry, refused on a part's;
                                    # a variant of the core (variants/<variant>.yaml) naming every
                                    # part listed here
    at: <records/clinic>            # node/database the domain's schema lands in (a database node
                                    # and a database the scenario's data creates); for a part
                                    # declaring databases, a map database -> node/database
                                    # ({pacs: machines/pacs, vitals: machines/vitals}); a
                                    # lands_with part shares its core's at:
purposes:                           # optional: a scenario running purposes; non-empty
  - id: <shop-sales-reporting>      # a purpose id (purposes/<id>/), once in the list
    parts:                          # exactly the parts its purpose.yaml declares
      source: <db/shop>             # source, target: a location <node>/<database>, a database
      target: <reporting/reporting> # node's database its data file creates; may be equal
      runner: <bi>                  # a node of role transformer; every job of the purpose has
                                    # an entry of that name and key in its jobs.yaml, the key
                                    # in its queries.yaml
      consumer: <consumer>          # optional: a purpose with a consumer; a node of role consumer
      receiver: <gateway>           # optional: a pushed obligation; a node of role producer (from
                                    # v0.5 a node a third_parties entry lists)
      api: <lab-api>                # optional: a purpose with an api part (v0.5); a node of role api
      partner: <partners-api>       # optional: a purpose with a partner part (v0.5); a node a
                                    # third_parties entry lists
governance:                         # optional: a scenario handing the players a data policy
  policy: player/data-policy.md     # a file of the scenario, written by the GM from governance:,
                                    # mapped to the bastion's seed file data-policy.md
  register: player/data-register.md # optional: required of every scenario listing domains: (v0.5
                                    # master spec 6.2, 13.3; v0.4's shop scenario exempt until it
                                    # is next revised), allowed with governance: alone. The data
                                    # register handout, mapped to the bastion's optional seed file
                                    # data-register.md; the true register is gm/data-register.yaml.
                                    # Both generated by the data-register skill, never edited by
                                    # hand, regenerated rather than reconciled
  classification: data/classification.yaml   # a file of the scenario: the domain's
                                    # classification copied in (template: classification.yaml)
  classes:                          # class -> its rules; every class the classification uses
                                    # other than internal has an entry; a missing internal reads
                                    # as locations: any
    <personal>:                     # personal | customer-linked | internal
      locations: <[db/shop] | any>  # a non-empty list of locations <node>/<database> ([db/shop],
                                    # [db/shop, crm/crm]), or the word any (one value here, as it
                                    # takes either form)
      separation: instance          # optional: the policy demands an instance of its own
                                    # (master spec 11.4); refused with locations: any. G1
                                    # verifies it by node: every database of a node holding
                                    # one of the class's locations, postgres aside, is one of
                                    # them (11.6, spec D253)
      readers: [<shop_app>, <shop_reports>]   # optional: required unless locations is any, and
                                    # refused with any; may be []. Customer roles a data file of
                                    # the scenario creates; never the game's own (dba, postgres,
                                    # gm_check, monitoring, pgbouncer_lookup)
      outbound:                     # optional: the class leaves to someone; refused with
                                    # locations: any. Absent, the class leaves to no one
        - to: <mail-provider>       # a receiver's label [a-z][a-z0-9-]*, once per class
          outbox: <db/shop/mail_outbox>   # <node>/<database>/<table>: the outbox the flow fills
          fields: [<email>, <name>, <order>]   # non-empty: the payload keys it may carry

# --- Third parties (v0.5 master spec 6.2, 10) ----------------------------
third_parties:                      # optional: a scenario with partners; one entry per partner.
                                    # Its nodes are out of the players' reach (write_policy
                                    # no-access) and outside the starter pack
  - id: <northfield-lab>            # [a-z][a-z0-9-]*, once in the list
    name: <Northfield Veterinary Laboratories>   # its in-world name, as the story names it
    stands_for: <a regional reference laboratory>
    role: <round-trip>              # inbound | outbound | round-trip
    nodes: [<partners-api>, <partners-backend>, <partners-db>]   # the shared partner nodes it
                                    # uses (the api node, the back end, the database); may be []
                                    # for a party without a node. Every entry naming nodes names
                                    # the same ones (gmctl compose refuses others)
    hostname: <northfield-lab>      # [a-z][a-z0-9-]*, unique, never a node's name: its alias on
                                    # the partners' api node, the host its endpoints answer under
    player_doc: <player/partners.md#northfield-veterinary-laboratories>   # its partners.md
                                    # entry; player/partners.md, the starter pack's fifth file,
                                    # maps to the bastion's seed file partners.md (an optional one)

# --- Topology ---------------------------------------------------------
networks:                           # each renders as <game_id>_<name>; v0.2 scenarios declare
                                    # one network, and the scripts refuse a second (D85, D106)
  - name: <backend>
    description: <what travels on it>

nodes:                              # one entry per node (one service, one container). From v0.4
                                    # a scenario may have several postgres nodes, each an
                                    # instance of its own with its own seed files and data file
                                    # (master spec 13.1); every scheduler node pins scheduler 0.2.0.
                                    # From v0.5 a postgres node pins 0.5.0, a scheduler node
                                    # 0.3.0, the bastion 0.5.0 (v0.5 master spec 6.7)
  - name: <db>                      # node name; peers reach it by this name only
    brick:
      id: <postgres>                # looked up in the scenario's bricks/ first, then the catalog
      version: <0.1.0>              # pinned: the brick's current version (one per brick)
    role: <database>                # one of the brick's roles (a scheduler node running a
                                    # purpose's jobs: transformer; an api node: api, v0.5; a
                                    # standby keeps database)
    stateful: <true>                # as the brick declares
    networks: [<backend>]
    write_policy: <fixable>         # fixable | report-only | no-access
                                    # (fixable and report-only only when the brick supports them).
                                    # no-access, from v0.5 real (master spec 6.2, 10.2): a third
                                    # party's nodes, on a brick listing it (api, scheduler,
                                    # postgres); no player account, no sudo wrappers, no route
                                    # on the bastion, not in the starter pack
    options: [<monitoring>]         # optional: the options the node chooses (v0.5 master spec
                                    # 6.2, 6.8, 7.1); a non-empty list of unique option names its
                                    # brick declares (brick.yaml options:), off unless listed; an
                                    # empty list is refused. On every node an exporter targets
    standby_of: <records>           # optional: a postgres standby (v0.5 master spec 6.2, 7.1,
                                    # 11.1): its primary, a postgres node that is no standby
                                    # itself. The standby has no data: entry (cloned from its
                                    # primary after the load) and seeds hot_standby_feedback = on;
                                    # the primary's seed pg_hba.conf carries
                                    # host replication replicator samenet scram-sha-256
    write_overrides:                # optional: on a report-only node only; non-empty. Each entry
      - </srv/scheduler/jobs>       # is one of the brick's writable_paths, exactly as written
                                    # there, made fixable with what lies under it; the node's
                                    # write_policy stays as written. Any brick (master spec 6.1)
    parameters: {}                  # map NAME -> value for the brick's parameters; every
                                    # required brick parameter is set; may be {}. A shaped
                                    # parameter takes a map: node-map, e.g. prometheus's
                                    # node_health {bastion: default, db: [postgres, sshd],
                                    # prometheus: default}, required with a prometheus node and
                                    # listing every node of the topology, its own included;
                                    # web-routes, e.g. the bastion's web_routes
                                    # {prometheus: "prometheus:9090"}, one route per web interface
    resources:                      # absolute: never recomputed per playground; includes what
                                    # mounted companion material adds to the node
      limits:
        cpu: <1>
        memory: <1G>
      reservations:
        cpu: <0.5>
        memory: <512M>
        disk: <2G>
    published_ports: []             # bastion only: [{port: 22, default: 2222}, {port: 8080,
                                    # default: 8080}], 8080 (the web front) in every game,
                                    # routes or none (D224); the local implementation
                                    # records the port actually used
    seed_files:                     # one entry per file in the brick's seed.files; may be {}
      <postgresql.conf>: nodes/<db>/postgresql.conf
                                    # bastion: README.md: player/README.md, story.md:
                                    # player/story.md, issues.md: player/issues.md; they write
                                    # the customer's zone {{customer_timezone}} (render fills
                                    # it), never a fixed zone, and only with scheduler nodes.
                                    # The bastion maps data-policy.md: player/data-policy.md
                                    # exactly when the scenario has governance: (an optional
                                    # seed file, bastion 0.4.0). From v0.5 (bastion 0.5.0) it
                                    # maps partners.md: player/partners.md exactly when the
                                    # scenario has third_parties: with a player_doc, and
                                    # data-register.md: player/data-register.md exactly when
                                    # governance.register is set, unless a planted register
                                    # fault is the handout's absence (both optional seed files).
                                    # An api node (api 0.1.0): api.yaml, and the directory
                                    # entries routes/ and db/, written by gmctl compose into
                                    # nodes/<node>/ (v0.5 capture W1 items 5 and 7).
                                    # A scheduler node: queries.yaml, jobs.yaml, schedule.yaml
                                    # and optionally builders/ and scripts/ (an entry ending in
                                    # /: a folder of files), in scenario time, shaped as master
                                    # spec 7.1; they may write {{customer_timezone}}.
                                    # A postgres node's pg_hba.conf keeps, under its DO NOT
                                    # TAMPER comment: local all postgres peer, local
                                    # replication postgres peer, local all gm_check
                                    # scram-sha-256 (D164, D171), and in a scenario with
                                    # governance: host all gm_check samenet scram-sha-256; from
                                    # v0.5 a primary with a standby also host replication
                                    # replicator samenet scram-sha-256 (capture W1 item 6).
                                    # A postgres node may seed crontab: nodes/<db>/crontab
                                    # (optional, postgres 0.4.0: postgres' crontab, in scenario
                                    # time, turning the cron daemon on), with crontab_roles.
                                    # pg_cron is on when its postgresql.conf preloads it
                                    # (shared_preload_libraries, cron.database_name naming a
                                    # database its data file creates, cron.use_background_workers
                                    # = on, cron.timezone = '{{customer_timezone}}') and its data
                                    # file creates the extension (master spec 7.2).
                                    # A prometheus node's prometheus.yml keeps a retention time
                                    # of at least aging.minimum plus 4h (4h with no aging) unless
                                    # a planted fault is about retention (family: retention); a
                                    # size bound stays above the TSDB's growth over that span
    crontab_roles: [<bi_etl>]       # optional: required on a node whose seed_files names crontab,
                                    # refused elsewhere; may be []. The customer roles its
                                    # crontab connects as, unique, [a-z_][a-z0-9_]{0,40}, never
                                    # reserved, created by the node's own data file; deployment
                                    # mounts each one's role_<role>_password secret
    knobs:                          # one entry per knob the brick declares; may be []
      - setting: <shared_buffers>
        initial: <2GB>              # the value in the seed file; may lie outside the envelope
                                    # (the validator is then red from the start: a finding)
        envelope: {min: <64MB>, max: <256MB>}   # or {allowed: [..]}: the brick's default
                                    # envelope, or tightened; never widened
    data:                           # optional: only for a node that holds data; never on a
                                    # standby (standby_of)
      file: data/<db>.sql           # restored-backup data, streamed in after deployment
      databases:                    # the data schema it holds
        - name: <shop>
          owner: <role>
          tables:
            - name: <orders>
              description: <what it holds, rough row count, notable columns and indexes>

flows:                              # every flow between nodes
  - from: <bastion>
    to: <db>
    what: <what moves (players' SSH and SQL sessions)>
    how: <protocol and port (ssh 22, postgresql 5432)>
    cadence: <interactive | continuous | every 5 min | nightly>

# --- Incidents, flaws and defects ------------------------------------
fault_instances:                    # every fault planted in this scenario
  - id: <f1>                        # instance id, unique in the scenario
    fault:
      id: <pg-hba-trust>            # scenario's faults/ first, then the catalog
      version: <0.1.0>              # pinned
    node: <db>                      # target node; its brick is in the fault's applies_to
    parameters: {}                  # map NAME -> value for the fault's parameters; may be {}
    visibility: <known>             # known | hidden; known exactly when an issue covers it
    plant_at: <T0>                  # optional: T0 (the default: right after the data load, before
                                    # the load starts) | handover-<N>h. Other than T0 only for a
                                    # fault whose injection.kind is state, in a scenario with
                                    # scheduler nodes; N at most aging.minimum and at least the
                                    # instance's own aging minimum
    aging_minimum: <4h>             # optional: with scheduler nodes only; a duration, at least the
                                    # fault definition's aging.minimum, when it needs more here

issues:                             # given to the players at hand-over; may be []
  - id: <I1>
    complaint: >-
      <The complaint as the players read it (also in player/issues.md).>
    expected_resolution: <fix>      # report | propose | fix | improve; fix needs the policy of the
                                    # file the fault lives in to be fixable (write_overrides)
    covers: [<f1>]                  # fault instance ids, and tooling expectation ids of
                                    # gm/answer-key.yaml (an issue covering only expectations
                                    # expects report or propose)

# --- Host topology it was designed for -------------------------------
designed_for:
  platform: <swarm>                 # swarm (v0.1 to v0.4)
  hosts:
    - name: <host-1>
      cpu: <4>
      memory: <8G>
      disk: <40G>
  placement:                        # node name -> host name, for every node
    <db>: <host-1>
