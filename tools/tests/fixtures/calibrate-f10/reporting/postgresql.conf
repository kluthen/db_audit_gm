# f10's calibration fixture (v0.4 chunk 9; master spec 16.1, 16.3): the seed
# postgresql.conf of reporting, the agency's instance, at the brick's default
# memory settings. shared_buffers is one of the calibration's figures: the
# shared memory it touches is charged to the container's cgroup with the
# backends' own. pg_cron is preloaded, as on the scenario's reporting node
# (f9's job), so its launcher's footprint is in the figures.
listen_addresses = '*'
port = 5432
max_connections = 20
shared_buffers = 128MB
work_mem = 4MB
maintenance_work_mem = 64MB
max_wal_size = 1GB
autovacuum = on
random_page_cost = 1.1
dynamic_shared_memory_type = posix
log_timezone = 'UTC'
timezone = 'UTC'
lc_messages = 'C.UTF-8'

logging_collector = on
log_destination = 'stderr'
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_file_mode = 0640
log_rotation_age = 0
log_rotation_size = 10MB
log_truncate_on_rotation = off
log_line_prefix = '%t [%p]: user=%u,db=%d,app=%a,client=%h '
log_min_duration_statement = 100ms
log_checkpoints = on
log_connections = on
log_disconnections = on
log_temp_files = 0

shared_preload_libraries = 'pg_stat_statements,pg_cron'
cron.database_name = 'postgres'
cron.use_background_workers = on
cron.timezone = 'UTC'
