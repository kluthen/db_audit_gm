# The integration engine's schedule in the send-outs fixture, the scenario
# layer of node interfaces: the connections of vet-lab-practice-results' and
# vet-lab-send-outs' material/runner/schedule.yaml as written, lab-dispatch
# once (the same entry in both); intensity 1.0, no timeline, no stream.
intensity: 1.0
connections:
  lab-dispatch:                # the source and the target: orders, tests, results, lab_callbacks, ops.*
    driver: sql/postgresql
    target: lab:5432/lab
    role: lab_dispatch
    pool: {size: 1}
  practices:                   # the partner part: POST /results, one call per delivery attempt
    driver: http
    target: practices:8000
    credential: practices_customer
    pool: 4
    timeout: 30s
  northfield-lab:              # the partner part: POST /orders, POST /orders/{send_key}/resend
    driver: http
    target: northfield-lab:8000
    credential: xlab_customer
    pool: 1
    timeout: 10s
streams: []
