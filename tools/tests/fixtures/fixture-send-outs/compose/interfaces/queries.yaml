# The integration engine's query repository in the send-outs fixture, the
# scenario layer of node interfaces: vet-lab-practice-results' and
# vet-lab-send-outs' material/runner/queries.yaml as written.
queries:
  # from purposes/vet-lab-practice-results/material/runner/queries.yaml
  practice-results.deliver:
    script: scripts/practice_results.py:deliver
    options:
      batch: 40                # deliveries posted a run at most
      parallel: 4              # posted at once: one practice's dead callback never holds the others
      days: 30                 # the practices' orders read back this far (ordered_at)
  # from purposes/vet-lab-send-outs/material/runner/queries.yaml
  send-outs.send:
    script: scripts/send_outs.py:send
    options:
      batch: 60                # send-outs packed and posted a run at most (about 7 a working day)
  send-outs.chase:
    script: scripts/send_outs.py:chase
    options:
      batch: 40                # send-outs retried or chased a run at most
      window: "08:00-19:59"    # local hours it acts in, Monday to Saturday (spec D436)
