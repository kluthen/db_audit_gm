# The integration engine's jobs in the send-outs fixture, the scenario layer of
# node interfaces: vet-lab-practice-results' and vet-lab-send-outs'
# material/runner/jobs.yaml as written (the GM's copy at design time).
jobs:
  # from purposes/vet-lab-practice-results/material/runner/jobs.yaml
  - name: deliver-practice-results
    key: practice-results.deliver
    connections:               # the script's names -> the schedule's connections
      source: lab-dispatch
      partner: practices
    at: "* * * * *"
  # from purposes/vet-lab-send-outs/material/runner/jobs.yaml
  - name: send-outs
    key: send-outs.send
    connections:               # the script's names -> the schedule's connections
      source: lab-dispatch
      partner: northfield-lab
    at: "0 16 * * 1,2,3,4,5"
  - name: chase-send-outs
    key: send-outs.chase
    connections:
      source: lab-dispatch
      partner: northfield-lab
    at: "*/15 * * * *"
