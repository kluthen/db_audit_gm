# Answer key of the v0.5 send-outs fixture (tools/tests, v0.5 chunk 18b).
scenario:
  id: fixture-send-outs
  version: 0.1.0
notes: gm/notes.md

instances:
  - instance: f1
    what: random_page_cost is 4.0, the spinning-disk default, on SSD storage.
    why: the planner overprices index scans and favours sequential scans.
    evidence:
      - where: node:records
        source: postgresql.conf and SHOW random_page_cost
        how: ssh records, then psql -c 'SHOW random_page_cost'
        shows: "4"
    acceptable:
      diagnosis: names random_page_cost as too high for SSD storage.
      proposal: lower random_page_cost to about 1.1.
    sealed_check:
      script: faults/fixture-random-page-cost/checks/fixed.sh
      at_handover: 1
      notes: the scenario's own fault (faults/ in the fixture folder).
    interactions: []
    validators_left_red: []

tooling_expectations: []           # none in this fixture

# fa, the false alarm (v0.5 master spec 17.2, 17.3; capture W5 item 1, W5-h
# (c)): issue I1 covers no fault. Its PCR is one the load planted (vet-lab's
# send-outs to Northfield); run-false-alarm-test.sh finds it with the query
# below and places one if the load holds none.
false_alarms:
  - issue: I1
    why: >-
      no fault: the small-animal PCR panel (PCRSA) the lab sends to
      Northfield has a 96-hour turnaround, and a send-out is due by its
      packing plus 50 minutes plus that turnaround (lab_send_outs.due_by);
      the panel answered on its fourth day after it was sent came back
      before its due_by, within its turnaround (one to five days across the
      send-outs).
    evidence:
      - where: bastion
        source: lab_send_outs' due_by against answered_at, with the test's turnaround
        how: >-
          psql -h lab -d lab -c "SELECT s.id, x.code, x.turnaround_hours,
          s.sent_at, s.answered_at, s.due_by, s.due_by >= s.answered_at AS
          in_time FROM lab_send_outs s JOIN lab_order_tests t ON t.id =
          s.order_test_id JOIN lab_tests x ON x.id = t.test_id WHERE x.code =
          'PCRSA' AND s.answered_at >= s.sent_at + interval '3 days' AND
          s.answered_at < s.sent_at + interval '4 days' ORDER BY s.answered_at
          DESC LIMIT 10"
        shows: the panel answered on its fourth day, before its due_by (in_time true), its turnaround 96 hours
    acceptable: >-
      the players report no fault behind the complaint: the panel was
      answered within its turnaround (before its due_by), citing
      lab_send_outs' due_by against answered_at; a proposal to show the
      vets the expected date is a bonus, never required. A send-out answered
      after its due_by (about 6 % of the load's) is the external lab's own
      delay, which the send-outs' chase follows, and not this complaint.
