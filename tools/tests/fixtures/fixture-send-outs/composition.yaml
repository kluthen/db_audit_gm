# The send-outs fixture's composition record (tools/tests, v0.5 chunk 18b,
# spec D403, D435; capture W4 item 3): the core and its laboratory, each on
# its own node, as the lab fixture's (fixture-lab-core); the lab computes the
# core's keys by the core's functions. The lab's two partners composed on
# the partners' three nodes (their api and back-end fragments, their state
# on partners-db). Left out (W3 item 0): the core's practice software and
# lookup API and the lab's information system, whose nodes the fixture does
# without (eight nodes at most, D314): the test releases a practice's test
# itself, as lis would (time placed).
domains:
  - {id: vet-core, variant: regional-franchise, at: records/clinic}
  - {id: vet-lab, at: lab/lab}
keys:
  vet-lab: [core_request, core_animal, core_microchip, core_ueln, core_ear_tag, core_ownership, core_owner]
scale: {checked: true, note: "the core and its lab at one centre's scale: about 0.27 and 0.33 million rows, 49 and 54 MB"}
order: [vet-core, vet-lab]
left_out:
  - {domain: vet-core, producer: pms, reason: "no practice software node in the send-outs fixture (eight nodes at most, D314)"}
  - {domain: vet-core, producer: api/clinic-api, reason: "no lookup API node in the send-outs fixture (eight nodes at most, D314): the lab's identity lookups are lis's, left out too"}
  - {domain: vet-lab, producer: lis, reason: "no information system node in the send-outs fixture (eight nodes at most, D314): the short test receives, validates and releases as lis would (time placed)"}
