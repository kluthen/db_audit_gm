intensity: 1.0
connections:
  # from vet-lab@regional-franchise: domains/vet-lab/producers/partners/practices/schedule.yaml
  practices-db:
    driver: sql/postgresql
    target: partners-db:5432/partners
    role: practices
    pool:
      size: 1
  # from vet-lab@regional-franchise: domains/vet-lab/producers/partners/practices/schedule.yaml
  practices-tick:
    driver: http
    target: practices:8000
    credential: partners_backend
    pool: 1
    timeout: 30s
  # from vet-lab@regional-franchise: domains/vet-lab/producers/partners/xlab/schedule.yaml
  xlab-db:
    driver: sql/postgresql
    target: partners-db:5432/partners
    role: xlab
    pool:
      size: 1
  # from vet-lab@regional-franchise: domains/vet-lab/producers/partners/xlab/schedule.yaml
  xlab-tick:
    driver: http
    target: northfield-lab:8000
    credential: partners_backend
    pool: 1
    timeout: 30s
streams:
  # from vet-lab@regional-franchise: domains/vet-lab/producers/partners/practices/schedule.yaml
  - key: practices.normal
    connection: practices-db
    rate: 1/min
    arrivals: even
  # from vet-lab@regional-franchise: domains/vet-lab/producers/partners/practices/schedule.yaml
  - key: practices.order
    connection: practices-tick
    rate: 2.9/h
    arrivals: poisson
    shape: practice-hours
  # from vet-lab@regional-franchise: domains/vet-lab/producers/partners/xlab/schedule.yaml
  - key: xlab.normal
    connection: xlab-db
    rate: 1/min
    arrivals: even
  # from vet-lab@regional-franchise: domains/vet-lab/producers/partners/xlab/schedule.yaml
  - key: xlab.answer
    connection: xlab-tick
    rate: 6/h
    arrivals: even
    shape: xlab-hours
shapes:
  # from vet-lab@regional-franchise: domains/vet-lab/producers/partners/practices/schedule.yaml
  practice-hours:
    days:
      mon-fri:
        hours:
          00-07: 0
          08-11: 1.0
          12-13: 0.3
          14-18: 1.0
          19-23: 0
      sat:
        hours:
          00-07: 0
          08-11: 1.0
          12-23: 0
      sun:
        hours:
          00-23: 0
  # from vet-lab@regional-franchise: domains/vet-lab/producers/partners/xlab/schedule.yaml
