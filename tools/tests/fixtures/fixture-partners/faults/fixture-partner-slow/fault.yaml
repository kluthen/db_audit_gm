# Scenario-local fault of fixture-partners (tools/tests, v0.5 chunk 11a): a
# partner's slow answers, its misbehaviour key placed standing (capture W2
# item 6; the fault template's partner_behaviour). The timeline change lives
# in the back end's schedule.yaml; nothing is planted at run time.
id: fixture-partner-slow
version: 0.1.0
title: an outside laboratory answers its status four seconds late
family: rules
severity: low

applies_to:
  bricks:
    - id: scheduler
      versions: ["0.3.0"]
  preconditions: []

# --- How long its evidence takes -----------------------------------------
aging:
  technique: real-time
  minimum: 1h                       # an hour of slow answers

parameters: {}

injection:
  kind: seed-file
  stage: seed
  seed_changes:
    - file: schedule.yaml
      change: the timeline changes alpha.normal to alpha.slow at T0
  run_as: root

# --- A partner's misbehaviour (v0.5) -------------------------------------
partner_behaviour:
  partner: alpha-lab
  key: alpha.slow
  placed: standing
  material: nodes/partners-backend/

evidence:
  - where: bastion
    source: a call to the partner's public status
    how: time curl -s http://alpha-lab:8000/status (from a node with curl)
    shows: an answer after about four seconds

probe:
  description: checks/probe.md
  runs_as: player

resolutions:
  - kind: report
    write_policies: [report-only, fixable, no-access]
acceptance:
  diagnosis: names Alpha's status as slow, and Beta's as answering in time.

sealed_check:
  script: checks/fixed.sh
  run_as: root

interactions:
  masks: []
  masked_by: []
  conflicts_with: []

complaint_template: >-
  Alpha Laboratories takes ages to answer its status.
