# postgresql.conf of partners-db, the partners' shared database (v0.5 master
# spec 10.2, 14: a small postgres database, out of reach; capture W2 item 6;
# partners/README.md). Meets the postgres brick's seed requirements
# (bricks/postgres/docs/gm.md, "What the seed files must contain"):
# listen_addresses and port set; config_file, hba_file, data_directory not
# set. Sized for its 256M (master spec 14: the three partner nodes 0.45 CPU
# and 448M); a few rows a minute per partner, a few manifests a night.
listen_addresses = '*'
port = 5432
max_connections = 40              # each partner's pools on partners-api and the back end
shared_buffers = 32MB
work_mem = 4MB
maintenance_work_mem = 32MB
max_wal_size = 256MB
autovacuum = on
wal_level = replica
dynamic_shared_memory_type = posix
log_timezone = 'UTC'
timezone = 'UTC'
lc_messages = 'C.UTF-8'

# --- Logging (bricks/postgres/docs/gm.md): the GM's evidence ----------------
# Nobody but the GM reads them (no player account on a no-access node). The
# connections and their refusals stay in the log (pg_hba's rejects among them).
logging_collector = on
log_destination = 'stderr'
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_file_mode = 0640
log_rotation_age = 0
log_rotation_size = 10MB
log_truncate_on_rotation = off
log_line_prefix = '%t [%p]: user=%u,db=%d,app=%a,client=%h '
log_min_duration_statement = 250ms
log_checkpoints = on
log_connections = on
log_disconnections = off
log_lock_waits = on
log_temp_files = 0
