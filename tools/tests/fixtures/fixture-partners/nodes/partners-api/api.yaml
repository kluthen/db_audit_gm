# api.yaml of partners-api, the partners' shared api node (fixture-partners,
# v0.5 chunk 11a; capture W1 item 5, W2 items 2 and 6). Two sample partners,
# each under its own hostname (a network alias, render's): its public status
# and its tick, the back end's, behind the one credential partners_backend
# (W2 item 6, "Ticks"). Each partner's connection is its own role on
# partners-db, so one partner's pool never holds another's.
endpoints:
  alpha_status:
    hosts: [alpha-lab]
  alpha_tick:
    hosts: [alpha-lab]
    credentials: [partners_backend]
  beta_status:
    hosts: [beta-lab]
  beta_tick:
    hosts: [beta-lab]
    credentials: [partners_backend]
connections:
  alpha-db: {driver: sql/postgresql, target: partners-db:5432/partners, role: alpha, pool: {size: 2}}
  beta-db: {driver: sql/postgresql, target: partners-db:5432/partners, role: beta, pool: {size: 2}}
