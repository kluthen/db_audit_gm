# Lab fixture of v0.5 (build plan chunk 25; master spec 17.2, 17.3 s10;
# capture W5 items 0 and 4, W5-h, of specs/versions/v0.5/wave-log.md; spec
# D462). Not a game: a plain database node, lab (postgres 0.5.0, a small
# data file, no domain), which does not choose the option monitoring, a
# PostgreSQL exporter, exporter (postgres-exporter 0.2.0), watching it as
# the role monitoring, and the bastion; no Prometheus, so no prometheus pin
# and no node-health map. Built for its fault: the instance s10
# (pg-monitoring-option-absent, a topology fault planted by the topology
# itself: lab without options: [monitoring]) is committed, and must be,
# since the loader refuses a monitoring node targeting a node without the
# option unless such an instance targets it. Deployed by its short test,
# run-short-test.sh.

# --- Scenario information --------------------------------------------
id: fixture-lab
version: 0.1.0
title: Lab fixture, a database node without the monitoring option watched by a PostgreSQL exporter
date: 2026-11-12
origin: hand-written
session_length_minutes: 60
brief: brief.md
background: >-
  A small laboratory keeps its samples in one PostgreSQL database, lab,
  watched by a PostgreSQL exporter and reached through a bastion.

# --- Aging and difficulty ---------------------------------------------
# No aging: no scheduler node, so the fixture does not age and has no
# `aging:` (v0.3 master spec 8; D157, D158).
difficulty:
  score: 1                          # its one fault instance (master spec 15.1)

# --- Topology ---------------------------------------------------------
networks:
  - name: backend
    description: players' sessions and the exporter's queries

nodes:
  - name: bastion
    brick:
      id: bastion
      version: 0.5.0
    role: bastion
    stateful: true
    networks: [backend]
    write_policy: report-only
    parameters:
      web_routes: {}
    resources:
      limits:
        cpu: 0.5
        memory: 256M
      reservations:
        cpu: 0.1
        memory: 96M
        disk: 256M
    published_ports: [{port: 22, default: 2222}, {port: 8080, default: 8080}]
    seed_files:
      README.md: player/README.md
      story.md: player/story.md
      issues.md: player/issues.md
    knobs: []

  - name: lab
    brick:
      id: postgres
      version: 0.5.0
    # no options: the monitoring option's absence is fault instance s10
    role: database
    stateful: true
    networks: [backend]
    write_policy: fixable
    parameters: {}
    resources:
      limits:
        cpu: 1
        memory: 1G
      reservations:
        cpu: 0.5
        memory: 512M
        disk: 2.25G
    published_ports: []
    seed_files:
      postgresql.conf: nodes/lab/postgresql.conf
      pg_hba.conf: nodes/lab/pg_hba.conf
    knobs:
      - setting: shared_buffers
        initial: 128MB
        envelope: {min: 64MB, max: 256MB}
      - setting: work_mem
        initial: 4MB
        envelope: {min: 1MB, max: 64MB}
      - setting: maintenance_work_mem
        initial: 64MB
        envelope: {min: 16MB, max: 256MB}
      - setting: max_connections
        initial: 100
        envelope: {min: 10, max: 200}
      - setting: max_wal_size
        initial: 1GB
        envelope: {min: 64MB, max: 1GB}
      - setting: autovacuum
        initial: "on"
        envelope: {allowed: ["on"]}
    data:
      file: data/lab.sql
      databases:
        - name: lab
          owner: lab
          tables:
            - name: samples
              description: 5 000 samples (id, received_at, kind); primary key on id.

  - name: exporter
    brick:
      id: postgres-exporter
      version: 0.2.0
    role: monitoring
    stateful: true
    networks: [backend]
    write_policy: fixable
    parameters: {}
    resources:
      limits:
        cpu: 0.25
        memory: 128M
      reservations:
        cpu: 0.05
        memory: 48M
        disk: 64M
    published_ports: []
    seed_files:
      exporter.conf: nodes/exporter/exporter.conf
    knobs: []

flows:
  - from: bastion
    to: lab
    what: players' SSH and SQL sessions
    how: ssh 22, postgresql 5432
    cadence: interactive
  - from: bastion
    to: exporter
    what: players' SSH sessions, and the exporter's metrics
    how: ssh 22, http 9187
    cadence: interactive
  - from: exporter
    to: lab
    what: the exporter's statistics queries, as the monitoring role
    how: postgresql 5432
    cadence: at each read of its metrics

# --- Incidents, flaws and defects ------------------------------------
fault_instances:
  - id: s10
    fault:
      id: pg-monitoring-option-absent
      version: 0.1.0
    node: lab
    parameters: {}
    visibility: hidden

issues: []

# --- Host topology it was designed for -------------------------------
designed_for:
  platform: swarm
  hosts:
    - name: laptop
      cpu: 2
      memory: 4G
      disk: 8G
  placement:
    bastion: laptop
    lab: laptop
    exporter: laptop
