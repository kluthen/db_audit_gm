# Seed exporter.conf of the lab fixture (tools/tests, v0.5 chunk 25), as the
# monitoring fixture's. The database node's address: lab:5432/postgres;
# postgres 0.5.0 runs without SSL.
DATA_SOURCE_URI=lab:5432/postgres?sslmode=disable
# The monitoring role the option `monitoring` creates (pg_monitor); lab does
# not choose it (fault instance s10). Its password is the secret
# monitoring_password, never written here.
DATA_SOURCE_USER=monitoring
# Query statistics; needs shared_preload_libraries = 'pg_stat_statements'
# on the database node.
COLLECTORS=--collector.stat_statements
