# Seed prometheus.yml of the v0.5 monitoring fixture (tools/tests, v0.5
# chunk 10): Prometheus itself, pgwatch's sink (capture W2 item 5: job
# pgwatch, port 9188), and the node-health endpoint of every node.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

storage:
  tsdb:
    retention:
      time: 1d
      size: 256MB

scrape_configs:
  - job_name: prometheus
    metrics_path: /prometheus/metrics
    static_configs:
      - targets: ['localhost:9090']
  - job_name: pgwatch
    static_configs:
      - targets: ['pgwatch:9188']
  - job_name: node-health
    static_configs:
      - targets: ['bastion:9110', 'records:9110', 'prometheus:9110', 'pgwatch:9110', 'grafana:9110', 'health:9110']
