# Overlay of the orders fixture's answer key for s1 (capture W5 items 0, 1):
# appended to a copy's gm/answer-key.yaml by tools/tests/planted.py.
instances:
  - instance: s1
    what: >-
      interfaces' post-lab-orders maps the order's priority through
      {"stat": "urgent"}.get(priority, "routine"), so every centre order
      reaches the lab routine, the C-{consultation}-urgent ones included.
    why: >-
      the lab releases a routine test at the pathologist's next round, an
      urgent one at once: the emergency team's blood gases and glucose come
      back hours late (LO4), a round-trip cascade (D286).
    evidence:
      - where: node:interfaces
        source: the transformer's script
        how: cat /srv/scheduler/repository/scripts/lab_orders.py
        shows: the body's "priority" mapped from "stat" only, "routine" for anything else
      - where: bastion
        source: the lab's orders against the record's requests
        how: >-
          psql -h lab -d lab -c "SELECT id, client_ref, priority FROM
          lab_orders WHERE account_id = 1 AND client_ref LIKE '%-urgent'
          ORDER BY id DESC LIMIT 10", then the requests of those orders in
          psql -h records -d clinic
        shows: C-{consultation}-urgent orders routine at the lab, their requests urgent in the record
    acceptable:
      diagnosis: >-
        names the mapping in post(): the request's urgent priority sent as
        routine, the lab holding the tests for its next round; the urgent
        references routine at the lab as the trace.
      proposal: >-
        send the request's own priority; raise the orders already posted
        routine at the lab, or ask the lab to release them (the backlog).
    sealed_check:
      script: faults/purpose-urgent-priority-dropped/checks/fixed.sh
      at_handover: 1
      judges: runs
      threshold: 0
      notes: >-
        present as soon as an urgent request has been posted since the
        judged moment; fixed once an urgent order posted after the fix is
        urgent at the lab and answered within its turnaround (LO4, completed
        orders only, D456). The short test releases the urgent test itself
        when lis has not within five minutes, as lis would.
    interactions: []
    validators_left_red: []
    backlog:
      what: >-
        the urgent requests posted routine before the fix, waiting at the
        lab for the next round: ops.lab_orders_sent's C-{consultation}-urgent
        references whose accession is a routine order at lab
        (lab_orders.priority), its tests not yet released.
      cleanup: >-
        each identified from the ledger and raised to urgent at the lab, or
        its release asked of the lab; credited, never counted.
