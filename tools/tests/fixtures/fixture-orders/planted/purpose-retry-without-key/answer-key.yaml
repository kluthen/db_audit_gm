# Overlay of the orders fixture's answer key for s4 (capture W5 items 0, 1):
# appended to a copy's gm/answer-key.yaml by tools/tests/planted.py.
instances:
  - instance: s4
    what: >-
      interfaces' post-lab-orders posts a group whose last attempt timed out
      again under C-{consultation}-{priority}-{HHMM}, a client_ref of its own,
      so the lab, which took the first post after all, holds two orders.
    why: >-
      the lab's idempotency is on client_ref: a new key on the retry makes a
      second order for the same requests, a sample expected that never comes
      (LO2).
    evidence:
      - where: node:interfaces
        source: the transformer's script and the scheduler's log
        how: >-
          cat /srv/scheduler/repository/scripts/lab_orders.py; grep
          'lab-api timeout' /var/log/scheduler/scheduler.log
        shows: the timed-out reference posted again with the run's minute appended
      - where: bastion
        source: the runner's ledger and the lab's orders
        how: >-
          psql -h records -d clinic -c "SELECT client_ref, accession,
          attempts, last_status FROM ops.lab_orders_sent ORDER BY posted_at
          DESC LIMIT 10"; psql -h lab -d lab -c "SELECT consultation_id,
          string_agg(client_ref, ', ') FROM lab_orders WHERE account_id = 1
          GROUP BY consultation_id, priority HAVING count(*) > 1"
        shows: one consultation with two orders, C-{consultation}-{priority} and its -{HHMM} twin, the same requests on both
    acceptable:
      diagnosis: >-
        names the retry's new client_ref defeating the lab's idempotency
        after a timeout the lab survived: two orders for one consultation.
      proposal: >-
        retry under the same client_ref, answered by the lab with the first
        accession; cancel the second order of each pair (the backlog).
    sealed_check:
      script: faults/purpose-retry-without-key/checks/fixed.sh
      at_handover: 1
      judges: runs
      threshold: 0
      notes: >-
        present once a post answered later than the runner's timeout has
        been retried (the short test holds locks on lab_orders, lab_samples
        and lab_order_tests in turn, each under lab-api's five-second
        statement timeout, past it);
        fixed once such a retry is answered with its first accession and no
        request is on two lab orders; too soon (3) without a retry, nothing
        planting a slow answer.
    interactions: []
    validators_left_red: []
    backlog:
      what: >-
        the duplicate orders the retries left before the fix: each
        C-{consultation}-{priority}-{HHMM} order at the lab beside the first
        order of its consultation and priority, the same requests on both.
      cleanup: >-
        the second order of each pair cancelled at the lab; credited, never
        counted.
