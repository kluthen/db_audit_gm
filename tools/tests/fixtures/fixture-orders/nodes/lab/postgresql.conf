# Seed postgresql.conf of the lab node in the v0.5 orders fixture (tools/tests, v0.5 chunk 18a; lab, vet-lab's database lab).
# Meets the PostgreSQL brick's seed requirements (bricks/postgres/docs/gm.md):
# listen_addresses and port set; config_file, hba_file, data_directory not set;
# the logging and preload settings of postgres 0.2.0 (capture W2-B).
listen_addresses = '*'
port = 5432
max_connections = 100
shared_buffers = 128MB
work_mem = 4MB
maintenance_work_mem = 64MB
max_wal_size = 1GB
autovacuum = on
random_page_cost = 1.1
dynamic_shared_memory_type = posix
log_timezone = 'UTC'
timezone = 'UTC'
lc_messages = 'C.UTF-8'

# --- Logging, read by pgBadger (bricks/postgres/docs/gm.md) -----------------
# Files on the log volume pglog, readable by the players' group (pgconf),
# rotated by size, timestamps in UTC, English messages (lc_messages above).
logging_collector = on
log_destination = 'stderr'
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_file_mode = 0640
log_rotation_age = 0
log_rotation_size = 10MB
log_truncate_on_rotation = off
log_line_prefix = '%t [%p]: user=%u,db=%d,app=%a,client=%h '
log_min_duration_statement = 100ms
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0

# --- Preloaded libraries: query statistics and pg_cron (master spec 7.2) ---
# The lab's pg_cron lives in lab itself (capture W4 item 3): its metadata in
# the database lab, which load-data creates for vet-lab; purpose 6's DDL
# creates the extension there and schedules its watch (lab-critical-calls) as
# lab_watch through a background worker, with no password and no pg_hba.conf
# line, at the customer's time, each run logged (CC1, CC2 read them).
shared_preload_libraries = 'pg_stat_statements,pg_cron'
cron.database_name = 'lab'
cron.use_background_workers = on
cron.timezone = '{{customer_timezone}}'
cron.log_run = on
