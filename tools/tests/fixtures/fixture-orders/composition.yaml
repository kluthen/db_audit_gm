# The orders fixture's composition record (tools/tests, v0.5 chunk 18a, spec
# D403, D435; capture W4 item 3): the core and its laboratory, each on its own
# node, as the lab fixture's (fixture-lab-core); the lab computes the core's
# keys by the core's functions. Left out (W3 item 0): the lab's two partners'
# fragments, whose shared api and back-end nodes the fixture does without
# (and no partners' database: their state is not loaded here).
domains:
  - {id: vet-core, variant: regional-franchise, at: records/clinic}
  - {id: vet-lab, at: lab/lab}
keys:
  vet-lab: [core_request, core_animal, core_microchip, core_ueln, core_ear_tag, core_ownership, core_owner]
scale: {checked: true, note: "the core and its lab at one centre's scale: about 0.27 and 0.33 million rows, 49 and 54 MB"}
order: [vet-core, vet-lab]
left_out:
  - {domain: vet-lab, producer: partners/xlab, reason: "no partners' node in the orders fixture (eight nodes at most, D314): the external lab is the send-outs fixture's"}
  - {domain: vet-lab, producer: partners/practices, reason: "no partners' node in the orders fixture (eight nodes at most, D314): the practices are the send-outs fixture's"}
  - {domain: vet-core, producer: partners/centres, reason: "no partners' node in the orders fixture (eight nodes at most, D314): the other centres' stub (purpose 4's) is fixture-exchanges' (spec D435)"}
