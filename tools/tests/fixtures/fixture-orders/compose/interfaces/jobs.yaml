# The scenario layer of node interfaces: purpose 1's jobs (purposes/
# vet-lab-centre-orders/material/runner/jobs.yaml), copied as written.
jobs:
  - name: post-lab-orders
    key: lab-orders.post
    connections:               # the script's names -> the schedule's connections
      source: clinic
      api: lab-api
    at: "* * * * *"
  - name: fetch-lab-results
    key: lab-orders.fetch
    connections:
      source: clinic
      api: lab-api
    at: "*/5 * * * *"
