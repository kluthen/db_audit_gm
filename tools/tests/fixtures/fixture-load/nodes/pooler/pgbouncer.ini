;; Seed pgbouncer.ini of the load fixture (tools/tests, v0.3 chunk 12): the
;; scenario's part of PgBouncer's configuration. The GM's settings (ports,
;; socket, log, authentication, console users) are in
;; /usr/local/lib/gm/pgbouncer-gm.ini, applied after it (bricks/pgbouncer).

[databases]
;; postgres: where PgBouncer looks the logins up (auth_dbname)
postgres = host=db port=5432 dbname=postgres
shop = host=db port=5432 dbname=shop

[pgbouncer]
pool_mode = session
default_pool_size = 5
max_client_conn = 50
max_db_connections = 0
reserve_pool_size = 0
log_connections = 1
log_disconnections = 1
stats_period = 60
