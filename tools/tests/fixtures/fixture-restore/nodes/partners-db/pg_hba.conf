# pg_hba.conf of partners-db, the partners' shared database (v0.5 master spec
# 10.2; capture W2 items 1 and 6, W2-f; partners/README.md). The partners' own
# roles on their database, every other line a reject: a third party's back end
# closed by its own access rules on the game's one network (spec D275).
#
# The GM copies this file as the node's seed pg_hba.conf and lists, on the
# partners' line, every partner's role: each composed domain's
# producers/partners/<prefix>/ (role <prefix>), cold storage's coldstore when
# the scenario has a vault, and owners for the owners' traffic (spec D369).
#
# The address field, measured on one Swarm network (fixture-partners'
# short test, capture W2-f): samenet. It admits every task of the game's
# network (and the host's docker_gwbridge). No other form holds: through a
# node's name (its service's virtual address) every client on a host
# arrives from that host's load-balancer address on the network, the
# bastion as partners-api; a task's own address changes at each restart;
# and a host name never matches (Swarm's reverse lookup names the task,
# <game>_<node>.<slot>.<task id>.<game>_<network>, and the load-balancer
# address has none). What closes the database is the role: each partner
# role's password is a secret mounted on the partners' nodes only
# (render), and every other role is rejected here.
# TYPE  DATABASE  USER                  ADDRESS     METHOD

# DO NOT TAMPER: the GM's access to the node (master spec 9.1; v0.3 7.3).
local   all       postgres                          peer
local   replication postgres                        peer
local   all       gm_check                          scram-sha-256

# The partners' roles, theirs alone (capture W2 item 1): <prefix>,<prefix>,...
host    partners  coldstore             samenet     scram-sha-256
host    all       all                   all         reject
