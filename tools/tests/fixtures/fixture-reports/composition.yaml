# The reports fixture's composition record (tools/tests, v0.5 chunk 20; capture
# W4 item 5; spec D435): the core with its housing and its scheduling in
# records/clinic, read by the reports on records' standby, and the laboratory
# in lab/lab, placed and keyed as fixture-clinic-load places them; loaded core
# first, then the parts in the plan's order. Uncomposed: every producer is left
# out (no producer node, so no compose of theirs); the short test does what
# they would where a check needs it. The lab's two stubs' and the other
# centres' state still load on partners-db.
domains:
  - {id: vet-core, variant: regional-franchise, at: records/clinic}
  - {id: vet-housing, at: records/clinic, lands_with: vet-core}
  - {id: vet-scheduling, at: records/clinic}
  - {id: vet-lab, at: lab/lab}
keys:
  vet-housing: [stays.id, sections.id, staff.id, core_stay, core_species, core_stay_alert, core_staff]
  vet-scheduling: [consultations.id, consultations.booking_id, requests.id, exchanges.id, staff.id, animals.id,
                   core_shifts, core_staff, core_consultation, core_request, core_exchange, core_animal, core_death,
                   core_referring_practice, vc_agenda]
  vet-lab: [core_request, core_animal, core_microchip, core_ueln, core_ear_tag, core_ownership, core_owner]
scale:
  checked: true
  note: "the core and three of its parts at one centre's scale, each as its own fixture measured it: the core about 0.27 million rows, housing 0.14, scheduling 0.13, the lab 0.33"
order: [vet-core, vet-housing, vet-scheduling, vet-lab]
left_out:
  - {domain: vet-core, producer: pms, reason: "no practice software node (eight nodes at most, D314): the test records what a check needs as pms would"}
  - {domain: vet-core, producer: api/clinic-api, reason: "no lookup API node (eight nodes at most, D314)"}
  - {domain: vet-core, producer: partners/centres, reason: "no centres' route on the partners' nodes (eight nodes at most, D314): the other centres' stub (purpose 4's) is fixture-exchanges', its state still loaded on partners-db (spec D435)"}
  - {domain: vet-housing, producer: pms, reason: "no practice software node (eight nodes at most, D314)"}
  - {domain: vet-housing, producer: ward, reason: "no ward service node (eight nodes at most, D314)"}
  - {domain: vet-scheduling, producer: pms, reason: "no practice software node: the rota and the clocked shifts as loaded"}
  - {domain: vet-lab, producer: lis, reason: "no laboratory information system node (eight nodes at most, D314)"}
  - {domain: vet-lab, producer: api/lab-api, reason: "no lab order API node (eight nodes at most, D314)"}
  - {domain: vet-lab, producer: partners/xlab, reason: "the external lab's state loaded on partners-db, its fragments composed in test_compose.py"}
  - {domain: vet-lab, producer: partners/practices, reason: "the practices' state loaded on partners-db, their fragments composed in test_compose.py"}
