# The scenario layer of node backoffice, the back office's report runner
# (v0.5 master spec 8.4, 11.3, 12.2; capture W4 items 0 and 5): the jobs of
# purposes 7 (vet-medicines-registers), 8 (vet-antimicrobial-use), 12
# (vet-working-time), 9 (vet-head-office-figures) and 10 (vet-lab-statements)
# as the GM copies them, each purpose's material/runner/jobs.yaml in that
# order. Scenario time; render shifts the hours. The periodic jobs run daily
# and act on their own local date (D436).
jobs:
  - name: feed-medicines-register
    key: meds.register
    connections: {clinic: clinic-reports, office: office}
    at: "30 1 * * *"
  - name: feed-controlled-drugs
    key: meds.controlled
    connections: {clinic: clinic-reports, office: office}
    at: "45 1 * * *"
  - name: close-medicines-register
    key: meds.close
    connections: {clinic: clinic-reports, office: office}
    at: "0 3 * * *"
  - name: balance-controlled-drugs
    key: meds.balance
    connections: {clinic: clinic-reports, office: office}
    at: "15 3 * * *"
  - name: inventory-controlled-drugs
    key: meds.inventory
    connections: {clinic: clinic-reports, office: office}
    at: "30 3 * * *"
  - name: feed-antimicrobial-use
    key: amu.feed
    connections: {clinic: clinic-reports, office: office}
    at: "0 2 * * *"
  - name: report-antimicrobial-use
    key: amu.report
    connections: {clinic: clinic-reports, office: office, receiver: authority}
    at: "0 4 * * *"
  - name: feed-working-time
    key: worktime.feed
    connections: {sched: sched-reports, clinic: clinic-reports, office: office}
    at: "30 9 * * *"
  - name: close-working-time
    key: worktime.close
    connections: {clinic: clinic-reports, office: office}
    at: "0 5 * * *"
  - name: feed-daily-figures
    key: figures.feed
    connections: {clinic: clinic-reports, lab: lab-reports, office: office}
    at: "30 0 * * *"
  - name: send-monthly-figures
    key: figures.send
    connections: {clinic: clinic-reports, office: office, receiver: headoffice}
    at: "0 5 * * *"
  - name: feed-lab-charges
    key: charges.feed
    connections: {lab: lab-reports, office: office}
    at: "30 2 * * *"
  - name: close-lab-statements
    key: charges.close
    connections: {lab: lab-reports, office: office}
    at: "0 4 * * *"
