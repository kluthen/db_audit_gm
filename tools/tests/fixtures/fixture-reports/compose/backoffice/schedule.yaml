# The scenario layer of node backoffice (v0.5 master spec 8.4, 11.1, 12.2;
# capture W4 items 0 and 5): the connections of purposes 7, 8 and 12 as the
# GM copies them, no stream (a transformer runs jobs only). clinic-reports and
# office are the three purposes' identical entries: the record read on its
# standby (standby) as vet_reports, office written on the primary (records)
# as office_jobs; sched-reports purpose 12's, authority purpose 8's.
intensity: 1.0
connections:
  clinic-reports:
    driver: sql/postgresql
    target: standby:5432/clinic
    role: vet_reports
    pool: {size: 1}
  office:
    driver: sql/postgresql
    target: records:5432/office
    role: office_jobs
    pool: {size: 1}
  authority:
    driver: http
    target: authority:8000
    credential: authority_customer
    pool: 1
    timeout: 10s
  sched-reports:
    driver: sql/postgresql
    target: standby:5432/clinic
    role: sched_reports
    pool: {size: 1}
streams: []
