# The scenario layer of node partners-api (v0.5 master spec 8.4, 10.2; capture
# W4 items 0 and 5): the authority's stub as purpose 8 (vet-antimicrobial-use)
# writes it, its material/receiver/authority/api.yaml, routes/ and db/: the
# yearly antimicrobial-use reports, POST /amu-reports under the hostname
# authority, behind the customer's own key (authority_customer).
endpoints:
  authority_amu_reports:
    hosts: [authority]
    credentials: [authority_customer]
connections:
  authority-db: {driver: sql/postgresql, target: partners-db:5432/partners, role: authority, pool: {size: 2}}
