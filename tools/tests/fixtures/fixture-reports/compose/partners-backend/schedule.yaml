# The scenario layer of node partners-backend (v0.5 master spec 8.4, 10.2;
# capture W4 item 0): the base's intensity, and the baselines of purpose 8's
# authority stub and purpose 9's head office stub as the GM copies them (each
# purpose's material/receiver/<prefix>/schedule.yaml).
intensity: 1.0
connections:
  authority-db: {driver: sql/postgresql, target: partners-db:5432/partners, role: authority, pool: {size: 1}}
  headoffice-db: {driver: sql/postgresql, target: partners-db:5432/partners, role: headoffice, pool: {size: 1}}
streams:
  - key: authority.normal
    connection: authority-db
    rate: 1/min
    arrivals: even
  - key: headoffice.normal
    connection: headoffice-db
    rate: 1/min
    arrivals: even
