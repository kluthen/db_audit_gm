# queries.yaml of node backoffice, composed by gmctl compose (v0.5 master spec 8.4):
# rerun it rather than edit this file; each entry names its source.
queries:
  # from scenario: compose/backoffice/queries.yaml
  meds.register:
    script: scripts/medicines_registers.py:feed_register
    options:
      read: meds.register.read
  # from scenario: compose/backoffice/queries.yaml
  meds.controlled:
    script: scripts/medicines_registers.py:feed_controlled
    options:
      read: meds.controlled.read
  # from scenario: compose/backoffice/queries.yaml
  meds.close:
    script: scripts/medicines_registers.py:close_register
    options:
      compute: meds.close.compute
  # from scenario: compose/backoffice/queries.yaml
  meds.balance:
    script: scripts/medicines_registers.py:balance_controlled
    options:
      compute: meds.balance.compute
  # from scenario: compose/backoffice/queries.yaml
  meds.inventory:
    script: scripts/medicines_registers.py:inventory_controlled
    options:
      compute: meds.inventory.compute
  # from scenario: compose/backoffice/queries.yaml
  meds.register.read:
    sql: |-
      SELECT 'dispensing' AS supply, d.id, d.dispensed_at, m.id, m.name, m.form, m.authorisation_number,
             b.batch_number, d.quantity, o.name, o.address, v.name
        FROM dispensings d
        JOIN prescription_lines l ON l.id = d.prescription_line_id
        JOIN prescriptions p ON p.id = l.prescription_id
        JOIN medicines m ON m.id = l.medicine_id
        JOIN medicine_batches b ON b.id = d.batch_id
        JOIN owners o ON o.id = d.owner_id
        JOIN staff v ON v.id = p.vet_id
       WHERE d.dispensed_at >= %(lo)s AND d.dispensed_at < %(hi)s
      UNION ALL SELECT 'administration', a.id, a.given_at, m.id, m.name, m.form, m.authorisation_number,
             b.batch_number, a.quantity, s.name, NULL, v.name
        FROM administrations a
        JOIN prescription_lines l ON l.id = a.prescription_line_id
        JOIN prescriptions p ON p.id = l.prescription_id
        JOIN medicines m ON m.id = a.medicine_id
        LEFT JOIN medicine_batches b ON b.id = a.batch_id
        JOIN sites s ON s.kind = 'own'
        JOIN staff v ON v.id = p.vet_id
       WHERE a.state = 'given' AND a.given_at >= %(lo)s AND a.given_at < %(hi)s
       ORDER BY 1, 2
  # from scenario: compose/backoffice/queries.yaml
  meds.controlled.read:
    sql: |-
      SELECT 'dispensing' AS movement, d.id, d.dispensed_at, m.id, d.batch_id, b.batch_number, d.quantity
        FROM dispensings d
        JOIN prescription_lines l ON l.id = d.prescription_line_id
        JOIN medicines m ON m.id = l.medicine_id
        JOIN medicine_batches b ON b.id = d.batch_id
       WHERE m.controlled AND d.dispensed_at >= %(lo)s AND d.dispensed_at < %(hi)s
      UNION ALL SELECT 'administration', a.id, a.given_at, m.id, a.batch_id, b.batch_number, a.quantity
        FROM administrations a
        JOIN medicines m ON m.id = a.medicine_id
        LEFT JOIN medicine_batches b ON b.id = a.batch_id
       WHERE m.controlled AND a.state = 'given' AND a.given_at >= %(lo)s AND a.given_at < %(hi)s
       ORDER BY 1, 2
  # from scenario: compose/backoffice/queries.yaml
  meds.close.compute:
    sql: |-
      SELECT medicine_id, min(product), count(*), sum(quantity),
             md5(string_agg(supply || ':' || supply_id || ':' || quantity, ',' ORDER BY supply, supply_id))
        FROM medicines_register
       WHERE day >= %(month)s::date AND day < (%(month)s::date + interval '1 month')::date
       GROUP BY medicine_id ORDER BY medicine_id
  # from scenario: compose/backoffice/queries.yaml
  meds.balance.compute:
    sql: |-
      WITH received AS (
        SELECT key::integer AS batch_id, (value->>0)::integer AS medicine_id, value->>1 AS batch_number,
               (value->>2)::numeric AS quantity
          FROM jsonb_each(%(received)s::jsonb)),
      moved AS (
        SELECT batch_id, sum(quantity) AS quantity FROM controlled_movements
         WHERE batch_id IS NOT NULL AND day >= %(month)s::date AND day < (%(month)s::date + interval '1 month')::date
         GROUP BY batch_id),
      previous AS (
        SELECT batch_id, closing FROM controlled_balances
         WHERE month = (%(month)s::date - interval '1 month')::date)
      SELECT r.medicine_id, r.batch_id, r.batch_number, coalesce(p.closing, r.quantity),
             coalesce(m.quantity, 0), coalesce(p.closing, r.quantity) - coalesce(m.quantity, 0)
        FROM received r LEFT JOIN previous p USING (batch_id) LEFT JOIN moved m USING (batch_id)
       ORDER BY r.batch_id
  # from scenario: compose/backoffice/queries.yaml
  meds.inventory.compute:
    sql: |-
      SELECT medicine_id, batch_id, batch_number, closing FROM controlled_balances
       WHERE month = (%(year)s::date - interval '1 month')::date
       ORDER BY batch_id
  # from scenario: compose/backoffice/queries.yaml
  amu.feed:
    script: scripts/antimicrobial_use.py:feed
    options:
      read: amu.feed.read
  # from scenario: compose/backoffice/queries.yaml
  amu.report:
    script: scripts/antimicrobial_use.py:report
    options:
      compute: amu.report.compute
      due:
        cattle: '2024-01-01'
        sheep: '2027-07-01'
        goat: '2027-07-01'
        horse: '2027-07-01'
        dog: '2030-07-01'
        cat: '2030-07-01'
      deadline: 01-31
      attempts: 3
  # from scenario: compose/backoffice/queries.yaml
  amu.feed.read:
    sql: |-
      WITH herd_species AS (
        SELECT herd_id, min(species) AS species FROM animals WHERE herd_id IS NOT NULL GROUP BY herd_id),
      uses AS (
        SELECT an.species, m.atcvet_code, 'administration' AS use, a.quantity, a.animal_id, NULL::integer AS herd_id
          FROM administrations a
          JOIN medicines m ON m.id = a.medicine_id
          JOIN animals an ON an.id = a.animal_id
         WHERE m.antimicrobial AND a.state = 'given' AND a.given_at >= %(lo)s AND a.given_at < %(hi)s
        UNION ALL
        SELECT coalesce(an.species, hs.species), m.atcvet_code, 'dispensing', d.quantity, p.animal_id, p.herd_id
          FROM dispensings d
          JOIN prescription_lines l ON l.id = d.prescription_line_id
          JOIN prescriptions p ON p.id = l.prescription_id
          JOIN medicines m ON m.id = l.medicine_id
          LEFT JOIN animals an ON an.id = p.animal_id
          LEFT JOIN herd_species hs ON hs.herd_id = p.herd_id
         WHERE m.antimicrobial AND d.dispensed_at >= %(lo)s AND d.dispensed_at < %(hi)s)
      SELECT species, atcvet_code, count(*) FILTER (WHERE use = 'administration'),
             count(*) FILTER (WHERE use = 'dispensing'), sum(quantity), count(DISTINCT animal_id),
             count(DISTINCT herd_id)
        FROM uses GROUP BY species, atcvet_code ORDER BY species, atcvet_code
  # from scenario: compose/backoffice/queries.yaml
  amu.report.compute:
    sql: |-
      SELECT species, atcvet_code, sum(administrations), sum(dispensings), sum(quantity),
             sum(animals_treated), sum(herds_treated)
        FROM antimicrobial_use
       WHERE day >= %(year)s::date AND day < (%(year)s::date + interval '1 year')::date
         AND species = ANY (%(species)s::text[])
       GROUP BY species, atcvet_code ORDER BY species, atcvet_code
  # from scenario: compose/backoffice/queries.yaml
  worktime.feed:
    script: scripts/working_time.py:feed
    options:
      read: worktime.feed.read
      rests: worktime.feed.rests
      staff: worktime.feed.staff
  # from scenario: compose/backoffice/queries.yaml
  worktime.close:
    script: scripts/working_time.py:close
    options:
      compute: worktime.close.compute
  # from scenario: compose/backoffice/queries.yaml
  worktime.feed.read:
    sql: |-
      SELECT staff_id, count(*),
             round(coalesce(sum(extract(epoch FROM ends_at - starts_at)) FILTER (WHERE kind <> 'on-call'), 0) / 3600, 2),
             round(coalesce(sum(extract(epoch FROM clocked_out_at - clocked_in_at)), 0) / 3600, 2),
             round(coalesce(sum(extract(epoch FROM clocked_out_at - clocked_in_at)) FILTER (WHERE kind = 'night'), 0) / 3600, 2),
             count(*) FILTER (WHERE kind = 'on-call' AND clocked_in_at IS NOT NULL)
        FROM sched_shifts
       WHERE starts_at >= %(lo)s AND starts_at < %(hi)s
       GROUP BY staff_id ORDER BY staff_id
  # from scenario: compose/backoffice/queries.yaml
  worktime.feed.rests:
    sql: |-
      SELECT d.staff_id, d.id, p.id, round(extract(epoch FROM d.clocked_in_at - p.clocked_out_at) / 3600, 2)
        FROM sched_shifts d
       CROSS JOIN sched_settings st
        JOIN LATERAL (SELECT q.id, q.clocked_out_at FROM sched_shifts q
                       WHERE q.staff_id = d.staff_id AND q.kind <> 'on-call' AND q.clocked_in_at IS NOT NULL
                         AND q.clocked_in_at < d.clocked_in_at
                       ORDER BY q.clocked_in_at DESC LIMIT 1) p ON true
       WHERE d.starts_at >= %(lo)s AND d.starts_at < %(hi)s AND d.clocked_in_at IS NOT NULL AND d.kind <> 'on-call'
         AND p.clocked_out_at IS NOT NULL
         AND d.clocked_in_at - p.clocked_out_at < make_interval(hours => st.min_rest_hours)
       ORDER BY d.staff_id, d.id
  # from scenario: compose/backoffice/queries.yaml
  worktime.feed.staff:
    sql: SELECT id, name FROM staff ORDER BY id
  # from scenario: compose/backoffice/queries.yaml
  worktime.close.compute:
    sql: |-
      WITH m AS (
        SELECT staff_id, min(staff_name) AS staff_name, sum(worked_hours) AS worked, sum(night_hours) AS night,
               sum(call_outs) AS call_outs
          FROM working_time_days
         WHERE day >= %(month)s::date AND day < (%(month)s::date + interval '1 month')::date
         GROUP BY staff_id),
      b AS (
        SELECT staff_id, count(*) AS breaches FROM rest_breaches
         WHERE day >= %(month)s::date AND day < (%(month)s::date + interval '1 month')::date
         GROUP BY staff_id),
      four AS (
        SELECT staff_id, sum(worked_hours) AS worked FROM working_time_days
         WHERE day >= (%(month)s::date - interval '3 months')::date
           AND day < (%(month)s::date + interval '1 month')::date
         GROUP BY staff_id)
      SELECT m.staff_id, m.staff_name, m.worked, m.night, m.call_outs, coalesce(b.breaches, 0),
             round(f.worked * 7 / (((%(month)s::date + interval '1 month')::date
                                    - (%(month)s::date - interval '3 months')::date)), 2)
        FROM m JOIN four f USING (staff_id) LEFT JOIN b USING (staff_id)
       ORDER BY m.staff_id
  # from scenario: compose/backoffice/queries.yaml
  figures.feed:
    script: scripts/head_office_figures.py:feed
    options:
      read: figures.feed.read
      lab: figures.feed.lab
  # from scenario: compose/backoffice/queries.yaml
  figures.send:
    script: scripts/head_office_figures.py:send
    options:
      compute: figures.send.compute
      first_day: 1
      last_day: 5
      attempts: 3
  # from scenario: compose/backoffice/queries.yaml
  figures.feed.read:
    sql: |-
      WITH sec AS (
        SELECT sc.id, sc.kind FROM sections sc JOIN sites si ON si.id = sc.site_id WHERE si.kind = 'own'),
      grid AS (
        SELECT sec.id, sec.kind, m.measure FROM sec CROSS JOIN (VALUES ('consultations.scheduled'),
               ('consultations.emergency'), ('consultations.herd-visit'), ('consultations.in-hospital'),
               ('admissions'), ('discharges'), ('stays.midnight'), ('units.occupied'), ('units.in-service')) m (measure)),
      counts AS (
        SELECT section_id, 'consultations.' || kind AS measure, count(*) AS n FROM consultations
         WHERE started_at >= %(lo)s AND started_at < %(hi)s GROUP BY 1, 2
        UNION ALL
        SELECT section_id, 'admissions', count(*) FROM stays WHERE admitted_at >= %(lo)s AND admitted_at < %(hi)s
         GROUP BY 1
        UNION ALL
        SELECT section_id, 'discharges', count(*) FROM stays
         WHERE discharged_at >= %(lo)s AND discharged_at < %(hi)s GROUP BY 1
        UNION ALL
        SELECT section_id, 'stays.midnight', count(*) FROM stays
         WHERE admitted_at < %(hi)s AND (discharged_at IS NULL OR discharged_at >= %(hi)s) GROUP BY 1
        UNION ALL
        SELECT u.section_id, 'units.occupied', count(*) FROM housing_placements p
          JOIN housing_units u ON u.id = p.unit_id
         WHERE p.from_at < %(hi)s AND (p.until_at IS NULL OR p.until_at >= %(hi)s) GROUP BY 1
        UNION ALL
        SELECT section_id, 'units.in-service', count(*) FROM housing_units
         WHERE NOT (state = 'out-of-service' AND state_since_at <= %(hi)s) GROUP BY 1)
      SELECT g.kind, g.measure, coalesce(sum(c.n), 0)::numeric
        FROM grid g LEFT JOIN counts c ON c.section_id = g.id AND c.measure = g.measure
       GROUP BY g.kind, g.measure
      UNION ALL SELECT 'centre', 'owners.new', count(*)::numeric FROM owners
       WHERE registered_at >= %(lo)s AND registered_at < %(hi)s
      UNION ALL SELECT 'centre', 'animals.new', count(*)::numeric FROM animals
       WHERE registered_at >= %(lo)s AND registered_at < %(hi)s
       ORDER BY 1, 2
  # from scenario: compose/backoffice/queries.yaml
  figures.feed.lab:
    sql: |-
      WITH grid AS (
        SELECT DISTINCT 'tests.' || t.discipline || '.' || p.priority AS measure
          FROM lab_tests t CROSS JOIN (VALUES ('routine'), ('urgent')) p (priority)),
      released AS (
        SELECT 'tests.' || t.discipline || '.' || o.priority AS measure, count(*) AS n
          FROM lab_order_tests ot JOIN lab_orders o ON o.id = ot.order_id JOIN lab_tests t ON t.id = ot.test_id
         WHERE ot.released_at >= %(lo)s AND ot.released_at < %(hi)s GROUP BY 1)
      SELECT 'lab', g.measure, coalesce(r.n, 0)::numeric FROM grid g LEFT JOIN released r USING (measure) UNION ALL SELECT 'lab', 'orders.outside', count(*)::numeric
        FROM lab_orders o JOIN lab_accounts a ON a.id = o.account_id
       WHERE a.kind = 'practice' AND o.ordered_at >= %(lo)s AND o.ordered_at < %(hi)s
      UNION ALL SELECT 'lab', 'turnaround.outside.median-minutes',
             round((percentile_cont(0.5) WITHIN GROUP (
               ORDER BY extract(epoch FROM ot.released_at - o.received_at) / 60))::numeric, 2)
        FROM lab_order_tests ot JOIN lab_orders o ON o.id = ot.order_id JOIN lab_accounts a ON a.id = o.account_id
       WHERE a.kind = 'practice' AND ot.status = 'released' AND ot.released_at >= %(lo)s
         AND ot.released_at < %(hi)s AND o.received_at IS NOT NULL
       ORDER BY 1, 2
  # from scenario: compose/backoffice/queries.yaml
  figures.send.compute:
    sql: |-
      SELECT section, measure,
             CASE WHEN starts_with(measure, 'turnaround.')
                  THEN round((percentile_cont(0.5) WITHIN GROUP (ORDER BY value))::numeric, 2)
                  ELSE sum(value) END
        FROM daily_figures
       WHERE day >= %(month)s::date AND day < (%(month)s::date + interval '1 month')::date
       GROUP BY section, measure ORDER BY section, measure
  # from scenario: compose/backoffice/queries.yaml
  charges.feed:
    script: scripts/lab_statements.py:feed
    options:
      read: charges.feed.read
  # from scenario: compose/backoffice/queries.yaml
  charges.close:
    script: scripts/lab_statements.py:close
    options:
      compute: charges.close.compute
  # from scenario: compose/backoffice/queries.yaml
  charges.feed.read:
    sql: |-
      SELECT c.id, e.event, c.account_id, c.order_id, c.order_test_id, t.code, c.kind, c.amount, o.patient_ref,
             o.client_surname
        FROM lab_charges c
        JOIN lab_accounts a ON a.id = c.account_id
        JOIN lab_orders o ON o.id = c.order_id
        LEFT JOIN lab_order_tests ot ON ot.id = c.order_test_id
        LEFT JOIN lab_tests t ON t.id = ot.test_id
        CROSS JOIN LATERAL (
          SELECT 'billable' AS event WHERE c.billable_on = %(day)s::date
          UNION ALL
          SELECT 'void' WHERE c.voided_at >= %(lo)s AND c.voided_at < %(hi)s) e
       WHERE a.kind = 'practice'
       ORDER BY c.id, e.event
  # from scenario: compose/backoffice/queries.yaml
  charges.close.compute:
    sql: |-
      WITH stated AS (
        SELECT DISTINCT charge_id FROM lab_charge_lines
         WHERE event = 'billable' AND day < (%(month)s::date + interval '1 month')::date),
      month_lines AS (
        SELECT account_id, count(*) FILTER (WHERE event = 'billable') AS lines,
               coalesce(sum(amount) FILTER (WHERE event = 'billable'), 0) AS billable,
               coalesce(sum(amount) FILTER (WHERE event = 'void' AND charge_id IN (SELECT charge_id FROM stated)), 0)
                 AS voided
          FROM lab_charge_lines
         WHERE day >= %(month)s::date AND day < (%(month)s::date + interval '1 month')::date
         GROUP BY account_id),
      brackets (from_total, pct) AS (VALUES (0, 3), (200, 5), (400, 10), (600, 15)) SELECT m.account_id, m.lines, m.billable, m.voided, m.billable - m.voided AS total, b.pct,
             round((m.billable - m.voided) * b.pct / 100, 2) AS discount,
             (m.billable - m.voided) - round((m.billable - m.voided) * b.pct / 100, 2) AS due
        FROM month_lines m
        CROSS JOIN LATERAL (SELECT pct FROM brackets WHERE from_total <= greatest(m.billable - m.voided, 0)
                             ORDER BY from_total DESC LIMIT 1) b
       ORDER BY m.account_id
