# Overview-fault fixture of v0.6 (build plan chunk 14; master spec 6.3, 8.5,
# 12.1 "The network overview"; capture W2 items 3 and 4 of
# specs/versions/v0.6/wave-log.md). Not a game: the bastion alone, handing
# over the clinic's network overview (aldermoor-centre's
# player/network-overview.md, {{customer_timezone}} filled as a game hands
# it over) with one overview fault planted, n5
# (docs-overview-backup-claimed, trap N5): machines' Backups claim the WAL
# archived to Cold Storage, which the clinic's machines does not do. The
# answer key's overview_diff states the change; tools/tests/test_clinic_front.py
# checks the handout against the clinic's, the diff reverted.
#
# The true overview (gm/network-overview.yaml) is this topology's: the
# clinic's header, no entry (the bastion is none, master spec 8.3) and no
# third party; the handout's entries describe the clinic's nodes, not
# deployed here, which the loader compares with no entry (it checks the
# header and each true entry's Your access).
#
# Deployed by tools/tests/fixtures/fixture-overview-fault/run-short-test.sh
# (the instance planted, its diff in the answer key, the sealed check
# reading present).

# --- Scenario information --------------------------------------------
id: fixture-overview-fault
version: 0.1.0
title: Overview-fault fixture, a claimed backup in the network overview handed out
date: 2026-11-19
origin: hand-written
session_length_minutes: 60
brief: brief.md
background: >-
  Aldermoor Veterinary Hospitals' centre at Aldermoor hands its auditors
  its network overview; the page claims a backup one of its database
  servers does not have. Only the bastion runs here.

# --- Difficulty (no scheduler node: no aging, master spec 6.1, D157) --------
difficulty:
  score: 1                          # its one fault instance (master spec 15.1)
  level: easy

# --- Topology ---------------------------------------------------------
networks:
  - name: backend
    description: the bastion's network; no other node

nodes:
  - name: bastion
    brick:
      id: bastion
      version: 0.6.0
    role: bastion
    stateful: true
    networks: [backend]
    write_policy: report-only
    parameters:
      web_routes: {}
    resources:
      limits:
        cpu: 0.5
        memory: 256M
      reservations:
        cpu: 0.1
        memory: 96M
        disk: 256M
    published_ports:
      - port: 22
        default: 2222
      - port: 8080
        default: 8080
    seed_files:
      README.md: player/README.md
      story.md: player/story.md
      issues.md: player/issues.md
      network-overview.md: player/network-overview.md
    knobs: []

flows:
  - from: bastion
    to: bastion
    what: the front's pages read by the players (the home, the network overview)
    how: http 8080 (published)
    cadence: interactive

# --- Incidents, flaws and defects ------------------------------------
fault_instances:
  - id: n5
    fault:
      id: docs-overview-backup-claimed
      version: 0.1.0
    node: bastion
    parameters:
      node: machines
      claimed: WAL archived to Cold Storage, segment by segment
    visibility: hidden

issues: []

# --- Host topology it was designed for -------------------------------
designed_for:
  platform: swarm
  hosts:
    - name: host-1
      cpu: 2
      memory: 4G
      disk: 20G
  placement:
    bastion: host-1
