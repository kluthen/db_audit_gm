# Answer key of the overview-fault fixture (tools/tests, v0.6 chunk 14). n5's
# overview_diff is the network-overview skill's (machines' Backups, true and
# handed out), never edited by hand.
scenario:
  id: fixture-overview-fault
  version: 0.1.0
notes: gm/notes.md
instances:
- instance: n5
  what: 'the network overview handed out (~/network-overview.md) claims, under the Backups of machines,
    "WAL archived to Cold Storage, segment by segment": machines sends a nightly base backup to Cold Storage
    and archives no WAL.'
  why: 'a backup the documentation claims is the one nobody checks: a restore to a point in time (yesterday
    noon) is not possible, only to last night''s base backup.'
  evidence:
  - where: bastion
    source: the network overview, ~/network-overview.md (and the web front's "Network overview")
    how: awk '/^### machines$/,/^## /' ~/network-overview.md | grep -n -A6 '\*\*Backups\*\*'
    shows: the Backups of machines claim the WAL archived to Cold Storage
  acceptable:
    diagnosis: 'names the WAL archive of machines as claimed and absent (archive_mode off, nothing archived,
      no wal manifest in the vault): a restore reaches last night''s base backup only.'
    proposal: 'the corrected entry: the Backups of machines as overview_diff states.'
  sealed_check:
    script: faults/docs-overview-backup-claimed/checks/fixed.sh
    at_handover: 1
    notes: reads only that the change is present in the served handout; never cleared in play (propose,
      judged at the final answer against overview_diff).
  interactions: []
  validators_left_red: []
  overview_diff:
  - node: machines
    field: backups
    'true':
    - a base backup each night at 04:00 UTC to Cold Storage (no WAL archive)
    - the health page checks at 06:30 UTC that last night's base backup is in Cold Storage
    handed_out:
    - WAL archived to Cold Storage, segment by segment
    - a base backup each night at 04:00 UTC to Cold Storage
    - the health page checks at 06:30 UTC that last night's base backup is in Cold Storage
tooling_expectations: []
