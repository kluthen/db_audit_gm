# Scenario-local purpose fault of fixture-v04-refusals (tools/tests, v0.4
# chunk 2): a fault attached to the test purpose fixture-sales-copy, whose
# sealed check judges the purpose's runs (master spec 6.3, 6.9; capture W1
# item 3).
id: fixture-copy-runs
version: 0.1.0
title: The hourly copy counts the hour's orders twice
family: data-flow
severity: medium

applies_to:
  bricks:
    - id: scheduler
      versions: ["0.2.0", "0.3.0"]
  purposes: [fixture-sales-copy]
  preconditions: []
needs_unshared_host: true

# --- How long its evidence takes -----------------------------------------
aging:
  technique: real-time
  minimum: 2h                       # two of the job's runs after planting

parameters: {}

injection:
  kind: seed-file
  stage: seed
  seed_changes:
    - file: queries.yaml
      change: sales.copy sums each order twice
  run_as: root

evidence:
  - where: node
    source: queries.yaml and sales_hourly
    how: ssh bi, then cat /srv/scheduler/repository/queries.yaml
    shows: the copy's statement joins orders twice

probe:
  description: checks/probe.md
  runs_as: player

resolutions:
  - kind: report
    write_policies: [report-only, fixable]
  - kind: fix
    write_policies: [fixable]
acceptance:
  diagnosis: names the copy's double count.
  fix: the hourly totals match the orders from the next run on.

sealed_check:
  script: checks/fixed.sh
  run_as: root
  judges: runs

interactions:
  masks: []
  masked_by: []
  conflicts_with: []

complaint_template: >-
  The agency's hourly sales are twice the shop's.
