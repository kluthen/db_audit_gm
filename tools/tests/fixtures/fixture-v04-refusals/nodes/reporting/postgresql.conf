# Seed postgresql.conf for the fixture scenario (tools/tests/fixtures).
# Meets the PostgreSQL brick's seed requirements (bricks/postgres/docs/gm.md):
# listen_addresses and port set; config_file, hba_file, data_directory not set.
listen_addresses = '*'
port = 5432
max_connections = 100
shared_buffers = 128MB
work_mem = 4MB
maintenance_work_mem = 64MB
max_wal_size = 1GB
autovacuum = on
random_page_cost = 1.1
dynamic_shared_memory_type = posix
log_timezone = 'UTC'
timezone = 'UTC'
lc_messages = 'C.UTF-8'
# pg_cron (postgres 0.4.0, master spec 7.2): preloaded, its metadata in the
# reporting database the data file creates.
shared_preload_libraries = 'pg_cron'
cron.database_name = 'reporting'
cron.use_background_workers = on
cron.timezone = '{{customer_timezone}}'
