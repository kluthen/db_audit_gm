# Fixture scenario for tools/tests (chunks 4 and 7). Not a game: a bastion
# and one PostgreSQL node, built from .claude/skills/scenario-format/
# templates/scenario.yaml. Complete, so that every gmctl subcommand accepts
# it: a seed-file fault (f1), a state fault planted on the data (f2).

# --- Scenario information --------------------------------------------
id: fixture-audit
version: 0.1.0
title: Fixture scenario for gmctl's unit tests
date: 2026-10-20
origin: hand-written
session_length_minutes: 60
brief: brief.md
background: >-
  A small shop restored its database onto a new SSD-backed server and asks
  for a configuration review.

# --- Topology ---------------------------------------------------------
networks:
  - name: backend
    description: players' SSH and SQL sessions from the bastion to db

nodes:
  - name: bastion
    brick:
      id: bastion
      version: 0.1.1
    role: bastion
    stateful: true
    networks: [backend]
    write_policy: report-only
    parameters: {}
    resources:
      limits:
        cpu: 0.25
        memory: 128M
      reservations:
        cpu: 0.1
        memory: 64M
        disk: 256M
    published_ports: [{port: 22, default: 2222}]
    seed_files:
      README.md: player/README.md
      story.md: player/story.md
      issues.md: player/issues.md
    knobs: []

  - name: db
    brick:
      id: postgres
      version: 0.1.1
    role: database
    stateful: true
    networks: [backend]
    write_policy: fixable
    parameters: {}
    resources:
      limits:
        cpu: 1
        memory: 1G
      reservations:
        cpu: 0.5
        memory: 512M
        disk: 2G
    published_ports: []
    seed_files:
      postgresql.conf: nodes/db/postgresql.conf
      pg_hba.conf: nodes/db/pg_hba.conf
    knobs:
      - setting: shared_buffers
        initial: 128MB
        envelope: {min: 64MB, max: 256MB}    # tightened from the brick's 32MB
      - setting: work_mem
        initial: 4MB
        envelope: {min: 1MB, max: 64MB}
      - setting: maintenance_work_mem
        initial: 64MB
        envelope: {min: 16MB, max: 256MB}
      - setting: max_connections
        initial: 100
        envelope: {min: 10, max: 200}
      - setting: max_wal_size
        initial: 1GB
        envelope: {min: 64MB, max: 1GB}
      - setting: autovacuum
        initial: "on"
        envelope: {allowed: ["on"]}
    data:
      file: data/db.sql
      databases:
        - name: shop
          owner: shop
          tables:
            - name: customers
              description: 500 customers (id, name); primary key on id.
            - name: orders
              description: >-
                20 000 orders (id, customer_id, placed_at, total); primary key
                on id, index orders_customer_id_idx on customer_id.

flows:
  - from: bastion
    to: db
    what: players' SSH and SQL sessions
    how: ssh 22, postgresql 5432
    cadence: interactive

# --- Incidents, flaws and defects ------------------------------------
fault_instances:
  - id: f1
    fault:
      id: fixture-random-page-cost
      version: 0.1.0
    node: db
    parameters: {}
    visibility: hidden
  - id: f2
    fault:
      id: fixture-dropped-index
      version: 0.1.0
    node: db
    parameters:
      column: customer_id
      database: shop
    visibility: hidden

issues: []

# --- Host topology it was designed for -------------------------------
designed_for:
  platform: swarm
  hosts:
    - name: host-1
      cpu: 2
      memory: 4G
      disk: 20G
  placement:
    bastion: host-1
    db: host-1
