# Seed postgresql.conf of reporting, the BI agency's instance, for the
# fixture scenario fixture-campaign (tools/tests, v0.4 chunk 13; capture W3-b
# item 3): db's form, with pg_cron preloaded beside pg_stat_statements.
listen_addresses = '*'
port = 5432
max_connections = 100
shared_buffers = 128MB
work_mem = 4MB
maintenance_work_mem = 64MB
max_wal_size = 1GB
autovacuum = on
random_page_cost = 1.1
dynamic_shared_memory_type = posix
log_timezone = 'UTC'
timezone = 'UTC'
lc_messages = 'C.UTF-8'

# --- Logging -----------------------------------------------------------------
# Files in /var/log/postgresql, readable by the configuration group,
# rotated by size, timestamps in UTC, English messages (lc_messages above).
logging_collector = on
log_destination = 'stderr'
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_file_mode = 0640
log_rotation_age = 0
log_rotation_size = 10MB
log_truncate_on_rotation = off
log_line_prefix = '%t [%p]: user=%u,db=%d,app=%a,client=%h '
log_min_duration_statement = 100ms
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0

# --- Preloaded libraries: query statistics and pg_cron (master spec 7.2) ---
# pg_cron's metadata in the database reporting, which data/reporting.sql
# creates; each job runs as its username through a background worker, with
# no password and no pg_hba.conf line, at the customer's time.
shared_preload_libraries = 'pg_stat_statements,pg_cron'
cron.database_name = 'reporting'
cron.use_background_workers = on
cron.timezone = '{{customer_timezone}}'
cron.log_run = on
cron.log_statement = on
