;; pgbouncer.ini of Tarnbeck Outdoor's connection pooler: the web shop
;; connects here; the back office goes straight to the database. The game's
;; own settings (ports, socket, log, authentication, console users) are in
;; /usr/local/lib/gm/pgbouncer-gm.ini, applied after this file.

[databases]
;; postgres: where PgBouncer looks the logins up
postgres = host=db port=5432 dbname=postgres
shop = host=db port=5432 dbname=shop

[pgbouncer]
pool_mode = transaction
default_pool_size = 3
max_client_conn = 100
max_db_connections = 0
reserve_pool_size = 0
log_connections = 1
log_disconnections = 1
stats_period = 60
