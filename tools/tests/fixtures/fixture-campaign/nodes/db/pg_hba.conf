# Seed pg_hba.conf of db, the shop's instance, for the fixture scenario
# fixture-campaign (tools/tests, v0.4 chunk 13; capture W3-b item 3):
# tarnbeck-outdoor-shop's. Its password line admits the shop's roles from
# every node: shop_app through the pooler, shop_etl from bi and reporting's
# user mapping, shop_crm and shop_customs from crm, customs_gw from gateway.
# TYPE  DATABASE    USER        ADDRESS     METHOD
# DO NOT TAMPER: the game master's access to the node.
local   all         postgres                peer
local   replication postgres                peer
local   all         gm_check                scram-sha-256
host    all         gm_check    samenet     scram-sha-256
# Local sessions on the server.
local   all         all                     scram-sha-256
# The exporter's monitoring role, from the shop's network.
host    postgres    monitoring  samenet     scram-sha-256
# Everyone else (the pooler and its lookups, the back office, the
# administrators), by password.
host    all         all         0.0.0.0/0   scram-sha-256
