# Schedule of fixture-campaign's producer node (tools/tests, v0.4 chunk 13;
# capture W3-b item 4), in scenario time: copied unchanged from
#   domains/shop/producers/schedule.yaml (from v0.5 in
#   domains/shop/producers/producer/, D344).
# The scenario's intensity added; no timeline.
#
# Schedule of the shop's web shop, a fragment (capture W1, items 5 and 6):
# its connection, streams and shape, in scenario time; intensity and
# timeline are the scenario's. Tarnbeck-outdoor-shop's streams, plus the
# consent streams of master spec 9.8, steady day and night so the consent
# invariants have witnesses every hour. Peak at 12:00; the carriers' feed
# runs day and night.
intensity: 1.0
connections:
  app:
    driver: sql/postgresql
    target: pooler:6432/shop
    role: shop_app
    pool: {size: 8}
streams:
  - key: orders.place
    connection: app
    rate: 40/min
    arrivals: poisson
    shape: business-hours
    concurrency: 8
  - key: catalog.lookup
    connection: app
    rate: 120/min
    arrivals: poisson
    shape: business-hours
    concurrency: 4
  - key: orders.detail
    connection: app
    rate: 20/min
    arrivals: poisson
    shape: business-hours
    concurrency: 4
  - key: orders.status
    connection: app
    rate: 30/min
    arrivals: poisson
    shape: business-hours
    concurrency: 2
  - key: deliveries.ingest
    connection: app
    rate: 10/min
    arrivals: poisson
    concurrency: 2
  - key: consent.unsubscribe
    connection: app
    rate: 20/h
    arrivals: poisson
  - key: consent.subscribe
    connection: app
    rate: 30/h
    arrivals: poisson
shapes:
  business-hours:
    hours: {"00-05": 0.1, "06": 0.3, "07": 0.6, "08-11": 0.8, "12": 1.0, "13-17": 0.8,
            "18-21": 0.6, "22-23": 0.3}
