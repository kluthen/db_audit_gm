# Answer key of the clinic-front fixture (tools/tests, v0.6 chunk 14): the
# clinic's s6 entry as aldermoor-centre's answer key holds it (its
# register_diff the data-register skill's), its interaction with s2 left
# out (s2 is not planted here).
scenario:
  id: fixture-clinic-front
  version: 0.1.0
notes: gm/notes.md
instances:
- instance: s6
  what: 'the data register handed out (~/data-register.md) names cold storage, the vault, nowhere: dropped
    from every entry''s recipients and copies, though records and lab archive their WAL and send a nightly
    base backup there, and machines its nightly base backup and its old days, so the whole record, the
    laboratory and the machines reach it.'
  why: 'a record of processing names every recipient, processors included (GDPR Art 30(1)(d)): an owner''s
    access request or an inspector''s question answered from it would omit an off-site copy of all the
    centre''s data.'
  evidence:
  - where: bastion
    source: the data register, ~/data-register.md (and the web front's "Data register")
    how: grep -n '\*\*Shared with\*\*\|\*\*Where\*\*' ~/data-register.md | grep -i 'cold storage'
    shows: nothing; no entry's Shared with or Where names the vault (vet-machinery-monitoring's Kept for
      line names it as where the raw vitals end, not as a recipient)
  - where: bastion
    source: records' archive settings and cold storage's manifests
    how: psql -h records -c 'SHOW archive_command'; curl -s "http://cold-storage:8000/manifests?type=basebackup&source=records"
    shows: records posts to the vault (vault-post), which lists records' nightly base backups and WAL
      segments
  - where: bastion
    source: cold storage's page (GET /)
    how: curl -s http://cold-storage:8000/ (the wal chart's columns and table)
    shows: records' and lab's wal, and the three servers' basebackup shipments, day by day over five weeks
  acceptable:
    diagnosis: cold storage, a processor, receives the whole of records and lab (the WAL archive and the
      nightly base backups) and of machines (its base backups, its old days), and the register names it
      on no entry; found by reading the register against the archive settings, the crontabs, partners.md,
      the vault's manifests and page.
    proposal: 'the corrected entries: each entry held on records, lab or machines names Cold Storage among
      its recipients (the whole instance, archived; a processor) and the vault among its copies, as register_diff
      states.'
  sealed_check:
    script: faults/governance-register-flow-undeclared/checks/fixed.sh
    at_handover: 1
    notes: reads only that the change is present in the served handout; never cleared in play (propose,
      judged at the final answer against register_diff). Cleared only by regenerating the handout without
      the instance.
