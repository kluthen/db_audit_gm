# The classification copy of aldermoor-centre (v0.5 master spec 6.1, 13.3;
# template classification.yaml): the six composed domains' classifications
# (domains/<id>/data/classification.yaml), every column and its class kept,
# each key prefixed with the database the composition places its table in:
# clinic for vet-core, vet-housing and vet-scheduling (records/clinic); lab
# for vet-lab (lab/lab); portal for vet-portal (records/portal); for
# vet-machinery each table's own database among pacs, vitals and biomed
# (machines/<db>), the one whose data/<db>/schema.sql creates it. Every table
# is in schema public, so no key carries a schema. The purposes' own tables
# (office, ops) are classed in each purpose's classification:, read from the
# catalogue. The domains classify; governance: in scenario.yaml states each
# class's rules. An input of the data register: any change makes it stale.
