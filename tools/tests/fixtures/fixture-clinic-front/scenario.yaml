# Clinic-front fixture of v0.6 (build plan chunk 14; master spec 7.1 to
# 7.7, 12.1 and release gate item 4; capture W2 items 1 to 4 of
# specs/versions/v0.6/wave-log.md). Not a game: the bastion alone, carrying
# the clinic's starter pack as aldermoor-centre hands it over (player/: its
# README, story, issues, data policy, partners' page, data register and
# network overview, byte for byte the scenario's own;
# tools/tests/test_clinic_front.py keeps them so), its nine partners with a
# player document and nothing admitted, so render's status file lists each
# with no incident (each status page "Operational"). The partners run on no
# node here (third_parties[].nodes: []): only their hostnames, names and
# documents are needed. As handed over, {{customer_timezone}} is filled (a
# render's UTC+1) and each {{credential:<name>}} of partners.md carries its
# value (a fixture value): so no entry lists credentials:, which the loader
# accepts only with an endpoint checking them, on the partners' api node.
#
# The clinic's one bastion fault instance, s6 (governance-register-flow-
# undeclared), is kept: the data register handed over carries it, so the
# answer key's register_diff and the true register (gm/data-register.yaml,
# the clinic's records with the digests of this fixture's inputs) agree
# with the handout. The true overview (gm/network-overview.yaml) is this
# topology's: the clinic's header and third-party rows, and no entry, the
# bastion being no entry (master spec 8.3); the handout's entries describe
# the clinic's nodes, not deployed here, which the loader compares with no
# entry (it checks the header and each true entry's Your access).
#
# Deployed by tools/tests/fixtures/fixture-clinic-front/run-short-test.sh
# (every page through the front as player: the home, each document, each
# brick page, each partner's status page, a report placed in ~/reports/).

# --- Scenario information --------------------------------------------
id: fixture-clinic-front
version: 0.1.0
title: Clinic-front fixture, the clinic's starter pack served by the bastion alone
date: 2026-11-19
origin: hand-written
session_length_minutes: 60
brief: brief.md
background: >-
  Aldermoor Veterinary Hospitals' centre at Aldermoor hands its auditors
  the bastion and its starter pack: the story, the issues, the data policy,
  the partners' page, the data register and the network overview. Only the
  bastion runs here.

# --- Difficulty (no scheduler node: no aging, master spec 6.1, D157) --------
difficulty:
  score: 1                          # its one fault instance (master spec 15.1)
  level: easy

# --- Data governance (v0.5 master spec 13.2): aldermoor-centre's policy,
# register and classification copy (data/classification.yaml: the clinic's,
# plus its purposes' classified columns, since no purpose is listed here);
# each class at locations: any, the clinic's databases and roles being on no
# node here
governance:
  policy: player/data-policy.md
  register: player/data-register.md
  classification: data/classification.yaml
  classes:
    personal:
      locations: any
    customer-linked:
      locations: any
    internal:
      locations: any

# --- Third parties (v0.5 master spec 6.2, 10): the clinic's nine partners, as
# aldermoor-centre lists them, on no node here
third_parties:
- id: northfield-lab
  name: Northfield Veterinary Laboratories
  stands_for: the external reference laboratory the lab sends what it cannot run
  role: round-trip
  nodes: []
  hostname: northfield-lab
  player_doc: player/partners.md#northfield-veterinary-laboratories
- id: regional-practices
  name: The region's practices
  stands_for: the 120 referring practices with an account at the lab
  role: round-trip
  nodes: []
  hostname: practices
  player_doc: player/partners.md#the-regions-practices
- id: aldermoor-central
  name: Aldermoor Central
  stands_for: the franchise's central national centre (site ALD-C)
  role: round-trip
  nodes: []
  hostname: aldermoor-central
  player_doc: player/partners.md#aldermoor-central
- id: aldermoor-south
  name: Aldermoor South
  stands_for: the franchise's southern national centre (site ALD-S)
  role: round-trip
  nodes: []
  hostname: aldermoor-south
  player_doc: player/partners.md#aldermoor-south
- id: aldermoor-abroad
  name: Aldermoor abroad
  stands_for: the franchise's three centres abroad, reached as one (sites ALD-BE, ALD-DE, ALD-LU)
  role: round-trip
  nodes: []
  hostname: aldermoor-abroad
  player_doc: player/partners.md#aldermoor-abroad
- id: head-office
  name: The franchise's head office
  stands_for: the regional franchise's head office, receiving each centre's monthly activity figures
  role: outbound
  nodes: []
  hostname: head-office
  player_doc: player/partners.md#the-franchises-head-office
- id: messaging
  name: The franchise's messaging service
  stands_for: the franchise's e-mail and text-message service, which delivers the portal's invitations,
    notices and reminders
  role: outbound
  nodes: []
  hostname: messaging
  player_doc: player/partners.md#the-franchises-messaging-service
- id: cold-storage
  name: Cold Storage
  stands_for: 'an off-site archive service, the vault: the WAL archive, the nightly base backups and the
    machines'' shipped days'
  role: round-trip
  nodes: []
  hostname: cold-storage
  player_doc: player/partners.md#cold-storage
- id: authority
  name: The veterinary authority
  stands_for: the national veterinary services, receiving the notifications of listed diseases and the
    yearly antimicrobial-use report
  role: outbound
  nodes: []
  hostname: authority
  player_doc: player/partners.md#the-veterinary-authority

# --- Topology ---------------------------------------------------------
networks:
  - name: backend
    description: the bastion's network; no other node

nodes:
  - name: bastion
    brick:
      id: bastion
      version: 0.6.0
    role: bastion
    stateful: true
    networks: [backend]
    write_policy: report-only
    parameters:
      web_routes: {}
    resources:
      limits:
        cpu: 0.5
        memory: 256M
      reservations:
        cpu: 0.1
        memory: 96M
        disk: 256M
    published_ports:
      - port: 22
        default: 2222
      - port: 8080
        default: 8080
    seed_files:
      README.md: player/README.md
      story.md: player/story.md
      issues.md: player/issues.md
      data-policy.md: player/data-policy.md
      data-register.md: player/data-register.md
      partners.md: player/partners.md
      network-overview.md: player/network-overview.md
    knobs: []

flows:
  - from: bastion
    to: bastion
    what: the front's pages read by the players (the home, the documents, the brick pages, the partners' status pages, the reports)
    how: http 8080 (published)
    cadence: interactive

# --- Incidents, flaws and defects ------------------------------------
fault_instances:
  - id: s6
    fault:
      id: governance-register-flow-undeclared
      version: 0.1.0
    node: bastion
    parameters:
      recipient: Cold Storage
    visibility: hidden

issues: []

# --- Host topology it was designed for -------------------------------
designed_for:
  platform: swarm
  hosts:
    - name: host-1
      cpu: 2
      memory: 4G
      disk: 20G
  placement:
    bastion: host-1
