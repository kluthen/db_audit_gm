# Scenario-local fault of fixture-status (tools/tests, v0.6 chunk 6b): a
# partner's database left at random_page_cost 4.0, there for the incident
# its partner admits (f2's admitted:). A copy of fixture-instances'
# fixture-random-page-cost on the postgres brick of the partners' node.
id: fixture-partner-db-cost
version: 0.1.0
title: random_page_cost left at the spinning-disk default on a partner's database
family: performance
severity: low

applies_to:
  bricks:
    - id: postgres
      versions: ["0.5.1"]
  preconditions: []

aging:
  technique: real-time
  minimum: 0m                       # the evidence shows at once

parameters: {}

injection:
  kind: seed-file
  stage: seed
  seed_changes:
    - file: postgresql.conf
      change: random_page_cost = 4.0
  run_as: root

evidence:
  - where: node
    source: postgresql.conf and SHOW random_page_cost
    how: psql -c 'SHOW random_page_cost' on partners-db (the GM's)
    shows: "4"

probe:
  description: checks/probe.md
  runs_as: player

resolutions:
  - kind: report
    write_policies: [report-only, fixable, no-access]
acceptance:
  diagnosis: names random_page_cost as too high for SSD storage.

sealed_check:
  script: checks/fixed.sh
  run_as: root

interactions:
  masks: []
  masked_by: []
  conflicts_with: []

complaint_template: >-
  The partner's answers are slower than they should be.
