# Scenario-local fault of fixture-archive (tools/tests, v0.5 chunk 11b): a
# seed-file fault in records' crontab, so the fixture has the one fault
# instance the loader requires. Harmless: nothing is planted at run time.
id: fixture-basebackup-log-unread
version: 0.1.0
title: the nightly base backup's log is never read
family: rules
severity: low

applies_to:
  bricks:
    - id: postgres
      versions: ["0.5.0"]
  preconditions: []

# --- How long its evidence takes -----------------------------------------
aging:
  technique: real-time
  minimum: 1h                       # the log's first lines

parameters: {}

injection:
  kind: seed-file
  stage: seed
  seed_changes:
    - file: crontab
      change: the base backup's output appended to a log nothing reads
  run_as: root

evidence:
  - where: node
    source: the base-backup job's log
    how: cat /var/log/postgresql/cron/basebackup.log
    shows: one line a night, read by no check or alert

probe:
  description: checks/probe.md
  runs_as: player

resolutions:
  - kind: report
    write_policies: [report-only, fixable]
acceptance:
  diagnosis: names the base backup as unmonitored, its log read by nothing.

sealed_check:
  script: checks/fixed.sh
  run_as: root

interactions:
  masks: []
  masked_by: []
  conflicts_with: []

complaint_template: >-
  Nobody knows whether last night's backup worked.
