# Archive fixture of v0.5 (build plan chunks 11b and 23; master spec 10.4,
# 11.2, 13.3, 17.2; capture W1 item 6, W2 item 6, W2-f, W5 items 0 and 2,
# of specs/versions/v0.5/wave-log.md). Not a game: cold storage, the vault,
# on the partners' three shared nodes (partners/shared/, partners/coldstore/
# copied as the GM copies them), and records, an archiving postgres node
# whose archive_command and nightly base backup post to it through
# vault-post; the bastion. records holds vet-core's medical record
# (domains:, at records/clinic, uncomposed: every producer left out in
# composition.yaml, written by hand), so the fixture has a data register
# (governance:, vet-core's fragment; its default policy as
# player/data-policy.md; gm/data-register.yaml and player/data-register.md
# generated by the data-register skill) whose entries the vault receives;
# the short tests' filler in a database of its own, fill. Deployed by its
# short test, tools/tests/fixtures/fixture-archive/run-short-test.sh: a
# switched segment and a base backup each yield a manifest naming records,
# the page graphs declared against received, GET /manifests filters by type
# and date, and the planted manifests show the weeks before T0. Its two
# faults, s2 (pg-archive-command-silent) and s6
# (governance-register-flow-undeclared), are planted together on a copy from
# the overlays under planted/ by run-planted-test.sh (W5 item 0); the
# committed fixture stays unfaulted. Loaded and rendered by
# tools/tests/test_partners.py. One fault instance (f1), report only.

# --- Scenario information --------------------------------------------
id: fixture-archive
version: 0.1.0
title: Archive fixture, cold storage on the partners' shared nodes and an archiving database
date: 2026-11-04
origin: hand-written
session_length_minutes: 60
brief: brief.md
background: >-
  A centre of a veterinary franchise keeps its medical record on one
  PostgreSQL instance, records, and archives its WAL and a nightly base
  backup to an off-site vault, cold storage, whose console shows what it
  has received.

# --- Aging and difficulty ---------------------------------------------
aging:
  minimum: 8h                       # the floor (master spec 8.2); the short test never ages it
  handover_at: "14:00"
difficulty:
  score: 1                          # its one fault instance (master spec 15.1)
  level: easy

# --- Domains (v0.5 master spec 6, 8) ----------------------------------
# vet-core alone, uncomposed (composition.yaml: every producer left out);
# load-data loads it after records' data file (capture W5 item 2).
domains:
  - id: vet-core
    variant: regional-franchise
    at: records/clinic

# --- Data governance (v0.4 master spec 11; v0.5 master spec 6.1, 13) ---
# vet-core's governance: fragment as is (its locations records/clinic); its
# default policy as player/data-policy.md. The register is generated by the
# data-register skill: records archives to cold storage, so every entry
# names the vault among its copies and recipients.
governance:
  policy: player/data-policy.md     # vet-core's docs/policy.md, adapted
  register: player/data-register.md # generated: gm/data-register.yaml, the true register
  classification: data/classification.yaml   # vet-core's classification, keyed with clinic
  classes:
    personal:
      locations: [records/clinic]
      readers: [vet_app, vet_lookup, vet_reports]
    customer-linked:
      locations: [records/clinic]
      readers: [vet_app, vet_lookup, vet_display, vet_reports]
    internal:
      locations: any

# --- Third parties (v0.5 master spec 6.2, 10) ----------------------------
third_parties:
  - id: cold-storage
    name: Cold Storage
    stands_for: an off-site archive service, the vault
    role: round-trip
    nodes: [partners-api, partners-backend, partners-db]
    hostname: cold-storage
    player_doc: player/partners.md#cold-storage

# --- Topology ---------------------------------------------------------
networks:
  - name: backend
    description: every node's traffic, the vault's included (one network, spec D275)

nodes:
  - name: bastion
    brick:
      id: bastion
      version: 0.5.0
    role: bastion
    stateful: true
    networks: [backend]
    write_policy: report-only
    parameters:
      web_routes: {}
    resources:
      limits:
        cpu: 0.5
        memory: 256M
      reservations:
        cpu: 0.1
        memory: 96M
        disk: 256M
    published_ports:
      - port: 22
        default: 2222
      - port: 8080
        default: 8080
    seed_files:
      README.md: player/README.md
      story.md: player/story.md
      issues.md: player/issues.md
      data-policy.md: player/data-policy.md
      data-register.md: player/data-register.md
    knobs: []

  - name: records
    brick:
      id: postgres
      version: 0.5.0
    role: database
    stateful: true
    networks: [backend]
    write_policy: fixable
    parameters:
      vault_target: cold-storage:8000     # cold storage's hostname, an alias on partners-api
      vault_credential: cold_storage      # the customer's one account key with it
    resources:
      limits:
        cpu: 1
        memory: 1G
      reservations:
        cpu: 0.5
        memory: 512M
        disk: 2.25G
    published_ports: []
    seed_files:
      postgresql.conf: nodes/records/postgresql.conf
      pg_hba.conf: nodes/records/pg_hba.conf
      crontab: nodes/records/crontab
    crontab_roles: []                   # the base backup runs as postgres, over the socket
    knobs:
      - setting: shared_buffers
        initial: 128MB
        envelope:
          min: 64MB
          max: 256MB
      - setting: work_mem
        initial: 4MB
        envelope:
          min: 1MB
          max: 64MB
      - setting: maintenance_work_mem
        initial: 64MB
        envelope:
          min: 16MB
          max: 256MB
      - setting: max_connections
        initial: 100
        envelope:
          min: 10
          max: 200
      - setting: max_wal_size
        initial: 1GB
        envelope:
          min: 64MB
          max: 1GB
      - setting: autovacuum
        initial: 'on'
        envelope:
          allowed: ['on']
    data:
      file: data/records.sql        # the filler; vet-core's load creates clinic
      databases:
        - name: fill
          owner: postgres
          tables:
            - name: fill_rows
              description: 2 000 rows (id, n, written_at), the short tests' filler, no business data

  # --- The partners' three shared nodes (partners/shared/nodes.yaml) -----
  - name: partners-api
    brick:
      id: api
      version: 0.1.0
    role: api
    stateful: true
    networks: [backend]
    write_policy: no-access
    parameters: {}
    resources:
      limits:
        cpu: 0.25
        memory: 128M
      reservations:
        cpu: 0.1
        memory: 128M
        disk: 64M
    published_ports: []
    seed_files:
      api.yaml: nodes/partners-api/api.yaml
      routes/: nodes/partners-api/routes/
      db/: nodes/partners-api/db/
    knobs: []

  - name: partners-backend
    brick:
      id: scheduler
      version: 0.3.0
    role: producer
    stateful: true
    networks: [backend]
    write_policy: no-access
    parameters: {}
    resources:
      limits:
        cpu: 0.25
        memory: 128M
      reservations:
        cpu: 0.1
        memory: 64M
        disk: 128M
    published_ports: []
    seed_files:
      queries.yaml: nodes/partners-backend/queries.yaml
      jobs.yaml: nodes/partners-backend/jobs.yaml
      schedule.yaml: nodes/partners-backend/schedule.yaml
    knobs: []

  - name: partners-db
    brick:
      id: postgres
      version: 0.5.0
    role: database
    stateful: true
    networks: [backend]
    write_policy: no-access
    parameters: {}
    resources:
      limits:
        cpu: 0.5
        memory: 256M
      reservations:
        cpu: 0.25
        memory: 256M
        disk: 512M
    published_ports: []
    seed_files:
      postgresql.conf: nodes/partners-db/postgresql.conf
      pg_hba.conf: nodes/partners-db/pg_hba.conf
    knobs:
      - setting: shared_buffers
        initial: 32MB
        envelope:
          min: 32MB
          max: 64MB
      - setting: work_mem
        initial: 4MB
        envelope:
          min: 1MB
          max: 16MB
      - setting: maintenance_work_mem
        initial: 32MB
        envelope:
          min: 16MB
          max: 64MB
      - setting: max_connections
        initial: 40
        envelope:
          min: 20
          max: 60
      - setting: max_wal_size
        initial: 256MB
        envelope:
          min: 64MB
          max: 512MB
      - setting: autovacuum
        initial: 'on'
        envelope:
          allowed: ['on']
    data:
      file: data/partners-db.sql
      databases:
        - name: partners
          owner: postgres
          tables:
            - name: coldstore.manifests
              description: cold storage's manifests, one a shipment (shipment_id, type, source, name, rows_declared, rows_received, size, date_from, date_to, received_at); the 35 days before T0 planted for records, wal and basebackup
            - name: coldstore.state
              description: cold storage's state, read by its routes at each request; its baseline planted, delay_ms 0, uploads accept

flows:
  - from: bastion
    to: records
    what: players' SSH and SQL sessions
    how: ssh 22, postgresql 5432
    cadence: interactive
  - from: records
    to: partners-api
    what: WAL segments and the nightly base backup to the vault (cold-storage), vault-post's POST /shipments
    how: http 8000
    cadence: per segment, nightly
  - from: bastion
    to: partners-api
    what: cold storage's page and manifests (cold-storage), read only
    how: http 8000
    cadence: interactive
  - from: partners-backend
    to: partners-db
    what: cold storage's misbehaviour key, its stream coldstore.normal, as coldstore
    how: postgresql 5432
    cadence: 1 a minute
  - from: partners-api
    to: partners-db
    what: cold storage's manifests and state, as coldstore
    how: postgresql 5432
    cadence: per request

# --- Incidents, flaws and defects ------------------------------------
fault_instances:
  - id: f1
    fault:
      id: fixture-basebackup-log-unread
      version: 0.1.0
    node: records
    parameters: {}
    visibility: hidden

issues: []

# --- Host topology it was designed for -------------------------------
designed_for:
  platform: swarm
  hosts:
    - name: host-1
      cpu: 3
      memory: 4G
      disk: 20G
  placement:
    bastion: host-1
    records: host-1
    partners-api: host-1
    partners-backend: host-1
    partners-db: host-1
