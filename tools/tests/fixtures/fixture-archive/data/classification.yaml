# The classification copy of fixture-archive (v0.5 master spec 6.1, 13.3;
# template classification.yaml; capture W5 item 2): vet-core's
# classification (domains/vet-core/data/classification.yaml), every column
# and its class kept, each key prefixed with clinic, the database the
# composition places the core in (records/clinic). Every table is in schema
# public, so no key carries a schema. The domain classifies; governance: in
# scenario.yaml states each class's rules. An input of the data register:
# any change makes it stale.
