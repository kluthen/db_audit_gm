# The scenario layer of node interfaces (v0.5 master spec 8.4, 12.2; capture
# W4 items 0 and 4): the script keys of purposes 4 and 5 as the GM copies
# them (each purpose's material/runner/queries.yaml, and purpose 5's
# material/runner_reports/queries.yaml); the scripts in scripts/.
queries:
  exchanges.sync:
    script: scripts/centre_exchanges.py:sync
    options: {batch: 20}
  exchanges.chase:
    script: scripts/centre_exchanges.py:chase
    options: {batch: 50}
  notify.vet:
    script: scripts/notifiable_diseases.py:notify_vet
    options: {batch: 20}
  notify.lab:
    script: scripts/notifiable_diseases.py:notify_lab
    options: {batch: 20}
  notify.escalate:
    script: scripts/notifiable_diseases.py:escalate
    options: {}
  notify.copy:
    script: scripts/notifications_copy.py:copy
    options: {}
