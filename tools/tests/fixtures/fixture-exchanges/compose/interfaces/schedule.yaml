# The scenario layer of node interfaces (v0.5 master spec 8.4, 12.2; capture
# W4 items 0, 4 and 5): the connections of purposes 4 and 5 as the GM copies
# them, no stream (a transformer runs jobs only). clinic is purposes 4's and
# 5's identical entry; with runner_reports mapped here, interfaces also holds
# the report connections (clinic-reports on the primary: no standby here)
# and office as office_jobs.
intensity: 1.0
connections:
  clinic:
    driver: sql/postgresql
    target: records:5432/clinic
    role: vet_interfaces
    pool: {size: 2}
  lab-dispatch:
    driver: sql/postgresql
    target: lab:5432/lab
    role: lab_dispatch
    pool: {size: 1}
  centres-central:
    driver: http
    target: aldermoor-central:8000
    credential: centres_customer
    pool: 1
    timeout: 10s
  centres-south:
    driver: http
    target: aldermoor-south:8000
    credential: centres_customer
    pool: 1
    timeout: 10s
  centres-abroad:
    driver: http
    target: aldermoor-abroad:8000
    credential: centres_customer
    pool: 1
    timeout: 10s
  authority:
    driver: http
    target: authority:8000
    credential: authority_customer
    pool: 1
    timeout: 10s
  clinic-reports:
    driver: sql/postgresql
    target: records:5432/clinic
    role: vet_reports
    pool: {size: 1}
  lab-reports:
    driver: sql/postgresql
    target: lab:5432/lab
    role: lab_reports
    pool: {size: 1}
  office:
    driver: sql/postgresql
    target: records:5432/office
    role: office_jobs
    pool: {size: 1}
streams: []
