# The scenario layer of node interfaces (v0.5 master spec 8.4, 12.2; capture
# W4 items 0 and 4): the runners' jobs of purposes 4 and 5 as the GM copies
# them, purpose 4's material/runner/jobs.yaml, purpose 5's
# material/runner/jobs.yaml and, runner_reports being mapped to interfaces
# here, its material/runner_reports/jobs.yaml (copy-notifications at 02:15).
# Scenario time; render shifts the hours.
jobs:
  - name: sync-exchanges
    key: exchanges.sync
    connections: {clinic: clinic, partner_central: centres-central, partner_south: centres-south,
                  partner_abroad: centres-abroad}
    at: "*/5 * * * *"
  - name: chase-exchanges
    key: exchanges.chase
    connections: {clinic: clinic, partner_central: centres-central, partner_south: centres-south,
                  partner_abroad: centres-abroad}
    at: "0 9 * * 1,2,3,4,5"
  - name: notify-vet
    key: notify.vet
    connections: {clinic: clinic, receiver: authority}
    at: "*/5 * * * *"
  - name: notify-lab
    key: notify.lab
    connections: {lab: lab-dispatch, receiver: authority}
    at: "*/5 * * * *"
  - name: escalate-notifications
    key: notify.escalate
    connections: {clinic: clinic, lab: lab-dispatch}
    at: "*/15 * * * *"
  - name: copy-notifications
    key: notify.copy
    connections: {clinic: clinic-reports, lab: lab-reports, office: office}
    at: "15 2 * * *"
