# The exchanges fixture's composition record (tools/tests, v0.5 chunk 19;
# spec D435; capture W4 item 4): the core and its laboratory, each on its own
# node, as fixture-lab-core places them; the lab computes the core's keys by
# the core's functions (its docs/gm.md, "Core keys used"). Composed: the
# core's lookup API (clinic-api, which purpose 4's endpoints join) and the
# other centres' stub (vet-core's partners/centres, onto the partners' api
# and back-end nodes). Left out: the practice software and the lab's
# information system, whose nodes the fixture does without (eight nodes at
# most, D314: the test decides, reports and records as they would), the
# lab's order API, and the lab's two partners' fragments; their state is
# still loaded on partners-db.
domains:
  - {id: vet-core, variant: regional-franchise, at: records/clinic}
  - {id: vet-lab, at: lab/lab}
keys:
  vet-lab: [core_request, core_animal, core_microchip, core_ueln, core_ear_tag, core_ownership, core_owner]
scale: {checked: true, note: "the core and its lab at one centre's scale: about 0.27 and 0.33 million rows, 49 and 54 MB, as fixture-lab-core measured them"}
order: [vet-core, vet-lab]
left_out:
  - {domain: vet-core, producer: pms, reason: "no practice software node (eight nodes at most, D314): the test decides, reports and requests the exchanges as pms would"}
  - {domain: vet-lab, producer: lis, reason: "no laboratory information system node: the test records the lab's notification as lab.notify would"}
  - {domain: vet-lab, producer: api/lab-api, reason: "no lab order API node (eight nodes at most, D314)"}
  - {domain: vet-lab, producer: partners/xlab, reason: "the external lab's state loaded on partners-db, its fragments composed in test_compose.py"}
  - {domain: vet-lab, producer: partners/practices, reason: "the practices' state loaded on partners-db, their fragments composed in test_compose.py"}
