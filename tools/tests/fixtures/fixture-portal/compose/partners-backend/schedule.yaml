# The scenario layer of node partners-backend (v0.5 master spec 8.4; D264):
# the owners' traffic raised, so the short test sees a visit about every 50
# seconds by day (9.3 an hour at 1.0, 0.8 the owners' day's weight from
# 09:00), a reset about every 25 minutes; and purpose 16's messaging stub's
# baseline stream (purposes/vet-portal-messages/material/partner/messaging/,
# as the GM copies it). No timeline: no misbehaviour in the fixture.
intensity: 10.0
connections:
  messaging-db: {driver: sql/postgresql, target: partners-db:5432/partners, role: messaging, pool: {size: 1}}
streams:
  - key: messaging.normal
    connection: messaging-db
    rate: 1/min
    arrivals: even
