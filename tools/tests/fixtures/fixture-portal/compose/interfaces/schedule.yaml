# The scenario layer of node interfaces (v0.5 master spec 8.4), the integration
# engine: purposes 15 (vet-portal-release) and 16 (vet-portal-messages), their
# runner material as the GM copies it (purposes/<id>/material/runner/), the
# names already the fixture's (records, lab, the hostname messaging).
# At intensity 1.0; no stream.
intensity: 1.0
connections:
  portal-clinic:
    driver: sql/postgresql
    target: records:5432/clinic
    role: vet_portal_sync
    pool:
      size: 1
  portal-lab:
    driver: sql/postgresql
    target: lab:5432/lab
    role: lab_release
    pool:
      size: 1
  portal-sync:
    driver: sql/postgresql
    target: records:5432/portal
    role: portal_sync
    pool:
      size: 1
  portal-dispatch:
    driver: sql/postgresql
    target: records:5432/portal
    role: portal_dispatch
    pool:
      size: 1
  messaging:
    driver: http
    target: messaging:8000
    credential: messaging_customer
    pool: 1
    timeout: 5s
streams: []
