# The scenario layer of node interfaces (v0.5 master spec 8.4), the integration
# engine: purposes 15 (vet-portal-release) and 16 (vet-portal-messages), their
# runner material as the GM copies it (purposes/<id>/material/runner/), the
# names already the fixture's (records, lab, the hostname messaging).
queries:
  portal.identity:
    script: scripts/portal_release.py:sync_identity
    options:
      margin_minutes: 2
      link: https://portal.example.net/activate/
  portal.records:
    script: scripts/portal_release.py:publish_records
    options:
      margin_minutes: 2
  portal.results:
    script: scripts/portal_release.py:publish_results
    options:
      margin_minutes: 2
      account: 1
  messages.notices:
    script: scripts/portal_messages.py:queue_notices
    options:
      margin_minutes: 2
      link: https://portal.example.net/
  messages.reminders:
    script: scripts/portal_messages.py:queue_reminders
    options:
      link: https://portal.example.net/
      species: dog,cat,rabbit,ferret,horse
  messages.send:
    script: scripts/portal_messages.py:send_messages
    options:
      batch: 100
      attempts: 6
