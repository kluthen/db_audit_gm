# The portal fixture's composition record (tools/tests, v0.5 chunk 16b; spec
# D403, D404; capture W3 items 0 and 5): the core in records/clinic, its
# laboratory in lab/lab and the owners' portal in records/portal, loaded core
# first; the portal computes the core's keys by the core's functions (its
# docs/gm.md, "Core keys used") and its derivation copies the core's record
# and the lab's released results into portal, after both loads, reading them
# through gm_src_vet_core and gm_src_vet_lab: sanctioned here (derive:).
# Left out (W3 item 5, chunk 29's (b)): the practice software and the core's
# lookup API, whose nodes the fixture does without (eight nodes at most,
# D314), so the portal's desk stream on pms too, composed in
# tools/tests/test_compose.py only; the lab's information system and order
# API; the lab's two partners' fragments, their state still loaded and
# checked on partners-db.
domains:
  - {id: vet-core, variant: regional-franchise, at: records/clinic}
  - {id: vet-lab, at: lab/lab}
  - {id: vet-portal, at: records/portal}
keys:
  vet-lab: [core_request, core_animal, core_microchip, core_ueln, core_ear_tag, core_ownership, core_owner]
  vet-portal: [core_owner, core_ownership]
scale: {checked: true, note: "the core, its lab and the owners' portal at one centre's scale: about 0.27, 0.33 and 0.20 million rows, 49, 54 and 78 MB"}
order: [vet-core, vet-lab, vet-portal]
derive:
  - {domain: vet-portal, after: [vet-core, vet-lab], reason: "the portal copies the signed record and the released results, read through gm_src_vet_core and gm_src_vet_lab (spec D404)"}
left_out:
  - {domain: vet-core, producer: pms, reason: "the portal's fixture runs no practice software (eight nodes at most, D314)"}
  - {domain: vet-core, producer: api/clinic-api, reason: "no lookup API node: the portal reads the core through its derivation and purpose 15 (chunk 21)"}
  - {domain: vet-lab, producer: lis, reason: "no laboratory information system node: the test writes the lab's gates itself"}
  - {domain: vet-lab, producer: api/lab-api, reason: "no lab order API node (eight nodes at most, D314)"}
  - {domain: vet-lab, producer: partners/xlab, reason: "the external lab's state loaded and checked on partners-db, its fragments composed in test_compose.py"}
  - {domain: vet-lab, producer: partners/practices, reason: "the practices' state loaded and checked on partners-db, their fragments composed in test_compose.py"}
  - {domain: vet-portal, producer: pms, reason: "the desk's consent stream rides the practice software, left out: its fragment composed in test_compose.py"}
