# Seed postgresql.conf of records in the v0.5 portal fixture (tools/tests, v0.5 chunk 16b; vet-core's clinic, vet-portal's portal).
# Meets the PostgreSQL brick's seed requirements (bricks/postgres/docs/gm.md):
# listen_addresses and port set; config_file, hba_file, data_directory not set;
# the logging and preload settings of postgres 0.2.0 (capture W2-B).
listen_addresses = '*'
port = 5432
max_connections = 100
shared_buffers = 128MB
work_mem = 4MB
maintenance_work_mem = 64MB
max_wal_size = 1GB
autovacuum = on
random_page_cost = 4.0              # fault instance f1 (fixture-random-page-cost)
dynamic_shared_memory_type = posix
log_timezone = 'UTC'
timezone = 'UTC'
lc_messages = 'C.UTF-8'

# --- Logging, read by pgBadger (bricks/postgres/docs/gm.md) -----------------
# Files on the log volume pglog, readable by the players' group (pgconf),
# rotated by size, timestamps in UTC, English messages (lc_messages above).
logging_collector = on
log_destination = 'stderr'
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_file_mode = 0640
log_rotation_age = 0
log_rotation_size = 10MB
log_truncate_on_rotation = off
log_line_prefix = '%t [%p]: user=%u,db=%d,app=%a,client=%h '
log_min_duration_statement = 100ms
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0

# --- Query statistics (the exporter's pg_stat_statements metrics) ----------
shared_preload_libraries = 'pg_stat_statements,pg_cron'
# pg_cron's metadata in the database jobs, which data/records.sql creates;
# vet-portal's data/cron.sql schedules its sessions' purge there, in portal,
# as portal_housekeeping (capture W3 items 4 and 5, spec D405). Background
# workers, so a job needs no pg_hba.conf line; the customer's zone.
cron.database_name = 'jobs'
cron.use_background_workers = on
cron.timezone = '{{customer_timezone}}'
cron.log_run = on

# --- TLS: the portal's API arrives over hostssl (pg_hba.conf) ----------------
# The game's self-signed pair, mounted by gmctl deploy (bricks/postgres/docs/gm.md, "TLS").
ssl = on
ssl_cert_file = '/opt/gm/secrets/tls.crt'
ssl_key_file = '/opt/gm/secrets/tls.key'
