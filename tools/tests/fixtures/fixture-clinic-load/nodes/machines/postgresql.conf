# Seed postgresql.conf of the v0.5 clinic load fixture (tools/tests, v0.5 wave 3 gate, spec D407; machines).
# Meets the PostgreSQL brick's seed requirements (bricks/postgres/docs/gm.md):
# listen_addresses and port set; config_file, hba_file, data_directory not set;
# the logging and preload settings of postgres 0.2.0 (capture W2-B), and
# pg_cron preloaded for vet-machinery's partition jobs (capture W3 item 4).
listen_addresses = '*'
port = 5432
max_connections = 100
shared_buffers = 128MB
work_mem = 4MB
maintenance_work_mem = 64MB
max_wal_size = 1GB
autovacuum = on
random_page_cost = 1.1
dynamic_shared_memory_type = posix
log_timezone = 'UTC'
timezone = 'UTC'
lc_messages = 'C.UTF-8'

# --- Logging, read by pgBadger (bricks/postgres/docs/gm.md) -----------------
# Files on the log volume pglog, readable by the players' group (pgconf),
# rotated by size, timestamps in UTC, English messages (lc_messages above).
logging_collector = on
log_destination = 'stderr'
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_file_mode = 0640
log_rotation_age = 0
log_rotation_size = 10MB
log_truncate_on_rotation = off
log_line_prefix = '%t [%p]: user=%u,db=%d,app=%a,client=%h '
log_min_duration_statement = 100ms
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0

# --- Preloaded libraries: query statistics and pg_cron (master spec 7.2) ---
# pg_cron's metadata in the database jobs, which data/machines.sql creates;
# vet-machinery's data/cron.sql schedules its three partition jobs there, each
# run as mach_maint in vitals or biomed through a background worker, with no
# password and no pg_hba.conf line, at the customer's time.
shared_preload_libraries = 'pg_stat_statements,pg_cron'
cron.database_name = 'jobs'
cron.use_background_workers = on
cron.timezone = 'UTC'                    # no scheduler node, so no customer's zone: UTC (D158)
cron.log_run = on
