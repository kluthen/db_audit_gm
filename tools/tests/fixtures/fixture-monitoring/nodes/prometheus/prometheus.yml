# Seed prometheus.yml of the monitoring fixture (tools/tests, v0.2 chunk 11;
# capture W3, "For chunk 11"): Prometheus itself, the PostgreSQL exporter, and
# the node-health endpoint of every node of the topology.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Retention, bounded by time and by size (v0.2 master spec 7.2, D106);
# applied at start and at each reload (sudo gm-reload-prometheus).
storage:
  tsdb:
    retention:
      time: 1d
      size: 256MB

scrape_configs:
  - job_name: prometheus
    metrics_path: /prometheus/metrics
    static_configs:
      - targets: ['localhost:9090']
  - job_name: postgres
    static_configs:
      - targets: ['exporter:9187']
  - job_name: node-health
    static_configs:
      - targets: ['bastion:9110', 'db:9110', 'prometheus:9110', 'exporter:9110', 'grafana:9110']
