# Answer key of the fixture scenario fixture-instances (tools/tests, v0.4
# chunk 7). Its one instance is fixture-audit's f1: the fixture proves
# load-data, not a fault.
scenario:
  id: fixture-instances
  version: 0.1.0
notes: gm/notes.md

instances:
  - instance: f1
    what: random_page_cost on db is 4.0, the spinning-disk default, on SSD storage.
    why: the planner overprices index scans and favours sequential scans.
    evidence:
      - where: node:db
        source: postgresql.conf and SHOW random_page_cost
        how: ssh db, then psql -c 'SHOW random_page_cost'
        shows: "4"
    acceptable:
      diagnosis: names random_page_cost on db as too high for SSD storage.
      proposal: lower random_page_cost to about 1.1.
    sealed_check:
      script: faults/fixture-random-page-cost/checks/fixed.sh
      at_handover: 1
      notes: the scenario's own fault (faults/ in the fixture folder).
    interactions: []
    validators_left_red: []

tooling_expectations: []           # none in this scenario
