# Seed postgresql.conf of reporting for the fixture scenario fixture-instances
# (tools/tests/fixtures). Meets the PostgreSQL brick's seed requirements
# (bricks/postgres/docs/gm.md): listen_addresses and port set; config_file,
# hba_file, data_directory not set.
listen_addresses = '*'
port = 5432
max_connections = 50
shared_buffers = 64MB
work_mem = 4MB
maintenance_work_mem = 64MB
max_wal_size = 256MB
autovacuum = on
dynamic_shared_memory_type = posix
log_timezone = 'UTC'
timezone = 'UTC'
lc_messages = 'C.UTF-8'

# --- pg_cron (master spec 7.2) ----------------------------------------------
# Its metadata in the database reporting, which data/reporting.sql creates;
# each job runs as its role through a background worker, with no password
# and no pg_hba.conf line. No scheduler node: the scenario has no shift and
# no customer's time zone, so the zone is UTC.
shared_preload_libraries = 'pg_cron'
cron.database_name = 'reporting'
cron.use_background_workers = on
cron.timezone = 'UTC'
cron.log_run = on
cron.log_statement = on
