# Answer key of fixture-fill (tools/tests, v0.6 build plan chunk 8). Not a
# game: f8 as the shop's answer key gives it ("08:00" is the customer's
# time; the logs and the tools are in UTC).
scenario:
  id: fixture-fill
  version: 0.1.0
notes: gm/notes.md

instances:
  - instance: f8
    what: >-
      order_lines_order_id_idx, the index on order_lines.order_id, was
      dropped at 08:00 the customer's time (six hours before hand-over), so
      every lookup of an order's lines (the order pages, orders.detail)
      reads the whole order_lines table instead of a few index entries.
      The foreign key order_lines_order_id_fkey stays.
    why: >-
      Opening an order went from well under a millisecond to tens of
      milliseconds of a full scan (issue I1).
    evidence:
      - where: bastion
        source: the table's definition
        how: psql -d shop -c '\d order_lines'
        shows: the foreign key on order_id, but no index leading with order_id
      - where: node:producer
        source: the scheduler's per-minute key lines
        how: ssh producer, then grep 'key=orders.detail ' /var/log/scheduler/scheduler.log
        shows: p50_ms jumping at 08:00 the customer's time
    acceptable:
      diagnosis: >-
        names the missing index on order_lines.order_id as why order pages
        read the whole table, backed by a plan showing the sequential scan.
      proposal: >-
        CREATE INDEX CONCURRENTLY ON order_lines (order_id), then the plan
        again.
      fix: >-
        a valid index whose first column is order_id exists on order_lines,
        whatever its name and however it was built.
    sealed_check:
      script: faults/pg-join-index-missing/checks/fixed.sh
      at_handover: 1
      notes: >-
        Planted during the aging, at handover-6h: in this fixture by gmctl
        fill at its virtual instant.
    interactions: []
    validators_left_red: []

tooling_expectations: []
