# Scenario-local state fault of fixture-fill, copied from
# fixture-v06-refusals' (v0.6 spec D533): f8, the index the fill drops at
# its pause in a fake game (gmctl render --aging fake), the catalogue's
# pg-join-index-missing staying unassessed until chunk 11. Its history
# signature holds in fixture-fill: its keys, no suppressed_by on a fault it
# lacks. It carries one entry of each kind but none (none is a signature's
# only entry), so the history's run (run-history-test.sh, v0.6 chunk 10)
# composes each kind live, on the series the fixture's exporter really
# exports: it connects to the database postgres, so the shop's tables have
# no pg_stat_user_tables_* series; pg_stat_database_*, pg_database_size_bytes,
# pg_stat_activity_* and pg_locks_count carry datname.
id: fixture-dropped-index
version: 0.1.0
title: the index serving lookups by customer is gone
family: performance
severity: medium

applies_to:
  bricks:
    - id: postgres
      versions: ["0.1.0", "0.1.1", "0.2.0", "0.3.0", "0.4.0", "0.5.0", "0.5.1"]
  preconditions: []

# --- How long its evidence takes -----------------------------------------
aging:
  technique: real-time
  minimum: 0m                       # the evidence shows at once (a restored state, D160)
  fake:                             # v0.6 master spec 6.3, 6.9: the supported case
    support: supported
    reason: >-
      a fixture's (fixture-fill, spec D533): the fill drops the index at its
      pause, the sequential scans' counter is imitated by the history
history:                            # the signature, its placeholders resolved per instance
  - kind: queue                     # the key's own service time (nodes/producer/service-times.yaml), so run-short-test.sh's p50 check holds
    key: orders.detail
    service: {median: 0.0014, sigma: 0.35}
  - kind: counter_per_call          # each lookup scans the table: the catalogue's pg-join-index-missing's measured figure (chunk 11a)
    series: 'pg_stat_database_tup_returned{datname="{DATABASE}"}'
    key: orders.detail
    per_call: 963700
  - kind: gauge_sawtooth            # the scans' transactions, longer in a five-minute cycle
    series: 'pg_stat_activity_max_tx_duration{datname="{DATABASE}",state="active"}'
    period: 300s
    amplitude: 0.5
  - kind: gauge_before              # the database's size with the index, before its drop: run R's shop at its start (r-dump/r.om, 182.5 MB) plus the index, about 20 MB
    series: 'pg_database_size_bytes{datname="{DATABASE}"}'
    value: 202500000
  - kind: daily_spike               # the lookups piling up once a day, after the drop (13:20: after the history run's planting, 12:00, before its anchor)
    series: 'pg_stat_activity_count{datname="{DATABASE}",state="active"}'
    at: "13:20"
    duration: 10m
    value: 6
  - kind: remove                    # no predicate lock since the drop (a fixture's: the kind exercised)
    series: 'pg_locks_count{datname="{DATABASE}",mode="sireadlock"}'

parameters:
  database:
    description: the database holding the table
    default: shop
    required: false
  table-name:
    description: the table whose index is dropped
    default: orders
    required: false
  column:
    description: the leading column of the dropped index(es)
    default: null
    required: true

injection:
  kind: state
  stage: after-data-load
  scripts:
    - inject/10-drop-index.sh
    - inject/20-analyze.sh
  run_as: root

evidence:
  - where: node
    source: the table's indexes, and the plan of a lookup by customer
    how: psql -c '\d orders', then EXPLAIN SELECT * FROM orders WHERE customer_id = 42
    shows: no index on customer_id; the lookup is a sequential scan of orders

probe:
  description: checks/probe.md
  runs_as: player

resolutions:
  - kind: report
    write_policies: [report-only, fixable]
  - kind: fix
    write_policies: [fixable]
acceptance:
  diagnosis: names the missing index on orders (customer_id) as the cause of the slow lookups.
  fix: an index whose leading column is customer_id exists on orders and is valid.

sealed_check:
  script: checks/fixed.sh
  run_as: root

interactions:
  masks: []
  masked_by: []
  conflicts_with: []

complaint_template: >-
  Looking up a customer's orders has become slow.
