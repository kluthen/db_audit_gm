# Core fixture of v0.5 (build plan chunk 9b; capture W2 item 4, W2-d, of
# specs/versions/v0.5/wave-log.md). Not a game: vet-core's medical record,
# loaded by gmctl load-data from the domain (domains:, the variant
# regional-franchise, at records/clinic: schema.sql, keys.sql streamed ahead
# of load.sql, the login roles' passwords from their secrets), and its lookup
# API, clinic-api (api 0.1.0), reading as vet_lookup behind the credential
# clinic_lookup, the practice software, pms (scheduler 0.3.0), as vet_app,
# and the bastion; four nodes on one host. gmctl compose writes clinic-api's
# and pms's files under nodes/ from the domain's producers/api/clinic-api/
# and producers/pms/, with the scenario layer compose/pms/ (intensity 0.1:
# the practice software present but quiet). Deployed by its short test,
# tools/tests/fixtures/fixture-core/run-short-test.sh: the lookup endpoints
# answer for loaded animals and never return a contact or a death; pms
# idle until start-load, then running without an error. One harmless
# seed-file fault (f1), since a scenario needs at least one, copied from the
# monitoring fixture.

# --- Scenario information --------------------------------------------
id: fixture-core
version: 0.1.0
title: Core fixture, vet-core's record and its lookup API through load-data
date: 2026-11-04
origin: hand-written
session_length_minutes: 60
brief: brief.md
background: >-
  A veterinary hospital keeps its medical record in one PostgreSQL
  database, records, and answers its laboratory's and imaging service's
  identity questions through a small lookup API, reached through a bastion.

# --- Aging and difficulty ---------------------------------------------
aging:
  minimum: 8h                       # the floor (master spec 8.2); the short test never ages it
  handover_at: "14:00"
difficulty:
  score: 1                          # its one fault instance (master spec 15.1)
  level: easy

# --- Domains (v0.5 master spec 6, 8) ----------------------------------
domains:
  - id: vet-core
    variant: regional-franchise
    at: records/clinic

# --- Topology ---------------------------------------------------------
networks:
  - name: backend
    description: players' SSH and SQL sessions, the practice software's and the lookup API's SQL, the lookup API's callers' HTTP

nodes:
  - name: bastion
    brick:
      id: bastion
      version: 0.5.0
    role: bastion
    stateful: true
    networks: [backend]
    write_policy: report-only
    parameters:
      web_routes: {}
    resources:
      limits:
        cpu: 0.5
        memory: 256M
      reservations:
        cpu: 0.1
        memory: 96M
        disk: 256M
    published_ports:
      - port: 22
        default: 2222
      - port: 8080
        default: 8080
    seed_files:
      README.md: player/README.md
      story.md: player/story.md
      issues.md: player/issues.md
    knobs: []

  - name: records
    brick:
      id: postgres
      version: 0.5.0
    role: database
    stateful: true
    networks: [backend]
    write_policy: fixable
    parameters: {}
    resources:
      limits:
        cpu: 1
        memory: 1G
      reservations:
        cpu: 0.5
        memory: 512M
        disk: 2.25G
    published_ports: []
    seed_files:
      postgresql.conf: nodes/records/postgresql.conf
      pg_hba.conf: nodes/records/pg_hba.conf
    knobs:
      - setting: shared_buffers
        initial: 128MB
        envelope: {min: 64MB, max: 256MB}
      - setting: work_mem
        initial: 4MB
        envelope: {min: 1MB, max: 64MB}
      - setting: maintenance_work_mem
        initial: 64MB
        envelope: {min: 16MB, max: 256MB}
      - setting: max_connections
        initial: 100
        envelope: {min: 10, max: 200}
      - setting: max_wal_size
        initial: 1GB
        envelope: {min: 64MB, max: 1GB}
      - setting: autovacuum
        initial: "on"
        envelope: {allowed: ["on"]}

  - name: clinic-api
    brick:
      id: api
      version: 0.1.0
    role: api
    stateful: true
    networks: [backend]
    write_policy: report-only
    parameters: {}
    resources:
      limits:
        cpu: 0.25
        memory: 128M
      reservations:
        cpu: 0.1
        memory: 128M
        disk: 64M
    published_ports: []
    seed_files:
      api.yaml: nodes/clinic-api/api.yaml
      routes/: nodes/clinic-api/routes/
      db/: nodes/clinic-api/db/
    knobs: []

  - name: pms
    brick:
      id: scheduler
      version: 0.3.0
    role: producer
    stateful: true
    networks: [backend]
    write_policy: no-access
    parameters: {}
    resources:
      limits:
        cpu: 0.25
        memory: 128M
      reservations:
        cpu: 0.1
        memory: 64M
        disk: 128M
    published_ports: []
    seed_files:
      queries.yaml: nodes/pms/queries.yaml
      jobs.yaml: nodes/pms/jobs.yaml
      schedule.yaml: nodes/pms/schedule.yaml
    knobs: []

flows:
  - from: bastion
    to: records
    what: players' SSH and SQL sessions
    how: ssh 22, postgresql 5432
    cadence: interactive
  - from: bastion
    to: clinic-api
    what: players' SSH sessions; a lookup needs the credential clinic_lookup, which the bastion does not hold
    how: ssh 22, http 8000
    cadence: interactive
  - from: clinic-api
    to: records
    what: the lookups (an animal, its current owner, the current stays), as vet_lookup
    how: postgresql 5432
    cadence: per request
  - from: pms
    to: records
    what: the practice software's work (vet-core's 21 streams and 2 jobs), as vet_app
    how: postgresql 5432
    cadence: continuous, by the clinic's hours

# --- Incidents, flaws and defects ------------------------------------
fault_instances:
  - id: f1
    fault:
      id: fixture-random-page-cost
      version: 0.1.0
    node: records
    parameters: {}
    visibility: hidden

issues: []

# --- Host topology it was designed for -------------------------------
designed_for:
  platform: swarm
  hosts:
    - name: laptop
      cpu: 2
      memory: 4G
      disk: 8G
  placement:
    bastion: laptop
    records: laptop
    clinic-api: laptop
    pms: laptop
