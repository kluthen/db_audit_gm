# The scenario layer of node interfaces, the integration engine: purpose 11's
# (vet-bookings-sync) material as the GM copies it, unchanged (records/clinic
# is this fixture's mapping).
# Fixed-time operations of the centre's integration engine for the agenda
# and the record, a fragment (purpose 11; vet-scheduling-domain.md, "11.
# vet-bookings-sync"; capture W4 items 0 and 6), in scenario time: the three
# script jobs every minute, each holding the record's connection as
# vet_interfaces (clinic) and the agenda's as sched_interfaces (sched), the
# same database. Written for the node records; the GM adapts it.
jobs:
  - name: check-in
    key: bookings.check-in
    connections: {clinic: clinic, sched: sched}
    at: "* * * * *"
  - name: book-requests
    key: bookings.book-requests
    connections: {clinic: clinic, sched: sched}
    at: "* * * * *"
  - name: cancel-deceased
    key: bookings.cancel-deceased
    connections: {clinic: clinic, sched: sched}
    at: "* * * * *"
