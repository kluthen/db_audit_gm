# Catalog fault: the index on a frequently joined column is missing
# (master spec 15). A state fault: the restored data carries the index;
# injection drops it after the data load and refreshes the statistics.

# --- Identity ---------------------------------------------------------
id: pg-join-index-missing
version: 0.1.0
title: the index on a frequently joined column is missing
family: performance
severity: medium

# --- Where it applies -------------------------------------------------
applies_to:
  bricks:
    - id: postgres
      versions: ["0.1.0", "0.1.1", "0.2.0", "0.3.0"]
  preconditions: []

# --- How long its evidence takes -----------------------------------------
aging:
  technique: real-time
  minimum: 0m                       # the evidence shows at once (a restored state, D160)

# --- Parameters the scenario sets -------------------------------------
parameters:
  database:
    description: the database holding the table
    default: null
    required: true
  table-name:
    description: the table (schema-qualified if not in the search path) whose index is dropped
    default: null
    required: true
  column:
    description: the joined column; every index leading with it (primary key and constraint indexes aside) is dropped
    default: null
    required: true

# --- How it is planted ------------------------------------------------
injection:
  kind: state
  stage: after-data-load
  scripts:
    - inject/10-drop-index.sh
    - inject/20-analyze.sh
  run_as: root

# --- What the players can see ------------------------------------------
evidence:
  - where: node
    source: the table's definition
    how: psql -d {DATABASE} -c '\d {TABLE_NAME}'
    shows: a foreign key on the column, but no index leading with it
  - where: node
    source: the plan of a join or lookup through that column
    how: psql -d {DATABASE} -c 'EXPLAIN SELECT ... WHERE {COLUMN} = 42'
    shows: a sequential scan of the whole table where an index scan was expected
  - where: node
    source: index catalogue
    how: SELECT indexdef FROM pg_indexes WHERE tablename = '{TABLE_NAME}'
    shows: no index whose first column is the joined column

probe:
  description: checks/probe.md
  runs_as: player

# --- Resolutions and acceptance ----------------------------------------
resolutions:
  - kind: report
    write_policies: [report-only, fixable]
  - kind: propose
    write_policies: [report-only, fixable]
  - kind: fix
    write_policies: [fixable]
acceptance:
  diagnosis: >-
    names the missing index on the joined column (the foreign key has no
    index) as the reason lookups and joins through it read the whole table;
    backs it with a plan (EXPLAIN) showing the sequential scan.
  proposal: >-
    CREATE INDEX (CONCURRENTLY on a live system) on the column, then a plan
    showing an index or bitmap scan.
  fix: >-
    a valid index whose first column is the joined column exists on the
    table, whatever its name and however it was built.

# --- The sealed check ----------------------------------------------------
sealed_check:
  script: checks/fixed.sh
  run_as: root

# --- Interactions with other faults ------------------------------------
interactions:
  masks: []
  masked_by: []
  conflicts_with: []

# --- When the fault is known ---------------------------------------------
complaint_template: >-
  Since the migration, screens that go through {TABLE_NAME} have become
  slow, and they get slower as the business grows.
