# Catalog fault: the index on a frequently joined column is missing
# (master spec 15). A state fault: the restored data carries the index;
# injection drops it after the data load and refreshes the statistics.

# --- Identity ---------------------------------------------------------
id: pg-join-index-missing
version: 0.1.0
title: the index on a frequently joined column is missing
family: performance
severity: medium

# --- Where it applies -------------------------------------------------
applies_to:
  bricks:
    - id: postgres
      versions: ["0.1.0", "0.1.1", "0.2.0", "0.3.0", "0.4.0", "0.5.0", "0.5.1"]
  preconditions: []

# --- How long its evidence takes -----------------------------------------
aging:
  technique: real-time
  minimum: 0m                       # the evidence shows at once (a restored state, D160)
  fake:                             # v0.6 master spec 6.3, 9.5, 9.8 (capture W3 items 8, 9)
    support: supported
    reason: >-
      the fill drops the index at the instance's planting on the virtual
      clock, so the later joins scan the table; the history draws the
      scanned rows and blocks of each call and its longer service time
    plant_in: any
    fill:
      emulate: []
# The history signature (master spec 9.5, 9.7). Numbers from run R
# (research/fake-aging 10d1bc6, fa-real 2026-11-14 to 15; f8 planted at
# 2026-11-15T02:00Z): the counters read with tools/fake_aging/calibrate.py
# per-call --planted from the reference's r-dump/r.om, the rate per call of
# every key from 2026-11-14T20:00Z taken as the baseline; the service time
# from R's log as calibrate-r-producer-20261115.txt summarises it, its sigma
# the key's own (R's p95 is the pool's queue, f7, which the model adds). The
# database node's CPU was measured too and left out: 0.0012 s a call, within
# the baseline's noise (0.0087 s a call of any key before, 0.0088 after).
history:
  - kind: queue                     # each call's work from the planting: the join scans the table
    key: '{KEY}'
    service: {median: 0.024, sigma: 0.35}  # measured: calibrate-r-producer-20261115.txt, orders.detail p50 24 ms in hours 08-10 after the planting (2 ms before); sigma the key's own (service-times.yaml)
  - kind: counter_per_call
    series: 'pg_stat_database_tup_returned{datname="{DATABASE}"}'
    key: '{KEY}'
    per_call: 963700                # measured: r-dump/r.om, tup_returned 2.826e9 after the planting less the baseline, over orders.detail's 2902 calls, 2026-11-15T02:00Z to 08:00Z
  - kind: counter_per_call
    series: 'pg_stat_database_blks_hit{datname="{DATABASE}"}'
    key: '{KEY}'
    per_call: 12410                 # measured: r-dump/r.om, blks_hit 3.883e7 after the planting less the baseline, over the same 2902 calls

# --- Parameters the scenario sets -------------------------------------
parameters:
  database:
    description: the database holding the table
    default: null
    required: true
  table-name:
    description: the table (schema-qualified if not in the search path) whose index is dropped
    default: null
    required: true
  column:
    description: the joined column; every index leading with it (primary key and constraint indexes aside) is dropped
    default: null
    required: true

  key:
    description: >-
      the queries.yaml key whose join the missing index slows, for the
      history signature (v0.6 master spec 9.5); optional, read only in a
      fake game, so every instance in a scenario played fake sets it
    default: null
    required: false

# --- How it is planted ------------------------------------------------
injection:
  kind: state
  stage: after-data-load
  scripts:
    - inject/10-drop-index.sh
    - inject/20-analyze.sh
  run_as: root

# --- What the players can see ------------------------------------------
evidence:
  - where: node
    source: the table's definition
    how: psql -d {DATABASE} -c '\d {TABLE_NAME}'
    shows: a foreign key on the column, but no index leading with it
  - where: node
    source: the plan of a join or lookup through that column
    how: psql -d {DATABASE} -c 'EXPLAIN SELECT ... WHERE {COLUMN} = 42'
    shows: a sequential scan of the whole table where an index scan was expected
  - where: node
    source: index catalogue
    how: SELECT indexdef FROM pg_indexes WHERE tablename = '{TABLE_NAME}'
    shows: no index whose first column is the joined column

probe:
  description: checks/probe.md
  runs_as: player

# --- Resolutions and acceptance ----------------------------------------
resolutions:
  - kind: report
    write_policies: [report-only, fixable]
  - kind: propose
    write_policies: [report-only, fixable]
  - kind: fix
    write_policies: [fixable]
acceptance:
  diagnosis: >-
    names the missing index on the joined column (the foreign key has no
    index) as the reason lookups and joins through it read the whole table;
    backs it with a plan (EXPLAIN) showing the sequential scan.
  proposal: >-
    CREATE INDEX (CONCURRENTLY on a live system) on the column, then a plan
    showing an index or bitmap scan.
  fix: >-
    a valid index whose first column is the joined column exists on the
    table, whatever its name and however it was built.

# --- The sealed check ----------------------------------------------------
sealed_check:
  script: checks/fixed.sh
  run_as: root

# --- Interactions with other faults ------------------------------------
interactions:
  masks: []
  masked_by: []
  conflicts_with: []

# --- When the fault is known ---------------------------------------------
complaint_template: >-
  Since the migration, screens that go through {TABLE_NAME} have become
  slow, and they get slower as the business grows.
