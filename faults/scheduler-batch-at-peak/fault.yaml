# Catalog fault: a nightly batch runs at the daily peak (v0.3 master spec
# 15.3; capture W4 items 0, 1 and 7; spec D189). A seed-file fault planted
# at render: the scenario's jobs.yaml times the batch inside the busy hours
# of the node's schedule instead of the night. Its evidence shows at the
# job's runs, so its aging minimum counts from the job's first run at its
# planted time: a scenario raises the instance's aging_minimum to that run's
# offset from its designed T0 plus 1h.

# --- Identity ---------------------------------------------------------
id: scheduler-batch-at-peak
version: 0.1.0
title: a nightly batch runs at the daily peak
family: performance
severity: medium

# --- Where it applies -------------------------------------------------
applies_to:
  bricks:
    - id: scheduler
      versions: ["0.1.0"]
  preconditions: []

# --- How long its evidence takes -----------------------------------------
aging:
  technique: real-time
  minimum: 1h                       # counted from the job's first run at its planted time (spec
                                    # D189): the scenario's instance raises its aging_minimum

# --- Parameters the scenario sets -------------------------------------
parameters:
  job:
    description: the jobs.yaml job (the nightly batch) timed inside the daily peak
    default: null
    required: true
  shape:
    description: the shape of the node's schedule.yaml whose busy hours the job must avoid
    default: null
    required: true
  quiet-below:
    description: the multiplier at or below which an hour of the shape counts as quiet
    default: 0.5
    required: false

# --- How it is planted ------------------------------------------------
injection:
  kind: seed-file
  stage: seed
  seed_changes:
    - file: jobs.yaml
      change: >-
        the {JOB} job's at puts it inside the daily peak of the {SHAPE}
        shape instead of the night
  run_as: root

# --- What the players can see ------------------------------------------
evidence:
  - where: node
    source: the fixed-time operations, in UTC
    how: cat /srv/scheduler/jobs/jobs.yaml
    shows: the {JOB} job's at (UTC) inside the business day of the customer
  - where: node
    source: the scheduler's log
    how: grep -E 'run job={JOB} |key minute=' /var/log/scheduler/scheduler.log
    shows: the {JOB} job's runs at that time with their ms=, and the other keys' p95_ms rising in the same minutes
  - where: bastion
    source: pg_stat_activity and pg_locks during a run
    how: >-
      psql -c "SELECT pid, application_name, state, wait_event_type, now() - query_start,
      query FROM pg_stat_activity WHERE wait_event_type = 'Lock' OR state = 'active'"
    shows: the batch's statement active and other sessions waiting on its locks
  - where: bastion
    source: the customer's time zone
    how: cat ~/story.md
    shows: the time zone the business day is counted in, beside the job's UTC time

probe:
  description: checks/probe.md
  runs_as: player

# --- Resolutions and acceptance ----------------------------------------
resolutions:
  - kind: report
    write_policies: [report-only, fixable]
  - kind: propose
    write_policies: [report-only, fixable]
  - kind: fix
    write_policies: [fixable]
acceptance:
  diagnosis: >-
    names the {JOB} batch as running inside the daily peak (its UTC time
    read in the customer's time zone), and what it does to the day's
    traffic: lock waits and slower calls while it runs.
  proposal: >-
    move the {JOB} batch to a quiet hour of the night (its at, in UTC or
    with the customer's time zone), and check it ends before the morning.
  fix: >-
    every run of the {JOB} job, as loaded (jobs.yaml edited and reloaded
    with sudo gm-reload-scheduler), falls in an hour where the {SHAPE}
    shape's multiplier is at most {QUIET_BELOW}, on each weekday it runs.

# --- The sealed check ----------------------------------------------------
sealed_check:
  script: checks/fixed.sh
  run_as: root

# --- Interactions with other faults ------------------------------------
interactions:
  masks: []
  masked_by: []
  conflicts_with: []

# --- When the fault is known ---------------------------------------------
complaint_template: >-
  Around midday the application freezes for a while: orders take seconds
  to save, then everything is back to normal.
