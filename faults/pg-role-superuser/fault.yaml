# Catalog fault: an application role with superuser rights (master spec
# 15). A state fault: planted after the data load, on a role the data
# file created.

# --- Identity ---------------------------------------------------------
id: pg-role-superuser
version: 0.1.0
title: an application role has superuser rights
family: security
severity: high

# --- Where it applies -------------------------------------------------
applies_to:
  bricks:
    - id: postgres
      versions: ["0.1.0", "0.1.1", "0.2.0"]
  preconditions: []

# --- Parameters the scenario sets -------------------------------------
parameters:
  role:
    description: the application's login role made superuser (it must exist after the data load)
    default: null
    required: true

# --- How it is planted ------------------------------------------------
injection:
  kind: state
  stage: after-data-load
  scripts:
    - inject/10-grant-superuser.sh
  run_as: root

# --- What the players can see ------------------------------------------
evidence:
  - where: the roles of the cluster
    how: psql -c '\du', or SELECT rolname, rolsuper FROM pg_roles WHERE rolsuper
    shows: the application role listed with the Superuser attribute, next to dba and postgres

probe:
  description: checks/probe.md
  runs_as: player

# --- Resolutions and acceptance ----------------------------------------
resolutions:
  - kind: report
    write_policies: [report-only, fixable]
  - kind: propose
    write_policies: [report-only, fixable]
  - kind: fix
    write_policies: [fixable]
acceptance:
  diagnosis: >-
    names the application role as a superuser and says why it matters: the
    application (or whoever steals its password) can read and change every
    database, bypass every permission, and run operating-system commands as
    postgres.
  proposal: >-
    remove the superuser attribute (ALTER ROLE ... NOSUPERUSER) and give the
    role only what the application needs (ownership of, or grants on, its
    own database); checks that the application can still work.
  fix: >-
    the role still exists and is no longer a superuser (rolsuper false in
    pg_roles).

# --- The sealed check ----------------------------------------------------
sealed_check:
  script: checks/fixed.sh
  run_as: root

# --- Interactions with other faults ------------------------------------
interactions:
  masks: []
  masked_by: []
  conflicts_with: []

# --- When the fault is known ---------------------------------------------
complaint_template: >-
  We would like to know whether our application has more rights on the
  database than it needs. It connects as {ROLE}.
