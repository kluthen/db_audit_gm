# SSH client settings of the db_audit_gm bastion (DO NOT TAMPER).
#
# In-game nodes are reached by their node name, which has no dot (`db`).
# A node's sshd host key is created anew whenever its container is
# replaced, so a remembered key would lock the players out after a node
# replacement. For these names only, host keys are neither checked nor
# remembered. Anything with a dot (an address, a domain name) keeps
# OpenSSH's default checks.
#
# The inner hop reaches a node through its Swarm service address, which
# forgets a TCP flow idle for about 900 s: an idle session would hang.
# A keepalive every 60 s keeps the flow alive (default ServerAliveCountMax:
# a dead node is noticed after about 3 minutes).
Host * !*.*
    StrictHostKeyChecking no
    UserKnownHostsFile /dev/null
    LogLevel ERROR
    ServerAliveInterval 60
