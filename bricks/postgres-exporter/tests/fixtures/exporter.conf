# Test seed for the postgres-exporter brick's stack test
# (bricks/postgres-exporter/tests). Not a scenario.
# The database node's address: <db node>:5432/postgres; postgres 0.2.0 runs
# without SSL.
DATA_SOURCE_URI=db:5432/postgres?sslmode=disable
# The monitoring role postgres 0.2.0 creates (pg_monitor); its password is
# the secret monitoring_password, never written here.
DATA_SOURCE_USER=monitoring
# Query statistics; needs shared_preload_libraries = 'pg_stat_statements'
# on the database node.
COLLECTORS=--collector.stat_statements
