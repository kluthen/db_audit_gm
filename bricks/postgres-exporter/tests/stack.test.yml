# Stack test fixture for the postgres-exporter brick (v0.2 build plan,
# chunk 9): the exporter node and the postgres 0.3.0 node `db` it watches,
# both reading the same monitoring_password secret, each with its own
# owner and mode.
# Uses only what a rendered Compose 3.8 stack file can express: no tmpfs
# `mode` or `exec` option. Configs and secrets are external, created and
# removed by run-stack-test.sh (mirroring gmctl deploy). No published port.
version: "3.8"

services:
  exporter:
    image: 127.0.0.1:5000/dbagm/postgres-exporter:0.2.0
    hostname: exporter
    read_only: true
    cap_drop: [ALL]
    cap_add: [AUDIT_WRITE, CHOWN, DAC_OVERRIDE, FOWNER, KILL, NET_BIND_SERVICE, SETGID, SETUID, SYS_CHROOT]
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "/usr/local/lib/gm/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - {type: volume, source: exp_conf, target: /etc/postgres-exporter}
      - {type: volume, source: exp_home, target: /home/player}
      - {type: volume, source: exp_gmstate, target: /var/lib/gm-state}
      - {type: volume, source: exp_run, target: /run}
    configs:
      - {source: seed_exporter_conf, target: /opt/gm/seed/exporter.conf, uid: "0", gid: "0", mode: 0444}
    secrets:
      - {source: player_ssh_pubkey, target: /opt/gm/secrets/player_ssh_pubkey, uid: "0", gid: "0", mode: 0444}
      - {source: monitoring_password, target: /opt/gm/secrets/monitoring_password, uid: "0", gid: "990", mode: 0440}
    networks: [net]
    deploy:
      replicas: 1
      resources:
        limits: {cpus: "0.25", memory: 128M}

  db:
    image: 127.0.0.1:5000/dbagm/postgres:0.3.0
    hostname: db
    read_only: true
    cap_drop: [ALL]
    cap_add: [AUDIT_WRITE, CHOWN, DAC_OVERRIDE, FOWNER, KILL, NET_BIND_SERVICE, SETGID, SETUID, SYS_CHROOT]
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "/usr/local/lib/gm/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - {type: volume, source: db_pgdata, target: /var/lib/postgresql/18/data}
      - {type: volume, source: db_pgconf, target: /etc/postgresql}
      - {type: volume, source: db_home, target: /home/player}
      - {type: volume, source: db_gmstate, target: /var/lib/gm-state}
      - {type: volume, source: db_pglog, target: /var/log/postgresql}
      - {type: volume, source: db_run, target: /run}
    configs:
      - {source: seed_postgresql_conf, target: /opt/gm/seed/postgresql.conf, uid: "0", gid: "0", mode: 0444}
      - {source: seed_pg_hba_conf, target: /opt/gm/seed/pg_hba.conf, uid: "0", gid: "0", mode: 0444}
      - {source: envelopes, target: /opt/gm/protected/envelopes.conf, uid: "0", gid: "0", mode: 0444}
    secrets:
      - {source: player_ssh_pubkey, target: /opt/gm/secrets/player_ssh_pubkey, uid: "0", gid: "0", mode: 0444}
      - {source: dba_password, target: /opt/gm/secrets/dba_password, uid: "0", gid: "0", mode: 0400}
      - {source: monitoring_password, target: /opt/gm/secrets/monitoring_password, uid: "0", gid: "102", mode: 0440}
    networks: [net]
    deploy:
      replicas: 1
      resources:
        limits: {cpus: "0.5", memory: 512M}

networks:
  net:
    driver: overlay
    attachable: true   # test only: lets the test client container join

volumes:
  exp_conf: {}
  exp_home: {}
  exp_gmstate: {}
  exp_run: {}
  db_pgdata: {}
  db_pgconf: {}
  db_home: {}
  db_gmstate: {}
  db_pglog: {}
  db_run: {}

configs:
  seed_exporter_conf: {external: true, name: gmtest-pgexp_seed_exporter_conf}
  seed_postgresql_conf: {external: true, name: gmtest-pgexp_seed_postgresql_conf}
  seed_pg_hba_conf: {external: true, name: gmtest-pgexp_seed_pg_hba_conf}
  envelopes: {external: true, name: gmtest-pgexp_envelopes}

secrets:
  player_ssh_pubkey: {external: true, name: gmtest-pgexp_player_ssh_pubkey}
  dba_password: {external: true, name: gmtest-pgexp_dba_password}
  monitoring_password: {external: true, name: gmtest-pgexp_monitoring_password}
