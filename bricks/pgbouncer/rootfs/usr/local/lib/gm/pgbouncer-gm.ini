;; The GM's settings for PgBouncer on the db_audit_gm PgBouncer node.
;; DO NOT TAMPER. Root-owned, read-only (v0.3 master spec 7.2).
;;
;; PgBouncer reads /run/pgbouncer-conf/pgbouncer.ini: the scenario's
;; /etc/pgbouncer/pgbouncer.ini line for line, with this file included at
;; the end of its [pgbouncer] section (/usr/local/lib/gm/pgbouncer-conf).
;; So these settings win over the same settings written there: the ports,
;; the local socket and the log the game relies on, authentication through
;; the database's lookup function, and the console's users (the players'
;; role dba reads, only PgBouncer's own account administers). Every other
;; setting is pgbouncer.ini's.
listen_addr = *
listen_port = 6432
unix_socket_dir = /run/pgbouncer
pidfile =
logfile = /var/log/pgbouncer/pgbouncer.log

;; Every login is checked against pgbouncer_hba.conf: the console's admin
;; by peer over the local socket, everyone else by password (SCRAM).
auth_type = hba
auth_hba_file = /usr/local/lib/gm/pgbouncer_hba.conf
;; The only password PgBouncer holds: the lookup role's, written from its
;; secret at every start. Every other role's verifier comes from the
;; database (gm_pgbouncer.lookup in database postgres), superusers included.
auth_file = /run/pgbouncer-auth/userlist.txt
auth_user = pgbouncer_lookup
auth_dbname = postgres
auth_query = SELECT usename, passwd FROM gm_pgbouncer.lookup($1)

;; The console (database pgbouncer): dba reads it (SHOW ...); only
;; PgBouncer's own account changes settings, reloads, pauses or stops it.
admin_users = pgbouncer
stats_users = dba
