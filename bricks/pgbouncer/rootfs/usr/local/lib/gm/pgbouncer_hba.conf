# Who may log in to PgBouncer on the db_audit_gm PgBouncer node.
# DO NOT TAMPER. Root-owned, read-only (v0.3 master spec 7.2); named by
# auth_hba_file in /usr/local/lib/gm/pgbouncer-gm.ini.
#
# The console's admin, PgBouncer's own account, over the local socket only
# and only to the console: the GM's (docker exec -u pgbouncer, or gmctl exec
# --user pgbouncer). Every other role logs in by password, checked against
# the verifier the database's lookup function returns.
# TYPE  DATABASE   USER       ADDRESS     METHOD
local   pgbouncer  pgbouncer              peer
local   all        pgbouncer              reject
host    all        pgbouncer  0.0.0.0/0   reject
host    all        pgbouncer  ::/0        reject
local   all        all                    scram-sha-256
host    all        all        0.0.0.0/0   scram-sha-256
host    all        all        ::/0        scram-sha-256
