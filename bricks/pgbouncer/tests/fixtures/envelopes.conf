# Envelope file of node pooler, rendered by gmctl render.
# <setting> range <min> <max>   |   <setting> enum <v1>,<v2>,...
# Read by the node's validator; root-owned, read-only.
default_pool_size range 1 50
max_client_conn range 10 500
max_db_connections range 0 200
reserve_pool_size range 0 20
pool_mode enum session,transaction
