;; Test seed for the PgBouncer brick's stack test (bricks/pgbouncer/tests).
;; The scenario's part of PgBouncer's configuration: the databases and the
;; pool settings. The GM's settings (ports, socket, log, authentication,
;; console users) are in /usr/local/lib/gm/pgbouncer.ini, applied after it.

[databases]
;; postgres: where PgBouncer looks the logins up (auth_dbname)
postgres = host=db port=5432 dbname=postgres
appdb = host=db port=5432 dbname=appdb

[pgbouncer]
pool_mode = session
default_pool_size = 5
max_client_conn = 50
max_db_connections = 0
reserve_pool_size = 0
log_connections = 1
log_disconnections = 1
