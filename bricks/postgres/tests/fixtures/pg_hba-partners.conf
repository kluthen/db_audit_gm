# `no-access` node (a third party's database, v0.5 master spec 10.2). It admits only
# the partners' own role on their database; every other line for the network a reject.
# TYPE  DATABASE  USER          ADDRESS     METHOD
# DO NOT TAMPER: the GM's access to the node (master spec 9.1; v0.3 7.3).
local   all       postgres                  peer
local   replication postgres                peer
local   all       gm_check                  scram-sha-256
host    partners  partners_app  samenet     scram-sha-256
host    all       all           samenet     reject
