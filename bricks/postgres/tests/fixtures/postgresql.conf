# Test seed for the PostgreSQL brick's stack test (bricks/postgres/tests).
# Not a scenario: every knob is inside the test envelope.
listen_addresses = '*'
port = 5432
max_connections = 50
shared_buffers = 128MB
work_mem = 4MB
maintenance_work_mem = 64MB
max_wal_size = 512MB
checkpoint_timeout = 5min
random_page_cost = 4.0
autovacuum = on
wal_level = replica
dynamic_shared_memory_type = posix
log_timezone = 'UTC'
timezone = 'UTC'
lc_messages = 'C.UTF-8'
