# Test seed for the PostgreSQL brick's stack test (bricks/postgres/tests):
# the node with jobs, db2. No `host` line for every role: from the game
# network only the GM check role gets in, through its own line, as every
# database node of a scenario with a data policy admits it (check-psql's
# other-node form, master spec 7.2).
# TYPE  DATABASE  USER      ADDRESS     METHOD
# DO NOT TAMPER: the GM's access to the node (master spec 9.1; v0.3 7.3; v0.4 11.6).
local   all       postgres              peer
local   replication postgres            peer
local   all       gm_check              scram-sha-256
host    all       gm_check  samenet     scram-sha-256
# The players and the crontab's customer roles, over the local socket.
local   all       all                   scram-sha-256
