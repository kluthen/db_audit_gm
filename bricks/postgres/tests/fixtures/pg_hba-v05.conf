# Test seed for the PostgreSQL brick's stack test (bricks/postgres/tests): rec, the v0.5
# primary. From the game network, TLS only: every hostssl line before the `host ... reject`
# that turns a plain connection away.
# TYPE  DATABASE  USER      ADDRESS     METHOD
# DO NOT TAMPER: the GM's access to the node (master spec 9.1; v0.3 7.3).
local   all       postgres              peer
local   replication postgres            peer
local   all       gm_check              scram-sha-256
local   all       all                   scram-sha-256
hostssl all       all       samenet     scram-sha-256
# The standby's streaming replication (v0.5 capture W1 item 6): the role
# replicator, set on the primary by load-data's clone step.
host    replication replicator samenet  scram-sha-256
host    all       all       samenet     reject
