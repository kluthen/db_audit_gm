# Test envelope file for the PostgreSQL brick's stack test.
# <setting> range <min> <max>   |   <setting> enum <v1>,<v2>,...
shared_buffers        range 64MB 256MB
work_mem              range 1MB 64MB
maintenance_work_mem  range 16MB 256MB
max_connections       range 10 200
max_wal_size          range - 1GB
checkpoint_timeout    range 30s 1h
random_page_cost      range 1.0 4
autovacuum            enum on
wal_level             enum replica,logical
