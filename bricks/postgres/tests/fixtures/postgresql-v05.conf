# Test seed for the PostgreSQL brick's stack test (bricks/postgres/tests): rec, the v0.5
# primary (postgres 0.5.0, v0.5 master spec 7.1). Not a scenario: every knob is inside the
# test envelope. The file postgresql.conf beside it, plus what a v0.5 seed turns on: TLS with
# the game's certificate and key (per-game secrets), pgaudit, preloaded, with its classes, and
# WAL archiving to the vault (a standby's primary: its replication line is in pg_hba-v05.conf).
listen_addresses = '*'
port = 5432
max_connections = 10              # the envelope's minimum: five ordinary slots
shared_buffers = 128MB
work_mem = 4MB
maintenance_work_mem = 64MB
max_wal_size = 512MB
checkpoint_timeout = 5min
random_page_cost = 4.0
autovacuum = on
wal_level = replica
dynamic_shared_memory_type = posix
log_timezone = 'UTC'
timezone = 'UTC'
lc_messages = 'C.UTF-8'

# --- Logging, read by pgBadger (master spec 7.5; docs/gm.md) ---------------
# Files on the log volume pglog, readable by the players' group (pgconf),
# rotated by size, timestamps in UTC, English messages (lc_messages above).
logging_collector = on
log_destination = 'stderr'
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_file_mode = 0640
log_rotation_age = 0
log_rotation_size = 10MB
log_truncate_on_rotation = off
log_line_prefix = '%t [%p]: user=%u,db=%d,app=%a,client=%h '
log_min_duration_statement = 100ms
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0

# --- Query statistics (the exporter's query panels) ------------------------
shared_preload_libraries = 'pg_stat_statements,pgaudit'

# --- TLS, always available, turned on here (v0.5 master spec 7.1) ------------
# The game's self-signed certificate and its key, mounted from the secrets
# tls_certificate and tls_key (brick.yaml); pg_hba.conf's hostssl lines.
ssl = on
ssl_cert_file = '/opt/gm/secrets/tls.crt'
ssl_key_file = '/opt/gm/secrets/tls.key'

# --- pgaudit, always available, turned on here (v0.5 master spec 7.1) --------
# Session audit lines (AUDIT: SESSION,...) in the file log above, for the
# classes below; the statement text is logged, parameters are not.
pgaudit.log = 'ddl, role, write'
pgaudit.log_catalog = off
pgaudit.log_parameter = off
pgaudit.log_relation = off
pgaudit.log_statement_once = off

# --- WAL archiving to the vault (v0.5 master spec 7.1, 11.2) -----------------
# Each finished segment posted to cold storage (type wal) by the brick's
# posting command, which fails honestly: PostgreSQL keeps a refused segment
# and retries. archive_timeout: a quiet night still ships, once an hour.
archive_mode = on
archive_command = 'vault-post wal %f %p'
archive_timeout = 1h
