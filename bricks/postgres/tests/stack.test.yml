# Stack test fixture for the PostgreSQL brick (v0.1 chunk 2, v0.2 chunk 6, v0.3 chunk 4
# Done-when); the lookup role's secret is mounted, as in a scenario with a pooler node.
# Uses only what a rendered Compose 3.8 stack file can express: no tmpfs
# `mode` or `exec` option. Configs and secrets are external, created and
# removed by run-stack-test.sh (mirroring gmctl deploy, master spec 10.1).
version: "3.8"

services:
  db:
    image: 127.0.0.1:5000/dbagm/postgres:0.3.0
    hostname: db
    read_only: true
    cap_drop: [ALL]
    cap_add: [AUDIT_WRITE, CHOWN, DAC_OVERRIDE, FOWNER, KILL, NET_BIND_SERVICE, SETGID, SETUID, SYS_CHROOT]
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "/usr/local/lib/gm/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - {type: volume, source: pgdata, target: /var/lib/postgresql/18/data}
      - {type: volume, source: pgconf, target: /etc/postgresql}
      - {type: volume, source: home, target: /home/player}
      - {type: volume, source: gmstate, target: /var/lib/gm-state}
      - {type: volume, source: pglog, target: /var/log/postgresql}
      - {type: volume, source: run, target: /run}
    configs:
      - {source: seed_postgresql_conf, target: /opt/gm/seed/postgresql.conf, uid: "0", gid: "0", mode: 0444}
      - {source: seed_pg_hba_conf, target: /opt/gm/seed/pg_hba.conf, uid: "0", gid: "0", mode: 0444}
      - {source: envelopes, target: /opt/gm/protected/envelopes.conf, uid: "0", gid: "0", mode: 0444}
    secrets:
      - {source: player_ssh_pubkey, target: /opt/gm/secrets/player_ssh_pubkey, uid: "0", gid: "0", mode: 0444}
      - {source: dba_password, target: /opt/gm/secrets/dba_password, uid: "0", gid: "0", mode: 0400}
      - {source: monitoring_password, target: /opt/gm/secrets/monitoring_password, uid: "0", gid: "102", mode: 0440}
      - {source: gm_check_password, target: /opt/gm/secrets/gm_check_password, uid: "0", gid: "0", mode: 0400}
      - {source: pgbouncer_lookup_password, target: /opt/gm/secrets/pgbouncer_lookup_password, uid: "0", gid: "0", mode: 0400}
    networks: [net]
    deploy:
      replicas: 1
      resources:
        limits: {cpus: "0.5", memory: 512M}

networks:
  net:
    driver: overlay
    attachable: true   # test only: lets the test client container join

volumes:
  pgdata: {}
  pgconf: {}
  home: {}
  gmstate: {}
  pglog: {}
  run: {}

configs:
  seed_postgresql_conf: {external: true, name: gmtest-pg_seed_postgresql_conf}
  seed_pg_hba_conf: {external: true, name: gmtest-pg_seed_pg_hba_conf}
  envelopes: {external: true, name: gmtest-pg_envelopes}

secrets:
  player_ssh_pubkey: {external: true, name: gmtest-pg_player_ssh_pubkey}
  dba_password: {external: true, name: gmtest-pg_dba_password}
  monitoring_password: {external: true, name: gmtest-pg_monitoring_password}
  gm_check_password: {external: true, name: gmtest-pg_gm_check_password}
  pgbouncer_lookup_password: {external: true, name: gmtest-pg_pgbouncer_lookup_password}
