# Stack test fixture for the pgwatch brick (v0.5 build plan,
# chunk 10): the pgwatch node and the postgres 0.5.0 node `db` it watches,
# both reading the same monitoring_password secret, each with its own
# owner and mode.
# Uses only what a rendered Compose 3.8 stack file can express: no tmpfs
# `mode` or `exec` option. Configs and secrets are external, created and
# removed by run-stack-test.sh (mirroring gmctl deploy). No published port.
version: "3.8"

services:
  pgwatch:
    image: 127.0.0.1:5000/dbagm/pgwatch:0.1.0
    hostname: pgwatch
    read_only: true
    cap_drop: [ALL]
    cap_add: [AUDIT_WRITE, CHOWN, DAC_OVERRIDE, FOWNER, KILL, NET_BIND_SERVICE, SETGID, SETUID, SYS_CHROOT]
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "/usr/local/lib/gm/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - {type: volume, source: pw_conf, target: /etc/pgwatch}
      - {type: volume, source: pw_home, target: /home/player}
      - {type: volume, source: pw_gmstate, target: /var/lib/gm-state}
      - {type: volume, source: pw_run, target: /run}
    configs:
      - {source: seed_sources_yaml, target: /opt/gm/seed/sources.yaml, uid: "0", gid: "0", mode: 0444}
    secrets:
      - {source: player_ssh_pubkey, target: /opt/gm/secrets/player_ssh_pubkey, uid: "0", gid: "0", mode: 0444}
      - {source: monitoring_password, target: /opt/gm/secrets/monitoring_password, uid: "0", gid: "990", mode: 0440}
    networks: [net]
    deploy:
      replicas: 1
      resources:
        limits: {cpus: "0.25", memory: 128M}   # the brick footprint's limits, rounded

  db:
    image: 127.0.0.1:5000/dbagm/postgres:0.5.0
    hostname: db
    read_only: true
    cap_drop: [ALL]
    cap_add: [AUDIT_WRITE, CHOWN, DAC_OVERRIDE, FOWNER, KILL, NET_BIND_SERVICE, SETGID, SETUID, SYS_CHROOT]
    environment:                    # the option the target chooses, as render passes it
      GM_OPTIONS: monitoring        #   (v0.5 capture W1 items 0, 1; spec D346)
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "/usr/local/lib/gm/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - {type: volume, source: db_pgdata, target: /var/lib/postgresql/18/data}
      - {type: volume, source: db_pgconf, target: /etc/postgresql}
      - {type: volume, source: db_home, target: /home/player}
      - {type: volume, source: db_gmstate, target: /var/lib/gm-state}
      - {type: volume, source: db_pglog, target: /var/log/postgresql}
      - {type: volume, source: db_run, target: /run}
      - {type: volume, source: db_cronspool, target: /var/spool/cron/crontabs}
    configs:
      - {source: seed_postgresql_conf, target: /opt/gm/seed/postgresql.conf, uid: "0", gid: "0", mode: 0444}
      - {source: seed_pg_hba_conf, target: /opt/gm/seed/pg_hba.conf, uid: "0", gid: "0", mode: 0444}
      - {source: envelopes, target: /opt/gm/protected/envelopes.conf, uid: "0", gid: "0", mode: 0444}
    secrets:
      - {source: player_ssh_pubkey, target: /opt/gm/secrets/player_ssh_pubkey, uid: "0", gid: "0", mode: 0444}
      - {source: dba_password, target: /opt/gm/secrets/dba_password, uid: "0", gid: "0", mode: 0400}
      - {source: monitoring_password, target: /opt/gm/secrets/monitoring_password, uid: "0", gid: "102", mode: 0440}
    networks: [net]
    deploy:
      replicas: ${DB_REPLICAS:-1}  # 0 at first: pgwatch starts before its source (spec D356)
      resources:
        limits: {cpus: "0.5", memory: 512M}

networks:
  net:
    driver: overlay
    attachable: true   # test only: lets the test client container join

volumes:
  pw_conf: {}
  pw_home: {}
  pw_gmstate: {}
  pw_run: {}
  db_pgdata: {}
  db_pgconf: {}
  db_home: {}
  db_gmstate: {}
  db_pglog: {}
  db_run: {}
  db_cronspool: {}

configs:
  seed_sources_yaml: {external: true, name: gmtest-pgwatch_seed_sources_yaml}
  seed_postgresql_conf: {external: true, name: gmtest-pgwatch_seed_postgresql_conf}
  seed_pg_hba_conf: {external: true, name: gmtest-pgwatch_seed_pg_hba_conf}
  envelopes: {external: true, name: gmtest-pgwatch_envelopes}

secrets:
  player_ssh_pubkey: {external: true, name: gmtest-pgwatch_player_ssh_pubkey}
  dba_password: {external: true, name: gmtest-pgwatch_dba_password}
  monitoring_password: {external: true, name: gmtest-pgwatch_monitoring_password}
