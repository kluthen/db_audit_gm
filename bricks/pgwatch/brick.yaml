# brick.yaml: pgwatch node, PostgreSQL's metrics for Prometheus from a
# second collector (v0.5 master spec 7.4, 7.5, 14).
#
# Version 0.1.0 (unreleased until the v0.5 release gate, D100). pgwatch's
# release, its download and the build conditions: G9 (specs/versions/v0.5/
# wave-log.md); the seed file, the port and Prometheus' target: capture W2
# item 5; the monitoring role it connects as: the `postgres` brick's option
# `monitoring` (master spec 7.1). Shape as the postgres-exporter brick's.
# Operating notes: docs/gm.md.

# --- Identity ---------------------------------------------------------
id: pgwatch
version: 0.1.0
roles:
  - monitoring                      # v0.3 master spec 6.4's closed list (v0.5 capture W1 item 1)
technology:
  name: pgwatch
  version: "6.1.0"
image: 127.0.0.1:5000/dbagm/pgwatch:0.1.0

# --- Footprint --------------------------------------------------------
footprint:                          # master spec 14's row (0.1 CPU, 96M), less what the
                                    # node-health script adds to it (docs/gm.md, Footprint)
  limits:       {cpu: 0.245, memory: 122M}
  reservations: {cpu: 0.095, memory: 90M, disk: 64M}
  disk_growth_per_hour: 1M          # the players' notes only: pgwatch keeps no store
stateful: true

# --- What the scenario sets -------------------------------------------
parameters: {}                      # the sources and their presets are in the seed file
knobs: []                           # no envelope: the file is checked by the validator

# --- Player plane -----------------------------------------------------
write_policies:                     # GM_WRITE_POLICY, gm-write-policy (docs/gm.md, Access)
  - fixable
  - report-only
writable_paths:
  - /etc/pgwatch                    # pgwatch:pwconf, 2775 (2755 report-only); sources.yaml 0664 (0644)
  - /home/player                    # ~/report.md, the player's notes
protected_files:
  - /etc/ssh/sshd_config
  - /etc/sudoers
  - /etc/sudoers.d/gm-player
  - /usr/local/sbin/gm-entrypoint
  - /usr/local/sbin/gm-restart-pgwatch
  - /usr/local/sbin/gm-validate
  - /usr/local/sbin/gm-write-policy  # the owner and modes, run as root by the two above
  - /usr/local/lib/gm/healthcheck
  - /usr/local/lib/gm/pgwatch-sources  # reads sources.yaml for the service, wrapper, validator
  - /usr/local/bin/pgwatch          # the release's binary, its metric definitions built in
  - /opt/gm/validator/validate.sh
  - /etc/s6-overlay/s6-rc.d
  - /etc/s6-overlay/user-bundles.d
  - /var/lib/gm-state               # seed marker .gm-seeded (volume gmstate)
player_access:
  ssh_account: player
  group: pwconf                     # never pgwatch's group: the password stays out of reach
  sudo_wrappers:
    - /usr/local/sbin/gm-restart-pgwatch
    - /usr/local/sbin/gm-validate
capabilities:                       # added back after cap_drop: ALL; no-new-privileges stays off (sudo)
  - AUDIT_WRITE                     # sudo: audit message (else a warning on every sudo)
  - CHOWN                           # entrypoint: ownership of volumes, seeded and password files
  - DAC_OVERRIDE                    # entrypoint: emptying /run, writing into player/pgwatch dirs
  - FOWNER                          # entrypoint: modes on files it does not own
  - KILL                            # s6: signals (restart) to the pgwatch-owned collector
  - NET_BIND_SERVICE                # sshd on port 22 (Docker sets ip_unprivileged_port_start=0,
                                    # other platforms may not)
  - SETGID                          # sshd, sudo, runuser, s6-setuidgid
  - SETUID                          # sshd, sudo, runuser, s6-setuidgid
  - SYS_CHROOT                      # sshd privilege separation

# --- Runtime ----------------------------------------------------------
healthcheck:                        # healthy once pgwatch's sink has answered in this container
                                    # and while sshd is up; never asks a database (docs/gm.md)
  command: ["/bin/sh", "-c", "/usr/local/lib/gm/healthcheck"]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 60s                 # the bounded wait for the sources' hosts (30 s) included
secrets:
  - name: player_ssh_pubkey         # inner-hop public key, for SSH as player
    kind: key-pair
    pair: player_ssh_key            # the bastion mounts the private half
    half: public
    path: /opt/gm/secrets/player_ssh_pubkey
    uid: 0
    gid: 0
    mode: "0444"                    # sshd reads it as player
  - name: monitoring_password       # the monitoring role of each source (postgres' option)
    kind: password                  # not handed over: 32 characters, players never type it
    path: /opt/gm/secrets/monitoring_password
    uid: 0
    gid: 990                        # pgwatch's group (the Dockerfile fails the build otherwise)
    mode: "0440"                    # root and pgwatch only; copied at each start to
                                    # /run/gm-pgwatch/pgpass (pgwatch 0600), libpq's PGPASSFILE
seed:
  dir: /opt/gm/seed/
  files:
    - sources.yaml                  # pgwatch's YAML sources: name, conn_str, kind, preset, is_enabled
  paths:                            # seed file -> its live in-container path
    sources.yaml: /etc/pgwatch/sources.yaml
protected_configs: []
volumes:
  - name: pwconf                    # sources.yaml, edited by players
    path: /etc/pgwatch
  - name: home
    path: /home/player
  - name: gmstate                   # seed marker /var/lib/gm-state/.gm-seeded, root-owned:
    path: /var/lib/gm-state         #   kept out of the group-writable /etc/pgwatch
  - name: run                       # /run: a stack file's tmpfs is noexec and s6-overlay
    path: /run                      # needs exec; emptied by the entrypoint at each start
processes:
  - pgwatch
  - sshd
snapshot:                           # per volume, the hand-over copy (v0.3 master spec 6.4,
                                    # 7.3 to 7.5); run, emptied at every start, is never copied
  pwconf: copy
  home: copy
  gmstate: copy

# --- Catalog links ----------------------------------------------------
interfaces:
  provides:
    - {name: metrics, protocol: http, port: 9188}   # /metrics, Prometheus' `pgwatch` job; not routed
    - {name: ssh, protocol: ssh, port: 22}
  consumes:
    - {name: sql, protocol: postgresql, port: 5432} # every enabled source of sources.yaml
receives:                           # the image accepts another brick's mounted material
  s6_overlay: "3.2.3.2"             # the version the Dockerfile installs
  commands: [sh, cat, du, df, awk, sed, grep, sleep, perl, s6-svstat, s6-setuidgid]
extra:
  read_only_root: true              # read_only: true in the stack file
  validator:                        # the GM's official run (gmctl validate)
    path: /opt/gm/validator/validate.sh
    run_as: pgwatch                 # docker exec -u pgwatch; gm-validate uses runuser
