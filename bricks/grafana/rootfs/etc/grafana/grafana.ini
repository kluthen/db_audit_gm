# grafana.ini of the db_audit_gm Grafana node (v0.2 master spec 7.4,
# capture W3). DO NOT TAMPER: root-owned, read-only, in the image; not a
# seed file. It holds the administrator account, the sub-path and the
# authentication settings. Everything not set here keeps Grafana's
# defaults (/usr/share/grafana/conf/defaults.ini).
# What a scenario provisions (data source, dashboards, alert rules) is in
# /etc/grafana/provisioning, seeded from /opt/gm/seed at first start.

[paths]
data = /var/lib/grafana
logs = /var/lib/grafana/log
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning

[server]
protocol = http
http_port = 3000
# Served under /grafana/, the path the bastion's web front forwards
# unchanged (route `grafana`).
root_url = %(protocol)s://%(domain)s:%(http_port)s/grafana/
serve_from_sub_path = true

[database]
type = sqlite3
path = grafana.db

[security]
admin_user = admin
# The per-game tools password, read from the secret at each start; the
# entrypoint also applies it to the existing account (docs/gm.md).
admin_password = $__file{/opt/gm/secrets/tools_password}
disable_gravatar = true

[users]
allow_sign_up = false
allow_org_create = false

[auth.anonymous]
enabled = false

[auth.basic]
# The in-node API calls (helper, wrapper, validator, sealed checks) use it;
# the web front clears the players' Authorization header anyway.
enabled = true

[date_formats]
# UTC for every user and dashboard without a time zone of its own. Grafana
# 13 accepts a zone name here (`UTC`); its lowercase `utc` is refused with a
# warning and leaves the browser's zone in effect.
default_timezone = UTC

[log]
mode = console

[smtp]
enabled = false

# No outbound calls: no usage reporting, update checks, news feed, external
# snapshots, plugin pre-installation or plugin key retrieval.
[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[news]
news_feed_enabled = false

[snapshots]
external_enabled = false

[plugins]
preinstall_disabled = true
public_key_retrieval_disabled = true
plugin_admin_enabled = false

[unified_alerting]
# Grafana's own alerting; no contact point is provisioned: firing alerts
# are read in the alerting view.
enabled = true
