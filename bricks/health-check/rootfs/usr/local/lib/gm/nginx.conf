# nginx configuration of the db_audit_gm health node (DO NOT TAMPER).
# Static files only (G9, v0.5 wave log): no proxy, fastcgi, uwsgi, scgi,
# grpc, dav, charset, rewrite, mail or stream directive, no HTTP/2 or 3,
# no dynamic module; GET and HEAD; no directory listing; no version shown.
worker_processes 1;
pid /run/nginx/nginx.pid;
error_log stderr error;
events { worker_connections 64; }
http {
    access_log off;
    server_tokens off;
    autoindex off;
    types {
        text/html html;
        text/plain txt;
    }
    default_type application/octet-stream;
    client_body_temp_path /run/nginx/client_body;
    proxy_temp_path /run/nginx/proxy;
    fastcgi_temp_path /run/nginx/fastcgi;
    uwsgi_temp_path /run/nginx/uwsgi;
    scgi_temp_path /run/nginx/scgi;
    client_max_body_size 1k;
    server {
        listen 8080;
        absolute_redirect off;
        root /var/lib/health/www;
        location /health/ {
            limit_except GET { deny all; }
            index index.html;
        }
        # anything else: no file there, so 404 (no `return`: the rewrite
        # module's directives are not used)
        location / {
            limit_except GET { deny all; }
        }
    }
}
