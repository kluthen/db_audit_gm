# brick.yaml: health-check node, the customer's Nagios-style health tooling:
# check_postgres from cron, the customer's scripts, a status page (v0.5
# master spec 7.4, 7.5, 14).
#
# Version 0.1.0 (unreleased until the v0.5 release gate, D100). Packages and
# build conditions: G9 (specs/versions/v0.5/wave-log.md); the seed files,
# the scripts' convention, the port, the interface and its route: capture
# W2 item 5; the monitoring role it connects as: the `postgres` brick's
# option `monitoring` (master spec 7.1). Operating notes: docs/gm.md.

# --- Identity ---------------------------------------------------------
id: health-check
version: 0.1.0
roles:
  - monitoring                      # v0.3 master spec 6.4's closed list (v0.5 capture W1 item 1)
technology:
  name: check_postgres
  version: "2.26.0"
image: 127.0.0.1:5000/dbagm/health-check:0.1.0

# --- Footprint --------------------------------------------------------
footprint:                          # master spec 14's row (0.1 CPU, 64M), less what the
                                    # node-health script adds to it (docs/gm.md, Footprint)
  limits:       {cpu: 0.245, memory: 122M}
  reservations: {cpu: 0.095, memory: 58M, disk: 64M}
  disk_growth_per_hour: 1M          # the results and the page are rewritten, not appended
stateful: true

# --- What the scenario sets -------------------------------------------
parameters: {}                      # the instances, the schedule and the scripts are seed files
knobs: []                           # no envelope: the files are checked by the validator

# --- Player plane -----------------------------------------------------
write_policies:                     # GM_WRITE_POLICY, gm-write-policy (docs/gm.md, Access)
  - fixable
  - report-only
writable_paths:
  - /etc/health                     # postgres:healthconf, 2775 (2755 report-only); health.yaml
                                    #   0664 (0644); scripts/ 2775 (2755), each script 0775 (0755)
  - /home/player                    # ~/report.md, the player's notes
protected_files:
  - /etc/ssh/sshd_config
  - /etc/sudoers
  - /etc/sudoers.d/gm-player
  - /usr/local/sbin/gm-entrypoint
  - /usr/local/sbin/gm-crontab      # lists or replaces postgres's crontab
  - /usr/local/sbin/gm-run-checks
  - /usr/local/sbin/gm-validate
  - /usr/local/sbin/gm-write-policy  # the owner and modes, run as root by the entrypoint and gm-crontab
  - /usr/local/bin/health-run       # the runs, the results and the page
  - /usr/local/lib/gm/healthcheck
  - /usr/local/lib/gm/nginx.conf    # static files only (G9)
  - /opt/gm/validator/validate.sh
  - /etc/s6-overlay/s6-rc.d
  - /etc/s6-overlay/user-bundles.d
  - /var/lib/gm-state               # seed marker .gm-seeded (volume gmstate)
                                    # the cron spool is not listed: its owner and modes are
                                    #   cron's (players change it through gm-crontab only)
player_access:
  ssh_account: player
  group: healthconf                 # never postgres's group: the password stays out of reach
  sudo_wrappers:
    - /usr/local/sbin/gm-crontab    # -l, or one file read as player (any argument, checked
                                    #   by the wrapper)
    - /usr/local/sbin/gm-run-checks
    - /usr/local/sbin/gm-validate
capabilities:                       # added back after cap_drop: ALL; no-new-privileges stays off (sudo)
  - AUDIT_WRITE                     # sudo: audit message (else a warning on every sudo)
  - CHOWN                           # entrypoint: ownership of volumes, seeded and password files
  - DAC_OVERRIDE                    # entrypoint: emptying /run, writing into player/postgres dirs
  - FOWNER                          # entrypoint: modes on files it does not own
  - KILL                            # s6: signals to the services' processes
  - NET_BIND_SERVICE                # sshd on port 22 (Docker sets ip_unprivileged_port_start=0,
                                    # other platforms may not)
  - SETGID                          # sshd, sudo, runuser, s6-setuidgid, cron
  - SETUID                          # sshd, sudo, runuser, s6-setuidgid, cron
  - SYS_CHROOT                      # sshd privilege separation

# --- Runtime ----------------------------------------------------------
healthcheck:                        # healthy once the page has answered in this container and
                                    # while sshd is up; never asks a database (docs/gm.md)
  command: ["/bin/sh", "-c", "/usr/local/lib/gm/healthcheck"]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 60s
secrets:
  - name: player_ssh_pubkey         # inner-hop public key, for SSH as player
    kind: key-pair
    pair: player_ssh_key            # the bastion mounts the private half
    half: public
    path: /opt/gm/secrets/player_ssh_pubkey
    uid: 0
    gid: 0
    mode: "0444"                    # sshd reads it as player
  - name: monitoring_password       # the monitoring role of each instance (postgres' option)
    kind: password                  # not handed over: 32 characters, players never type it
    path: /opt/gm/secrets/monitoring_password
    uid: 0
    gid: 990                        # postgres's group (the Dockerfile fails the build otherwise)
    mode: "0440"                    # root and postgres only; copied at each start to
                                    # /run/gm-health/pgpass (postgres 0600), libpq's PGPASSFILE
seed:
  dir: /opt/gm/seed/
  files:
    - health.yaml                   # instances: name, host, port, dbname, a standby's primary
    - crontab                       # postgres's crontab: the checks and the scripts, one line each
    - scripts/                      # optional: the customer's scripts, Nagios plugins, one file each
  paths:                            # seed file -> its live in-container path
    health.yaml: /etc/health/health.yaml
    crontab: /var/spool/cron/crontabs/postgres   # installed once, postgres:crontab 0600
    scripts/: /etc/health/scripts
protected_configs: []
volumes:
  - name: healthconf                # health.yaml and scripts/, edited by players
    path: /etc/health
  - name: healthdata                # the results and the page, rewritten by each run
    path: /var/lib/health
  - name: cronspool                 # cron's spool, root:crontab 1730, the crontab
    path: /var/spool/cron/crontabs  #   postgres:crontab 0600, set by the entrypoint at each start
  - name: home
    path: /home/player
  - name: gmstate                   # seed marker /var/lib/gm-state/.gm-seeded, root-owned:
    path: /var/lib/gm-state         #   kept out of the group-writable /etc/health
  - name: run                       # /run: a stack file's tmpfs is noexec and s6-overlay
    path: /run                      # needs exec; emptied by the entrypoint at each start
processes:
  - cron
  - web
  - sshd
snapshot:                           # per volume, the hand-over copy (v0.3 master spec 6.4,
                                    # 7.3 to 7.5); run, emptied at every start, is never copied
  healthconf: copy
  healthdata: copy
  cronspool: copy                   # the crontab as the players left it
  home: copy
  gmstate: copy

# --- Catalog links ----------------------------------------------------
interfaces:
  provides:
    - {name: ui, protocol: http, port: 8080, web_path: /health/}   # the status page, routed `health`
    - {name: ssh, protocol: ssh, port: 22}
  consumes:
    - {name: sql, protocol: postgresql, port: 5432}  # every instance of health.yaml
    - {name: http, protocol: http, port: 8000}       # the backup script: cold storage's GET /manifests
receives:                           # the image accepts another brick's mounted material
  s6_overlay: "3.2.3.2"             # the version the Dockerfile installs
  commands: [sh, cat, du, df, awk, sed, grep, sleep, perl, s6-svstat, s6-setuidgid]
extra:
  read_only_root: true              # read_only: true in the stack file
  validator:                        # the GM's official run (gmctl validate)
    path: /opt/gm/validator/validate.sh
    run_as: postgres                # docker exec -u postgres; gm-validate uses runuser
