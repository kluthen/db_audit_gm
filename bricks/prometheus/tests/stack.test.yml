# Stack test fixture for the Prometheus brick (v0.2 build plan, chunk 4).
# Uses only what a rendered Compose 3.8 stack file can express: no tmpfs
# `mode` or `exec` option. Configs and secrets are external, created and
# removed by run-stack-test.sh (mirroring gmctl deploy).
version: "3.8"

services:
  prometheus:
    image: 127.0.0.1:5000/dbagm/prometheus:0.1.0
    hostname: prometheus
    read_only: true
    cap_drop: [ALL]
    cap_add: [AUDIT_WRITE, CHOWN, DAC_OVERRIDE, FOWNER, KILL, NET_BIND_SERVICE, SETGID, SETUID, SYS_CHROOT]
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "/usr/local/lib/gm/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - {type: volume, source: prom_data, target: /var/lib/prometheus}
      - {type: volume, source: prom_conf, target: /etc/prometheus}
      - {type: volume, source: prom_home, target: /home/player}
      - {type: volume, source: prom_gmstate, target: /var/lib/gm-state}
      - {type: volume, source: prom_run, target: /run}
    configs:
      - {source: seed_prometheus_yml, target: /opt/gm/seed/prometheus.yml, uid: "0", gid: "0", mode: 0444}
    secrets:
      - {source: player_ssh_pubkey, target: /opt/gm/secrets/player_ssh_pubkey, uid: "0", gid: "0", mode: 0444}
    networks: [net]
    deploy:
      replicas: 1
      resources:
        limits: {cpus: "0.5", memory: 384M}

networks:
  net:
    driver: overlay
    attachable: true   # test only: lets the test client container join

volumes:
  prom_data: {}
  prom_conf: {}
  prom_home: {}
  prom_gmstate: {}
  prom_run: {}

configs:
  seed_prometheus_yml: {external: true, name: gmtest-prom_seed_prometheus_yml}

secrets:
  player_ssh_pubkey: {external: true, name: gmtest-prom_player_ssh_pubkey}
