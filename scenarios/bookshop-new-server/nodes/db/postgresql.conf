# postgresql.conf -- Pages & Co, new database server.
# Set up at the migration.

# - Connections -
listen_addresses = '*'
port = 5432
max_connections = 100

# - Memory -
shared_buffers = 128MB
work_mem = 256MB                    # month-end reports were too slow
maintenance_work_mem = 64MB
effective_cache_size = 512MB

# - Storage (SSD) -
random_page_cost = 1.1
effective_io_concurrency = 100

# - Write-ahead log -
max_wal_size = 1GB
min_wal_size = 80MB

# - Maintenance -
autovacuum = on

# - Logging -
log_line_prefix = '%m [%p] %q%u@%d '
log_min_duration_statement = 2s

# - Locale and system (initdb's choices) -
dynamic_shared_memory_type = posix
log_timezone = 'UTC'
timezone = 'UTC'
lc_messages = 'C.UTF-8'
lc_monetary = 'C.UTF-8'
lc_numeric = 'C.UTF-8'
lc_time = 'C.UTF-8'
default_text_search_config = 'pg_catalog.english'
