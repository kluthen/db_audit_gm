# exporter.conf -- Fernway, PostgreSQL exporter for Prometheus.
# Set up with the monitoring, in April.
# The database server, database postgres; no SSL on the internal network.
DATA_SOURCE_URI=db:5432/postgres?sslmode=disable
# The read-only monitoring role (pg_monitor); its password is kept apart,
# never written here.
DATA_SOURCE_USER=monitoring
# Query statistics, for the dashboard's "costliest statements" panels.
COLLECTORS=--collector.stat_statements
