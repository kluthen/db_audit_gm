# postgresql.conf -- Fernway, database server.

# - Connections -
listen_addresses = '*'
port = 5432
max_connections = 100

# - Memory -
shared_buffers = 128MB
work_mem = 4MB
maintenance_work_mem = 64MB
effective_cache_size = 512MB

# - Storage (SSD) -
random_page_cost = 1.1
effective_io_concurrency = 100

# - Write-ahead log -
max_wal_size = 1GB
min_wal_size = 80MB

# - Maintenance -
autovacuum = on

# - Locale and system -
dynamic_shared_memory_type = posix
log_timezone = 'UTC'
timezone = 'UTC'
lc_messages = 'C.UTF-8'
lc_monetary = 'C.UTF-8'
lc_numeric = 'C.UTF-8'
lc_time = 'C.UTF-8'
default_text_search_config = 'pg_catalog.english'

# - Logging -
# Files in /var/log/postgresql, rotated by size, timestamps in UTC.
logging_collector = on
log_destination = 'stderr'
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_file_mode = 0640
log_rotation_age = 0
log_rotation_size = 10MB
log_truncate_on_rotation = off
log_line_prefix = '%t [%p]: user=%u,db=%d,app=%a,client=%h '
log_min_duration_statement = 100ms
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0

# - Query statistics (the exporter's pg_stat_statements metrics) -
#shared_preload_libraries = 'pg_stat_statements'	# off while chasing the May crash; to put back
