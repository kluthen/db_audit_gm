# Seed exporter.conf of exporter-standby in aldermoor-centre (master spec 7.4,
# 14): standby's instance, through its maintenance database; postgres 0.5.0
# runs without SSL. Its password is the game's monitoring_password.
# The role monitoring comes with the node's option monitoring (pg_monitor).
DATA_SOURCE_URI=standby:5432/postgres?sslmode=disable
DATA_SOURCE_USER=monitoring
COLLECTORS=--collector.stat_statements
