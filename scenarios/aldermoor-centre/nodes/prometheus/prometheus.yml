# Seed prometheus.yml of aldermoor-centre (master spec 7.4, 14): the four
# database exporters, the six schedulers' metrics, pgwatch's, and every node
# of the players' node health; the partners' three nodes are out of reach and
# never scraped. A day of retention within 256MB.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

storage:
  tsdb:
    retention:
      time: 1d
      size: 256MB

scrape_configs:
  - job_name: prometheus
    metrics_path: /prometheus/metrics
    static_configs:
      - targets: ['localhost:9090']
  - job_name: postgres
    static_configs:
      - targets: ['exporter-records:9187', 'exporter-standby:9187', 'exporter-lab:9187', 'exporter-machines:9187']
  - job_name: scheduler
    static_configs:
      - targets: ['pms:9120', 'lis:9120', 'ward:9120', 'equipment:9120', 'interfaces:9120', 'backoffice:9120']
  - job_name: pgwatch
    static_configs:
      - targets: ['pgwatch:9188']
  - job_name: node-health
    static_configs:
      - targets: ['bastion:9110', 'records:9110', 'standby:9110', 'lab:9110', 'machines:9110', 'pms:9110', 'lis:9110', 'ward:9110', 'equipment:9110', 'interfaces:9110', 'backoffice:9110', 'clinic-api:9110', 'lab-api:9110', 'portal-api:9110', 'prometheus:9110', 'grafana:9110', 'exporter-records:9110', 'exporter-standby:9110', 'exporter-lab:9110', 'exporter-machines:9110', 'pgwatch:9110', 'health:9110']
