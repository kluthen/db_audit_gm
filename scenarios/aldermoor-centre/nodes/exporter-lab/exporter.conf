# Seed exporter.conf of exporter-lab in aldermoor-centre (master spec 7.4,
# 14): lab's instance, through its maintenance database; postgres 0.5.0
# runs without SSL. Its password is the game's monitoring_password.
# lab does not choose the option monitoring in this scenario (fault s10):
# the role is missing there, so this exporter cannot log in.
DATA_SOURCE_URI=lab:5432/postgres?sslmode=disable
DATA_SOURCE_USER=monitoring
COLLECTORS=--collector.stat_statements
