controller: Aldermoor Veterinary Hospital North
contact: the franchise's data-protection officer, at the head office
policy: player/data-policy.md
entries:
  - id: vet-core-owners
    department: The medical record
    name: Owners, their animals and who owns them
    purpose: Registering the owners, keepers and holdings who bring animals, the animals with their natural
      identifiers and food-chain status, and each dated ownership, so the record follows the animal and
      the portal reaches its current owner
    people: [owners, keepers, holdings' keepers]
    data:
      personal: [clinic.owners.id, clinic.owners.name, clinic.owners.email, clinic.owners.phone, clinic.owners.address,
        clinic.owners.country, clinic.herds.id, clinic.herds.holding_number, clinic.animals.id, clinic.animals.microchip,
        clinic.animals.ueln, clinic.animals.passport_number, clinic.animals.ear_tag]
      customer-linked: [clinic.herds.keeper_owner_id, clinic.ownerships.animal_id, clinic.ownerships.owner_id]
    where:
      - at: records/clinic
        tables: [owners, animals, ownerships, herds]
      - copy: the standby `standby`, a streaming replica
      - copy: cold storage (WAL archive, nightly base backup)
    shared_with:
      - recipient: Aldermoor abroad
        fields: [id, microchip, ueln, passport_number, ear_tag, name, email, phone, owner_id]
      - recipient: Aldermoor Central
        fields: [id, microchip, ueln, passport_number, ear_tag, name, email, phone, owner_id]
      - recipient: Aldermoor South
        fields: [id, microchip, ueln, passport_number, ear_tag, name, email, phone, owner_id]
      - recipient: The veterinary authority
        fields: [id, name, address, country, holding_number, keeper_owner_id, owner_id, animal_id]
      - recipient: the back office, records/office
        fields: [name, address]
      - recipient: the owners' portal, records/portal
        fields: [id, name, email, phone, animal_id, owner_id, keeper_owner_id, herd_id]
      - recipient: Cold Storage
        fields: ['the whole instance, archived']
        processor: true
    kept_for:
      period: 5 years after the owner's last record entry (rule 9, a game value)
      then: anonymised
  - id: vet-core-staff
    department: The medical record
    name: The centre's staff
    purpose: Knowing who examined, prescribed, gave, cared and signed, by the staff layout, and reaching
      staff through the franchise's messaging service
    people: [staff]
    data:
      personal: [clinic.staff.id, clinic.staff.name, clinic.staff.email]
      customer-linked: []
    where:
      - at: records/clinic
        tables: [staff]
      - copy: the standby `standby`, a streaming replica
      - copy: cold storage (WAL archive, nightly base backup)
    shared_with:
      - recipient: The veterinary authority
        fields: [id, name]
      - recipient: the back office, records/office
        fields: [name]
      - recipient: the owners' portal, records/portal
        fields: [name]
      - recipient: Cold Storage
        fields: ['the whole instance, archived']
        processor: true
    kept_for:
      period: 5 years after the staff member leaves, as long as the records they signed are kept (a game
        value)
      then: erased
  - id: vet-core-referrals
