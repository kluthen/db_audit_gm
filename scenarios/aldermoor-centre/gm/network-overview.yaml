    what: from pacs, the finals signed and the entries cancelled since their watermarks (less ten minutes);
      in one clinic transaction each final's copy in ops.imaging_results and its request resulted, each
      cancelled entry's request cancelled, each sent request past its turnaround with no final one ops.incidents
      row (overdue), the watermarks and the run's row.
    source: purpose
  - task: ship-partitions
    when: 40 0-5 * * *
    zone: UTC
    what: 'for vitals (vitals) and machine-readings (biomed), each day partition older than the window
      read from the settings: for the readings the day''s mach_readings_daily first, committed; the rows
      as NDJSON posted to cold storage''s POST /shipments (shipment id the type and the day, the same
      on a resend; source the node); on a receipt counting every row, mach_drop_shipped(day); per database
      one transaction with the run''s ops.runs row, the ops.shipments rows and, from the local hour last_hour,
      one unshipped incident per day still on site.'
    source: purpose
  - task: sync-portal-identity
    when: '*/5 * * * *'
    zone: UTC
    what: 'from clinic, since the watermark (less two minutes): the owners registered, an account invited
      each with its invitation queued (random one-time link, kept hashed), an owner with an account never
      touched; the animals registered or dead, the ownerships started or ended, the herds whose keeper
      changed, upserted into the copies; in one portal transaction with the watermark and the run''s ops.runs
      row.'
    source: purpose
  - task: publish-records
    when: '*/5 * * * *'
    zone: UTC
    what: 'from clinic, the consultations signed and the stays ended since the watermark: a document each,
      version 1 (C- or S- and the record''s id), its body the diagnoses'' labels and the prescriptions,
      or the stay''s dates and outcome, no free text; a document already published skipped by its reference
      and version; in one portal transaction with the watermark and the run''s row.'
    source: purpose
  - task: publish-results
    when: '*/5 * * * *'
    zone: UTC
    what: 'from lab, account 1''s order tests released and their results amended since the watermark:
      a document (T- and the test''s id) at the release (the values in force), a new version at each amendment,
      the former superseded; the pathologist''s name from clinic''s staff; in one portal transaction with
      the watermark and the run''s row.'
    source: purpose
  - task: queue-notices
    when: '*/5 * * * *'
    zone: UTC
    what: 'the documents published since the watermark (less two minutes): one document-notice queued
      for each account that sees it (the current owner, a keeper granted access now, a herd''s keeper),
      active, its channel not none, once per document and account; in one portal transaction with the
      watermark and the run''s ops.runs row.'
    source: purpose
  - task: queue-reminders
    when: 0 9 * * *
    zone: UTC
    what: 'at 09:00 local, the domestic animals and horses alive in the copy whose yearly due day is 14
      days ahead, whose current owner''s account is not closed and whose latest reminders event is a grant:
      one reminder per animal and due day, with its withdrawal link; with the run''s row.'
    source: purpose
  - task: send-messages
    when: '* * * * *'
    zone: UTC
    what: the outbox's unsent rows, oldest first (reminders only from 08:00 to 20:00 local, their consent,
      owner, animal and account checked again), each posted to the messaging service with its message
      key, five seconds' timeout; 202 provider_id and sent_at; otherwise the attempt counted and retried
      with the same key, at the sixth failed_at and one ops.incidents row; then one portal transaction
      with the run's row.
    source: purpose
  backups:
  - kind: none
    line: none
- node: backoffice
  group: integration
  role: back-office engine
  access: write (`/srv/scheduler/repository`, `/srv/scheduler/jobs`)
  activity: '[Node health](/grafana/d/node-health?var-node=backoffice)'
  description: The back office's reports, the medicines and controlled-drugs registers, the antimicrobial
    use, the working time, the head office's figures and the practices' statements.
  site: the off-site room, at Lowmoor
  system: Debian GNU/Linux 13
  applications: the scheduler (gm-scheduler) 0.4.0
  sizing: CPU 0.25 (0.1 reserved), memory 256M (192M reserved), disk 128M
  databases: []
  fed_and_used_by: []
  uses:
  - node: standby
    database: clinic
    role: vet_reports
    what: the back office; reads the whole medical record, owners' contact details included; writes nothing
  - node: lab
    database: lab
    role: lab_reports
    what: the periodic reports and statements; reads every laboratory table; writes nothing
  - node: records
    database: office
    role: office_jobs
    what: 'the back office''s jobs: write the registers, the reports and the figures'
  - node: standby
    database: clinic
    role: sched_reports
    what: the periodic reports, on the standby; reads every scheduling table; writes nothing
  - partner: The veterinary authority
    what: the yearly antimicrobial-use report
  - partner: The franchise's head office
    what: the monthly activity figures
  users: []
  third_parties:
  - partner: The veterinary authority
    anchor: the-veterinary-authority
    what: the yearly antimicrobial-use report
  - partner: The franchise's head office
    anchor: the-franchises-head-office
    what: the monthly activity figures
  tasks:
  - task: copy-notifications
    when: 15 2 * * *
    zone: UTC
    what: 'yesterday''s notifications (the customer''s local date), both databases, not yet copied: one
      regulatory_submissions row each in office (kind notifiable-disease), and one runs row.'
    source: purpose
  - task: feed-medicines-register
    when: 30 1 * * *
    zone: UTC
    what: 'yesterday''s supplies (the customer''s local date): each dispensing and each dose given, with
      the product, its form and authorisation number, the batch, the quantity, the recipient (the owner''s
      name and address for a dispensing, the centre for a dose given) and the prescribing vet, read on
      the standby (meds.register.read), one medicines_register line each, once a day; one runs row.'
    source: purpose
  - task: feed-controlled-drugs
    when: 45 1 * * *
    zone: UTC
    what: yesterday's movements of controlled medicines (dispensings and doses given, out of their batches;
      meds.controlled.read), one controlled_movements row each, once a day; one runs row.
    source: purpose
  - task: close-medicines-register
    when: 0 3 * * *
    zone: UTC
    what: 'run daily, acting on the 1st only (the customer''s local date; any other day writes nothing):
      the past month''s extract from the register, per product its lines, quantity and checksum (meds.close.compute),
      once a month; one runs row.'
    source: purpose
  - task: balance-controlled-drugs
    when: 15 3 * * *
    zone: UTC
    what: 'run daily, acting on the 1st only: each controlled batch''s past month, the opening (the previous
      closing, else the quantity received), the month''s movements and the closing (meds.balance.compute),
      signed by the centre''s senior vet, once a month; one runs row.'
    source: purpose
  - task: inventory-controlled-drugs
    when: 30 3 * * *
    zone: UTC
    what: 'run daily, acting on 1 January only: each controlled batch''s stock at the year''s start, December''s
      closing (meds.inventory.compute), once a year; one runs row.'
    source: purpose
  - task: feed-antimicrobial-use
    when: 0 2 * * *
    zone: UTC
    what: 'yesterday''s use of antimicrobials (the customer''s local date), doses given and dispensings,
      per species and ATCvet code, a herd treatment under its herd''s species: doses, dispensings, quantity,
      animals and herds treated (amu.feed.read on the standby), once a day; one runs row.'
    source: purpose
  - task: report-antimicrobial-use
    when: 0 4 * * *
    zone: UTC
    what: 'run daily, acting on 15 January only (the customer''s local date; any other day writes nothing):
      last year''s report for each species due that day, summed from the daily rows (amu.report.compute),
      posted to the authority''s POST /amu-reports (up to three attempts); acknowledged, its reference
      and a regulatory_submissions copy (kind amu-report); else escalated; one runs row.'
    source: purpose
  - task: feed-working-time
    when: 30 9 * * *
    zone: UTC
    what: 'the shifts that started yesterday (the customer''s local date), every night shift clocked out
      by 09:30: per staff member the shifts, planned hours (on call excluded), hours worked as clocked
      (on call its call-out only), night hours, call-outs (worktime.feed.read, as sched_reports, the names
      as vet_reports); each shift on site whose rest since the previous one on site is under 11 hours
      a breach (worktime.feed.rests); once a day; one runs row.'
    source: purpose
  - task: close-working-time
    when: 0 5 * * *
    zone: UTC
    what: 'run daily, acting on the 1st only (the customer''s local date; any other day writes nothing):
      each staff member''s past month from the daily rows, hours, night hours, call-outs, breaches, and
      the weekly average over the last four months (worktime.close.compute); one runs row.'
    source: purpose
  - task: feed-daily-figures
    when: 30 0 * * *
    zone: UTC
    what: 'yesterday''s figures (the customer''s local date), one row per section and measure: per section
      of the centre the consultations begun per kind, the stays admitted and ended, the stays, the units
      occupied and the units in service at the day''s closing midnight (figures.feed.read on the standby);
      the new owners and animals; the lab''s tests released per discipline and priority, the outside orders
      placed and their tests'' median turnaround (figures.feed.lab on the lab), once a day; one runs row.'
    source: purpose
  - task: send-monthly-figures
    when: 0 5 * * *
    zone: UTC
    what: 'run daily, acting on the 1st to the 5th only (the customer''s local date; any other day writes
      nothing): the past month''s figures per section and measure, summed from the daily rows (the turnaround
      the median of its days'', figures.send.compute) on its first run and kept, posted to the head office''s
      POST /figures (up to three attempts a run); acknowledged, its reference kept; still unacknowledged
      after the 5th''s attempts, escalated; a month acknowledged or escalated not sent again; one runs
      row.'
    source: purpose
  - task: feed-lab-charges
    when: 30 2 * * *
    zone: UTC
    what: 'yesterday''s charge events of the practices'' accounts (the customer''s local date): each charge
      made billable that day (its release''s date) and each voided that day, with its order, test, kind,
      amount, the order''s patient reference and client surname (charges.feed.read on the lab), once a
      day; never the centre''s account; one runs row.'
    source: purpose
  - task: close-lab-statements
    when: 0 4 * * *
    zone: UTC
    what: 'run daily, acting on the 1st only (the customer''s local date; any other day writes nothing):
      each practice account''s statement for the past month from the feeder''s lines (charges.close.compute):
      the billable lines summed, less the month''s voids of charges stated, the bracket by the total (3
      % from 0, 5 % from 200, 10 % from 400, 15 % from 600, game values), the discount on the total rounded
      once, the amount due; one runs row.'
    source: purpose
  backups:
  - kind: none
    line: none
