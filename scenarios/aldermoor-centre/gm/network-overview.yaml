header:
  customer: Aldermoor Veterinary Hospital North
  network: One private network; the partners' services are reached on it by name; from outside, only the
    bastion's SSH port and web port are reachable.
  bastion: 'You work from `bastion`, your access point: [Node health](/grafana/d/node-health?var-node=bastion).'
  node_health: 'Node health for the whole estate: [Node health](/grafana/d/node-health).'
  trust: This is the centre's own documentation, kept by its IT. The **Your access** column is the game's
    rule and always exact.
entries:
- node: records
  group: database
  role: database server
  access: write (`/etc/postgresql`)
  activity: '[Node health](/grafana/d/node-health?var-node=records)'
  description: The record's database server, the medical record, the agenda and the wards, the back office's
    registers and reports, the owners' portal.
  system: Debian GNU/Linux 13
  applications: 'PostgreSQL 18; preloaded: pg_stat_statements, pg_cron; options: monitoring; report tools:
    pgbadger; cron'
  sizing: CPU 1 (0.5 reserved), memory 1G (512M reserved), disk 2.25G
  databases:
  - database: jobs
    holds: 'pg_cron''s jobs (its cron.database_name): the portal''s sessions'' purge'
    register: []
  - database: office
    holds: 'the back office: the medicines and controlled-drugs registers, the antimicrobial use and its
      yearly report, working time, the activity figures, the lab''s statements'
    register:
    - vet-core-record
    - vet-core-medicines
    - vet-scheduling-rota
    - vet-lab-billing
    - vet-notifiable-diseases
    - vet-medicines-registers
    - vet-antimicrobial-use
    - vet-head-office-figures
    - vet-lab-statements
    - vet-working-time
  - database: clinic
    holds: the medical record, the wards and the agenda
    register:
    - vet-core-owners
    - vet-core-staff
    - vet-core-referrals
    - vet-core-record
    - vet-core-medicines
    - vet-core-exchanges
    - vet-housing-care
    - vet-scheduling-agenda
    - vet-scheduling-rota
    - vet-scheduling-training
    - vet-core-operations
    - vet-housing-wards
    - vet-lab-centre-orders
    - vet-centre-exchanges
    - vet-notifiable-diseases
    - vet-bookings-sync
    - vet-imaging-orders
  - database: portal
    holds: 'the owners'' portal: accounts, consents, the record''s released copies, the messages to send'
    register:
    - vet-portal-accounts
    - vet-portal-copies
    - vet-portal-documents
    - vet-portal-consents
    - vet-portal-outbox
    - vet-portal-settings
    - vet-portal-release
    - vet-portal-messages
  fed_and_used_by:
  - node: pms
    database: clinic
    role: vet_app
    what: the practice-management software; reads the whole medical record and its reference tables; writes
      owners, animals and herds, referrals, consultations, diagnoses and procedures, requests, stays,
      alerts, exchanges with other centres, prescriptions, administrations and dispensings
  - node: pms
    database: clinic
    role: housing_app
    what: the practice software's housing screens; reads the units, the displays, the placements, the
      feeding plans and the care log, and of the record what placing an animal needs; writes animals placed,
      moved and released, diets and feeding orders, a unit marked to clean
  - node: pms
    database: clinic
    role: sched_app
    what: the practice software's scheduling module; reads the rooms, the opening hours, the machines,
      the appointment types, the courses, the bookings and the rota, and the free slots; writes bookings,
      room and machine allocations, the rota, absences, teaching sessions' state, trainees and enrolments
  - node: ward
    database: clinic
    role: vet_display
    what: the ward displays; reads the animals' board and the housing units' board; writes nothing
  - node: ward
    database: clinic
    role: housing_ward
    what: the ward service, the carers' actions on the displays; reads the units, the placements, the
      feeding plans, the care log and the units' board; writes care events, a unit marked clean
  - node: interfaces
    database: clinic
    role: vet_interfaces
    what: 'the integration jobs on the record: lab orders, the other centres'' exchanges, notifiable diseases,
      bookings, imaging orders'
  - node: interfaces
    database: clinic
    role: sched_interfaces
    what: 'the integration jobs on the agenda: check-ins, bookings, deaths'
  - node: interfaces
    database: clinic
    role: vet_portal_sync
    what: 'the portal''s release: reads what the record may publish'
  - node: interfaces
    database: portal
    role: portal_sync
    what: 'the portal''s release: writes the record''s released copies'
  - node: interfaces
    database: portal
    role: portal_dispatch
    what: 'the portal''s messages: hands the notices and reminders to the messaging service'
  - node: backoffice
    database: office
    role: office_jobs
    what: 'the back office''s jobs: write the registers, the reports and the figures'
  - node: clinic-api
    database: clinic
    role: vet_lookup
    what: the lookup API the other centres, the lab and the machines call; reads the animals without their
      death, their owners' names without contact details, the stays' dates; writes nothing
  - node: clinic-api
    database: clinic
    role: vet_exchange
    what: the other centres' exchanges, answered through the clinic's API
  - node: portal-api
    database: portal
    role: portal_api
    what: the owners' portal API; reads the owners' animals, ownerships, herds and documents, as each
      account may see them, its own account and the portal's settings; writes logins and sessions, documents
      viewed, consent changes, an account's notification choices
  - node: exporter-records
    database: postgres
    role: monitoring
    what: statistics, as monitoring (pg_monitor)
  - node: pgwatch
    database: postgres
    role: monitoring
    what: statistics, as monitoring (pg_monitor)
  - node: health
    database: postgres
    what: statistics, as monitoring (pg_monitor)
  - node: standby
    database: all
    role: replication
    what: 'streaming replication: a replica of every database'
  - node: records
    database: portal
    role: portal_housekeeping
    what: pg_cron's job portal.sessions.purge, on this server
  uses: []
  users: []
  third_parties:
  - partner: Cold Storage
    anchor: cold-storage
    what: the WAL archive and the nightly base backup
  tasks:
  - task: the nightly base backup of records' databases to Cold Storage
    when: 30 3 * * *
    zone: UTC
    what: the nightly base backup of records' databases to Cold Storage
    source: crontab
  - task: portal.sessions.purge
    when: 30 3 * * *
    zone: '{{customer_timezone}}'
    what: the night's purge of sessions ended or expired more than 30 days ago
    source: pg_cron
  backups:
  - kind: standby
    line: streamed to `standby`, a replica in the off-site room at Lowmoor
  - kind: wal-archive
    line: WAL archived to Cold Storage, segment by segment
  - kind: base-backup
    line: a base backup each night at 03:30 UTC to Cold Storage
  - kind: check
    line: the health page checks at 06:30 UTC that last night's base backup is in Cold Storage
- node: standby
  group: database
  role: database server
  access: write (`/etc/postgresql`)
  activity: '[Node health](/grafana/d/node-health?var-node=standby)'
  description: The record's standby, a streaming replica of records where the back office's reports run
    their heavy reads.
  site: the off-site room, at Lowmoor
  system: Debian GNU/Linux 13
  applications: 'PostgreSQL 18; preloaded: pg_stat_statements; options: monitoring; report tools: pgbadger'
  sizing: CPU 1 (0.5 reserved), memory 1G (512M reserved), disk 2.25G
  databases: []
  fed_and_used_by:
  - node: backoffice
    database: clinic
    role: vet_reports
    what: the back office; reads the whole medical record, owners' contact details included; writes nothing
  - node: backoffice
    database: clinic
    role: sched_reports
    what: the periodic reports, on the standby; reads every scheduling table; writes nothing
  - node: exporter-standby
    database: postgres
    role: monitoring
    what: statistics, as monitoring (pg_monitor)
  - node: pgwatch
    database: postgres
    role: monitoring
    what: statistics, as monitoring (pg_monitor)
  - node: health
    database: postgres
    what: statistics, as monitoring (pg_monitor)
  uses: []
  users: []
  third_parties: []
  tasks: []
  backups:
  - kind: standby
    line: itself the streaming replica of `records`; no backup of its own
- node: lab
  group: database
  role: database server
  access: write (`/etc/postgresql`)
  activity: '[Node health](/grafana/d/node-health?var-node=lab)'
  description: The laboratory's database server, its orders, samples and results, the practices' accounts
    and their billing.
  system: Debian GNU/Linux 13
  applications: 'PostgreSQL 18; preloaded: pg_stat_statements, pg_cron; report tools: pgbadger; cron'
  sizing: CPU 1 (0.5 reserved), memory 1G (512M reserved), disk 2.25G
  databases:
  - database: lab
    holds: 'the laboratory: orders, samples, results, the practices'' accounts and billing'
    register:
    - vet-lab-orders
    - vet-lab-results
    - vet-lab-notifications
    - vet-lab-billing
    - vet-lab-round-trips
    - vet-lab-catalogue
    - vet-lab-practice-results
    - vet-lab-send-outs
    - vet-notifiable-diseases
    - vet-lab-critical-calls
  fed_and_used_by:
  - node: lis
    database: lab
    role: lab_app
    what: the laboratory information system; reads every laboratory table; writes orders, samples and
      their events, tests, results, critical calls, notifications, quality control runs, charges
  - node: lis
    database: lab
    role: lab_instruments
    what: the analysers' middleware; reads the samples, the tests ordered, the analytes, the reference
      intervals, the quality control runs; writes analyser batches and results
  - node: interfaces
