# The answer key of aldermoor-centre (sealed; v0.3 master spec 6.2, v0.4 6.3,
# v0.5 6.3; capture W5 item 6). Nine fault instances, the test selection of
# master spec 17.2 but s4 (spec D466), and the false alarm fa (issue I2). Each
# instance's entry comes from its fault's planted overlay or fixture (W5-a to
# W5-d), adapted to the clinic: its nodes, its timeline (T0 23:00, hand-over
# 09:00), its interactions (W5 item 6). s6's register_diff is the
# data-register skill's, never edited by hand.
scenario:
  id: aldermoor-centre
  version: 0.1.0
notes: gm/notes.md

instances:
  # --- s1
  - instance: s1
    what: >-
      interfaces' post-lab-orders maps the order's priority through
      {"stat": "urgent"}.get(priority, "routine"), so every centre order
      reaches the lab routine, the C-{consultation}-urgent ones included.
    why: >-
      the lab releases a routine test at the pathologist's next round, an
      urgent one at once: the emergency team's blood gases and glucose come
      back hours late (LO4), a round-trip cascade (D286).
    evidence:
      - where: node:interfaces
        source: the transformer's script
        how: cat /srv/scheduler/repository/scripts/lab_orders.py
        shows: the body's "priority" mapped from "stat" only, "routine" for anything else
      - where: bastion
        source: the lab's orders against the record's requests
        how: >-
          psql -h lab -d lab -c "SELECT id, client_ref, priority FROM
          lab_orders WHERE account_id = 1 AND client_ref LIKE '%-urgent'
          ORDER BY id DESC LIMIT 10", then the requests of those orders in
          psql -h records -d clinic
        shows: C-{consultation}-urgent orders routine at the lab, their requests urgent in the record
    acceptable:
      diagnosis: >-
        names the mapping in post(): the request's urgent priority sent as
        routine, the lab holding the tests for its next round; the urgent
        references routine at the lab as the trace.
      proposal: >-
        send the request's own priority; raise the orders already posted
        routine at the lab, or ask the lab to release them (the backlog).
      fix: >-
        post() sends the request's own priority, reloaded: an urgent order
        posted after the fix reaches the lab urgent and is answered within
        its turnaround.
    sealed_check:
      script: faults/purpose-urgent-priority-dropped/checks/fixed.sh
      at_handover: 1
      judges: runs
      threshold: 0
      notes: >-
        present as soon as an urgent request has been posted since the
        judged moment; fixed once an urgent order posted after the fix is
        urgent at the lab and answered within its turnaround (LO4, completed
        orders only, D456). Present from the first urgent order posted
        after T0 (the emergency service's night consultations); lis releases
        an urgent test at once, so a fixed order is answered within minutes.
    interactions: []
    validators_left_red: []
    backlog:
      what: >-
        the urgent requests posted routine before the fix, waiting at the
        lab for the next round: ops.lab_orders_sent's C-{consultation}-urgent
        references whose accession is a routine order at lab
        (lab_orders.priority), its tests not yet released.
      cleanup: >-
        each identified from the ledger and raised to urgent at the lab, or
        its release asked of the lab; credited, never counted.

  # --- s2
  - instance: s2
    what: >-
      records' archive_command is 'vault-post wal %p %f || true': vault-post's
      name and file swapped, so vault-post refuses every segment's name
      (pg_wal/...), and `|| true` makes the archiver count each one archived
      and recycle it; no segment of records has reached the vault since the
      game's start (lab's archive, to the same vault, still ships).
    why: >-
      the WAL archive is what rolls the nightly base backup forward: without
      it a restore loses up to a day of the clinic's records, and every signal
      PostgreSQL gives says the archive works.
    evidence:
      - where: bastion
        source: pg_stat_archiver on records
        how: psql -h records -d postgres -c 'SELECT archived_count, last_archived_wal, last_archived_time, failed_count FROM pg_stat_archiver'
        shows: segments archived, failed_count 0
      - where: bastion
        source: cold storage's manifests (GET /manifests)
        how: curl -s "http://cold-storage:8000/manifests?type=wal&source=records&from=$(date -u +%F)"
        shows: no manifest names the segments pg_stat_archiver reports archived
      - where: bastion
        source: cold storage's page (GET /)
        how: curl -s http://cold-storage:8000/ (the wal chart's columns and table)
        shows: no wal shipment on the days since the fault, beside the planted weeks before it (about 30 a day)
      - where: node:records
        source: /etc/postgresql/postgresql.conf and the server log
        how: grep -n archive_command /etc/postgresql/postgresql.conf; grep -h 'vault-post:' /var/log/postgresql/postgresql-*.log | tail
        shows: "'vault-post wal %p %f || true', and vault-post refusing the name pg_wal/... once per segment"
    acceptable:
      diagnosis: >-
        the archive fails silently: the arguments swapped, vault-post refusing
        the name, `|| true` hiding it; the vault holds no segment since the
        fault, so no recovery past the last base backup.
      proposal: >-
        archive_command = 'vault-post wal %f %p', reloaded, a switched
        segment's manifest checked; a fresh base backup (the gap cannot be
        filled); the archiver read against the vault from now on.
      fix: >-
        the archive_command in effect ships: a segment switched after the fix
        has its wal manifest from records in the vault. The gap stays a
        finding.
    sealed_check:
      script: faults/pg-archive-command-silent/checks/fixed.sh
      at_handover: 1
      notes: >-
        the GM switches a segment (SELECT pg_switch_wal()) after the players'
        fix before reading it. A setup limit, not a fault (spec D382): the
        vault's planted wal manifests name segments of logs 0x40 and above,
        which sort above records' live names; nothing reads them in name
        order (the check finds records' latest manifest by received_at).
    interactions:
      - instance: s7
        kind: conflicts-with
        note: >-
          one file: s2 and s7 are both lines of records' postgresql.conf; a
          fix to one reloads the other's line as it stands, and a restored
          file would plant both again.
      - instance: s6
        kind: conflicts-with
        note: >-
          planted together on the vault (master spec 17.2): the archive fails
          silently while the vault still holds the planted wal and basebackup
          manifests and the nightly base backups (the crontab's, unaffected),
          so s6's witness stands.
    validators_left_red: []

  # --- s3
  - instance: s3
    what: >-
      backoffice's amu.feed.read joins each dispensing's prescription to
      animals with an inner join, so a herd treatment (a herd's prescription,
      no animal) drops out of feed-antimicrobial-use's day; the planted past
      in office, last year's report included, written the same way.
    why: >-
      the cattle, the one species due, are under-reported every day and in
      the yearly report sent to the authority (AM2, AM1); the report sent
      stays wrong until corrected.
    evidence:
      - where: node:backoffice
        source: the feeder's query
        how: grep -n -A20 'amu.feed.read:' /srv/scheduler/repository/queries.yaml
        shows: JOIN animals an ON an.id = p.animal_id before the herd's species' LEFT JOIN
      - where: bastion
        source: the daily use against the record's herd treatments
        how: >-
          psql -h records -d office -c "SELECT day, species, sum(dispensings),
          sum(herds_treated) FROM antimicrobial_use WHERE day > current_date - 14
          GROUP BY 1, 2 ORDER BY 1, 2"; psql -h standby -d clinic on the
          dispensings of prescriptions with a herd and no animal
        shows: herds_treated 0 every day, the herd visits' dispensings missing
      - where: bastion
        source: last year's report
        how: psql -h records -d office -c "SELECT year, species, reference, payload->'lines' FROM amu_reports ORDER BY year DESC LIMIT 1"
        shows: the cattle's lines with no herd treated, acknowledged with its AMU reference
    acceptable:
      diagnosis: >-
        names the inner join on animals in amu.feed.read: herd treatments
        dropped every day, and last year's report sent short of the cattle's
        herd use.
      proposal: >-
        a LEFT JOIN on animals; the short days rerun; last year's report
        corrected with the authority, its rerun recommended (spec D277).
      fix: >-
        the loaded query counts herd treatments: since the reload, the
        feeder's days hold every herd treatment under its herd's species;
        the planted report still wrong, its rerun recommended.
    sealed_check:
      script: faults/purpose-herd-use-dropped/checks/fixed.sh
      at_handover: 1
      judges: runs
      threshold: 0
      notes: >-
        present from the feeder's first run (02:00) after a day with a herd
        treatment: T0 23:00 puts that run inside the aging; fixed once a run
        after the reload has written such a day whole. The players verify a
        fix by moving feed-antimicrobial-use a few minutes ahead (a day is
        written once: the days already written stay short, their rerun
        asked). The planted report is never judged.
    interactions:
      - instance: s8
        kind: conflicts-with
        note: >-
          both bite feeders reading the standby: s8 delays every feeder's
          view by an hour, s3 drops the herd treatments whatever the view;
          s8 never hides a herd treatment from s3's check (the day is whole
          an hour later), so s3's witness stands with s8 present or fixed.
    validators_left_red: []

  # --- s5
  - instance: s5
    what: >-
      portal_animals_scope's owner branch reads any ownership of the asker's,
      ended or not (its o.until_at IS NULL left out), so a former owner
      logged into the portal still lists the animals they sold or gave away.
    why: >-
      the portal copies every ownership, so every past sale is exposed, not
      only the day's: a seller reads the new owner's animal and its records
      since their own ownership began.
    evidence:
      - where: node:records
        source: the portal's policies on portal_animals
        how: >-
          psql -d portal -c "SELECT polname, pg_get_expr(polqual, polrelid)
          FROM pg_policy WHERE polrelid = 'portal_animals'::regclass"
        shows: the owner branch without until_at IS NULL, the keeper branch with it
      - where: bastion
        source: the sales in the portal's copy
        how: >-
          psql -h records -d portal -c "SELECT animal_id, owner_id, until_at
          FROM portal_ownerships WHERE role = 'owner' AND until_at IS NOT NULL
          ORDER BY until_at DESC LIMIT 5"
        shows: the former owners' ended rows, each passing the owner branch
      - where: node:portal-api
        source: the former owner's listing
        how: as the former owner, POST /login then GET /animals with the session cookie
        shows: the animal they sold, listed
    acceptable:
      diagnosis: >-
        names the owner branch of portal_animals_scope as admitting ended
        ownerships: former owners still see the animals they no longer own.
      proposal: >-
        restore o.until_at IS NULL in the owner branch, the keeper branch
        unchanged; check that the buyer still sees the animal and the seller
        no longer does; review what former owners read since the change.
      fix: >-
        the former owner's GET /animals no longer lists the animal and the
        buyer's still does.
    sealed_check:
      script: faults/security-policy-ownership-end-dropped/checks/fixed.sh
      at_handover: 1
      notes: >-
        reads the live policies as gm_check through gm_check_read, with the
        most recent sale's former owner and buyer as witnesses. Planted three
        hours before the hand-over (plant_at handover-3h, gmctl inject --at):
        former owners have had hours, not days, to look.
    interactions: []
    validators_left_red: []

  # --- s6
  - instance: s6
    what: 'the data register handed out (~/data-register.md) names cold storage, the vault, nowhere: dropped
      from every entry''s recipients and copies, though records and lab archive their WAL and send a
      nightly base backup there, and machines its nightly base backup and its old days, so the whole
      record, the laboratory and the machines reach it.'
    why: 'a record of processing names every recipient, processors included (GDPR Art 30(1)(d)): an owner''s
      access request or an inspector''s question answered from it would omit an off-site copy of all
      the centre''s data.'
    evidence:
      - where: bastion
        source: the data register, ~/data-register.md (and the web front's "Data register")
        how: grep -n -i 'cold storage' ~/data-register.md
        shows: nothing; no entry's Shared with or Where names the vault
      - where: bastion
        source: records' archive settings and cold storage's manifests
        how: psql -h records -c 'SHOW archive_command'; curl -s "http://cold-storage:8000/manifests?type=basebackup&source=records"
        shows: records posts to the vault (vault-post), which lists records' nightly base backups and
          WAL segments
      - where: bastion
        source: cold storage's page (GET /)
        how: curl -s http://cold-storage:8000/ (the wal chart's columns and table)
        shows: records' and lab's wal, and the three servers' basebackup shipments, day by day over five
          weeks
    acceptable:
      diagnosis: cold storage, a processor, receives the whole of records and lab (the WAL archive and
        the nightly base backups) and of machines (its base backups, its old days), and the register
        names it on no entry; found by reading the register against the archive settings, the crontabs,
        partners.md, the vault's manifests and page.
      proposal: 'the corrected entries: each entry held on records, lab or machines names Cold Storage
        among its recipients (the whole instance, archived; a processor) and the vault among its copies,
        as register_diff states.'
    sealed_check:
      script: faults/governance-register-flow-undeclared/checks/fixed.sh
      at_handover: 1
      notes: reads only that the change is present in the served handout; never cleared in play (propose,
        judged at the final answer against register_diff). Cleared only by regenerating the handout
        without the instance.
    interactions:
      - instance: s2
        kind: conflicts-with
        note: 'planted together on the vault (master spec 17.2): with s2 the archive fails silently, but
          the vault still holds the planted wal and basebackup manifests and the nightly base backups
          (the crontab''s), so this fault''s witness stands.'
    validators_left_red: []
