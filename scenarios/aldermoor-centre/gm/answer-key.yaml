  # --- s7
  - instance: s7
    what: records' postgresql.conf sets log_statement = 'all'.
    why: >-
      every write of the practice software, its values included, goes into
      the server log: owners' names, phone numbers and addresses outside the
      record, against "none in the logs" (vet-core's core rule 10).
    evidence:
      - where: node:records
        source: the server log
        how: "grep -h -E 'statement: (INSERT|UPDATE).*owners' /var/log/postgresql/postgresql-*.log | tail -n 5"
        shows: vet_app's writes on owners with names and phone numbers in clear
      - where: node:records
        source: /etc/postgresql/postgresql.conf
        how: grep -n log_statement /etc/postgresql/postgresql.conf
        shows: log_statement = 'all'
    acceptable:
      diagnosis: >-
        names log_statement = 'all' as writing personal data into the server
        log, against the business's rule.
      proposal: >-
        log_statement none (or ddl) and a reload; the audit need met without
        values; the files already written purged or kept under the record's
        rules.
      fix: log_statement none or ddl in effect, on no role or database writing the record, after a reload.
    sealed_check:
      script: faults/governance-statement-log-personal/checks/fixed.sh
      at_handover: 1
      notes: >-
        live state: present while log_statement all is in effect on records;
        fixed after the line is removed and the server reloaded (the files
        already written stay a finding).
    interactions:
      - instance: s2
        kind: conflicts-with
        note: >-
          one file: s2 and s7 are both lines of records' postgresql.conf.
      - instance: s9
        kind: conflicts-with
        note: >-
          with log_statement = 'all' every ward.board call is already in the
          log with its unit, so s9's careful step (the parameter logged for
          vet_display alone) is unneeded while s7 stands; s9's "no
          instance-wide logging left behind" is met by s7's fix.
    validators_left_red: []

  # --- s8
  - instance: s8
    what: the standby's postgresql.conf sets recovery_min_apply_delay = '1h'.
    why: >-
      the reports read the standby an hour behind the record: the 00:30
      feeder misses the evening after 23:30, every feeder the entries made
      late for yesterday, and a feeder writes its day once.
    evidence:
      - where: node:standby
        source: the replay position against what was received
        how: psql -d postgres -c "SELECT pg_last_wal_receive_lsn(), pg_last_wal_replay_lsn(), current_setting('recovery_min_apply_delay')"
        shows: WAL received ahead of what is replayed, the delay 1h
      - where: bastion
        source: a late entry on the record and on the standby
        how: >-
          psql -h records -d clinic and psql -h standby -d clinic on the
          dispensings of yesterday's last hour
        shows: entries on records not yet on the standby; the register's day (office) without them
    acceptable:
      diagnosis: >-
        names recovery_min_apply_delay on the reports' standby: every commit
        replayed an hour late, the feeders' days short of the last hour.
      proposal: >-
        the delay removed from the reports' standby (a delayed standby, if
        wanted, one nobody reports from; or point-in-time recovery), and the
        short days rerun.
      fix: recovery_min_apply_delay 0 in effect on the standby, reloaded.
    sealed_check:
      script: faults/pg-standby-apply-delay/checks/fixed.sh
      at_handover: 1
      notes: >-
        live state: present while the standby's recovery_min_apply_delay in
        effect is not 0; fixed after the line is removed and the standby
        reloaded, the backlog then replayed at once. Its consequence, the
        00:30 feeder's (feed-daily-figures) day short of the evening's last
        hour, shows from the first 00:30 run: T0 23:00 puts it inside the
        aging.
    interactions:
      - instance: s3
        kind: conflicts-with
        note: >-
          both bite feeders reading the standby (s3's note); s8 never hides
          a herd treatment, so neither masks the other.
    validators_left_red: []

  # --- s9
  - instance: s9
    what: >-
      unit 7's display (display 65) reads its board about once a second
      through the ward service, ward.board's statement with its unit fixed,
      beside the 64 displays' one read a minute each.
    why: >-
      the board statement's calls double (about 124 a minute where 64 are
      due): one faulty box loads the record for nothing, below what
      saturates the ward's pool, so nothing fails and nobody notices.
    evidence:
      - where: bastion
        source: the record's statement statistics
        how: >-
          psql -h records -d postgres -c "SELECT queryid, calls FROM
          pg_stat_statements WHERE query = 'SELECT * FROM housing_unit_board
          WHERE unit_id = \$1'", twice a minute apart
        shows: one queryid, about 124 calls a minute, from ward as vet_display
      - where: node:records
        source: the server log, the parameter logged for vet_display alone
        how: >-
          as dba, ALTER ROLE vet_display SET log_min_duration_statement = 0,
          the vet_display sessions terminated, then grep 'Parameters: \$1 ='
          /var/log/postgresql/postgresql-*.log; the setting reset after
        shows: "$1 = '7' about once a second, every other unit about once a minute on average"
      - where: bastion
        source: the chain unit, display, placement, stay, animal
        how: >-
          psql -h records -d clinic: housing_displays WHERE unit_id = 7 AND
          removed_on IS NULL, housing_placements WHERE unit_id = 7 AND
          until_at IS NULL, stays, animals
        shows: display 65's serial, the animal in unit 7
    acceptable:
      diagnosis: >-
        names unit 7's display (its serial, display 65's) reading its board
        about once a second, the animal it shows, the excess shown against the
        displays' one read a minute; the parameter logged for vet_display
        alone and the setting reset; the display's replacement asked of the
        technician, the firmware being no layer of the players'.
    sealed_check:
      script: faults/scheduler-display-refresh-loop/checks/fixed.sh
      at_handover: 1
      window: 1m
      threshold: 80
      notes: >-
        reads the board statement's calls twice a minute apart: about 124 a
        minute while the loop runs, about 64 once the display is replaced
        (after the game, ward redeployed without the stream). Report only:
        never cleared in play; the GM never switches the display off during
        play.
    interactions:
      - instance: s7
        kind: conflicts-with
        note: >-
          while s7 stands, log_statement = 'all' already logs the board's
          parameter, so the players need not set it for vet_display; once
          s7 is fixed, the careful step applies and its setting is reset
          after.
    validators_left_red: []

  # --- s10
  - instance: s10
    what: >-
      lab does not choose the option monitoring, so its cluster was
      initialised without the role monitoring, the one the exporter logs in
      as.
    why: >-
      the exporter's every login is refused and its metrics read pg_up 0;
      pgwatch's lab source (pgwatch_instance_up 0) and the health checks'
      lab instance (CRITICAL, the role monitoring refused) fail too: nobody
      watches lab, and its empty dashboards read as "nothing to see". One
      instance covers every monitoring node targeting lab.
    evidence:
      - where: node:lab
        source: the server log
        how: grep -h monitoring /var/log/postgresql/postgresql-*.log | tail -n 5
        shows: password authentication failed for user "monitoring", Role "monitoring" does not exist
      - where: bastion
        source: the roles of the cluster
        how: psql -h lab -d postgres -c '\du'
        shows: no role monitoring
      - where: node:exporter-lab
        source: the exporter's metrics
        how: curl -s localhost:9187/metrics | grep '^pg_up'
        shows: pg_up 0
      - where: node:pgwatch
        source: pgwatch's metrics
        how: curl -s localhost:9188/metrics | grep pgwatch_instance_up
        shows: dbname="lab" at 0, the other sources at 1
      - where: ui:health
        source: the health checks' page
        how: the bastion's web front, /health/ (or status.txt beside it)
        shows: lab's checks CRITICAL, the role monitoring refused
    acceptable:
      diagnosis: >-
        names the missing role monitoring on lab, the node built without the
        option, as why the exporter reads nothing.
      proposal: >-
        the role created as the option creates it (LOGIN, a member of
        pg_monitor, with the exporter's monitoring password, which the
        operator holds and the players do not), the option chosen for lab's
        next build; not the option alone, which creates nothing on the
        existing cluster.
    sealed_check:
      script: faults/pg-monitoring-option-absent/checks/fixed.sh
      at_handover: 1
      notes: >-
        fixed once the GM, applying an accepted proposal, has created the
        role on lab with the game's monitoring_password (read on
        exporter-lab, a node mounting it); the exporter's pg_up 1 then shows the
        password right.
    interactions: []
    validators_left_red: []

tooling_expectations: []            # the monitoring breadth is complete by design (master spec
                                    # 7.4): an exporter per database server, pgwatch, the health
                                    # checks; lab's gap is s10's, a fault instance

false_alarms:
  - issue: I2
    why: >-
      no fault: the small-animal PCR panel (PCRSA) the lab sends to
      Northfield has a 96-hour turnaround, and a send-out is due by its
      packing plus 50 minutes plus that turnaround (lab_send_outs.due_by);
      the panel answered on its fourth day after it was sent came back
      before its due_by, within its turnaround (one to five days across the
      send-outs).
    evidence:
      - where: bastion
        source: lab_send_outs' due_by against answered_at, with the test's turnaround
        how: >-
          psql -h lab -d lab -c "SELECT s.id, x.code, x.turnaround_hours,
          s.sent_at, s.answered_at, s.due_by, s.due_by >= s.answered_at AS
          in_time FROM lab_send_outs s JOIN lab_order_tests t ON t.id =
          s.order_test_id JOIN lab_tests x ON x.id = t.test_id WHERE x.code =
          'PCRSA' AND s.answered_at >= s.sent_at + interval '3 days' AND
          s.answered_at < s.sent_at + interval '4 days' ORDER BY s.answered_at
          DESC LIMIT 10"
        shows: the panel answered on its fourth day, before its due_by (in_time true), its turnaround 96 hours
    acceptable: >-
      the players report no fault behind the complaint: the panel was
      answered within its turnaround (before its due_by), citing
      lab_send_outs' due_by against answered_at; a proposal to show the
      vets the expected date is a bonus, never required. A send-out answered
      after its due_by (about 6 % of the load's) is the external lab's own
      delay, which the send-outs' chase follows, and not this complaint.
