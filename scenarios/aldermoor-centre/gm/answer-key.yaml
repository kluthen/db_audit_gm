          'Aldermoor South (id, microchip, ueln, passport_number, ear_tag, name, email, phone, owner_id)',
          'The veterinary authority (id, name, address, country, holding_number, keeper_owner_id, owner_id,
            animal_id)', 'the back office, records/office (name, address)', 'the owners'' portal, records/portal
            (id, name, email, phone, animal_id, owner_id, keeper_owner_id, herd_id)', 'Cold Storage (the whole
            instance, archived), a processor']
        handed_out: ['Aldermoor abroad (id, microchip, ueln, passport_number, ear_tag, name, email, phone,
            owner_id)', 'Aldermoor Central (id, microchip, ueln, passport_number, ear_tag, name, email, phone,
