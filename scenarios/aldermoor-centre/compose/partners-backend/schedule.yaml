# partners-backend: the scenario layer of aldermoor-centre (game-master,
# "Domains, composed", step 2; capture W5-e): cold storage's and the
# purposes' partners' baseline streams (coldstore, authority, headoffice,
# messaging), copied as written; the domains' partners come through
# gmctl compose. Intensity 1.0.
intensity: 1.0
connections:
  coldstore-db: {driver: sql/postgresql, target: partners-db:5432/partners, role: coldstore, pool: {size: 1}}
  authority-db: {driver: sql/postgresql, target: partners-db:5432/partners, role: authority, pool: {size: 1}}
  headoffice-db: {driver: sql/postgresql, target: partners-db:5432/partners, role: headoffice, pool: {size: 1}}
  messaging-db: {driver: sql/postgresql, target: partners-db:5432/partners, role: messaging, pool: {size: 1}}
streams:
  - key: coldstore.normal
    connection: coldstore-db
    rate: 1/min
    arrivals: even
  - key: authority.normal
    connection: authority-db
    rate: 1/min
    arrivals: even
  - key: headoffice.normal
    connection: headoffice-db
    rate: 1/min
    arrivals: even
  - key: messaging.normal
    connection: messaging-db
    rate: 1/min
    arrivals: even
