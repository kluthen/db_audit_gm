# aldermoor-centre: the clinic scenario of v0.5 (master spec 17.1; build plan
# chunk 27). One centre of Aldermoor Veterinary Hospitals, composed of the six
# clinic domains in the regional-franchise variant, its 25 nodes on two hosts
# (master spec 14: armenelos and the VPS, the standby and the partners off
# site), the monitoring breadth (7.4), its nine partners and the owners'
# traffic on the shared partners' nodes, its sixteen purposes (12.2), its data
# policy and register. The faults: the test selection but s4 (spec D466), nine
# faults and the false alarm.

# --- Scenario information --------------------------------------------
id: aldermoor-centre
version: 0.1.0
title: Aldermoor Centre, a veterinary hospital's six systems, two sites and nine partners
date: 2026-11-12
origin: gm-designed
session_length_minutes: 240
brief: brief.md
background: >-
  Aldermoor Veterinary Hospitals is a regional franchise of veterinary
  hospitals. Its centre at Aldermoor runs a small-animal and farm practice
  with an emergency service, wards, a laboratory that also serves the
  region's practices, imaging and monitoring machines and an owners' portal.
  Its record, wards, agenda, portal and back office live on one PostgreSQL
  instance, records, streamed to a standby in an off-site room; the
  laboratory and the machines have instances of their own. Integration jobs
  talk to the franchise's other centres, its head office and messaging
  service, an external reference laboratory, the authority and an off-site
  archive.

# --- Aging and difficulty (v0.3 master spec 6.1, 8, 15.1) ----------------
aging:
  minimum: 10h                      # from 23:00: s8's 00:30 feeder, s3's 02:00 feeder, s1's
                                    # night urgent orders, s5 planted three hours before
  handover_at: "09:00"
difficulty:
  score: 9                          # its nine fault instances (the false alarm counts in none)
  level: hard

# --- Domains, purposes and governance (v0.5 master spec 6.2, 8.5, 12.2, 13) ---
