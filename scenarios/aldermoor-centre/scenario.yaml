  - backend
  write_policy: no-access
  parameters: {}
  resources:
    limits:
      cpu: 0.5
      memory: 256M
    reservations:
      cpu: 0.25
      memory: 256M
      disk: 2G
  published_ports: []
  seed_files:
    postgresql.conf: nodes/partners-db/postgresql.conf
    pg_hba.conf: nodes/partners-db/pg_hba.conf
  knobs:
  - setting: shared_buffers
    initial: 32MB
    envelope:
      min: 32MB
      max: 64MB
  - setting: work_mem
    initial: 4MB
    envelope:
      min: 1MB
      max: 16MB
  - setting: maintenance_work_mem
    initial: 32MB
    envelope:
      min: 16MB
      max: 64MB
  - setting: max_connections
    initial: 40
    envelope:
      min: 20
      max: 60
  - setting: max_wal_size
    initial: 256MB
    envelope:
      min: 64MB
      max: 512MB
  - setting: autovacuum
    initial: 'on'
    envelope:
      allowed:
      - 'on'
  data:
    file: data/partners-db.sql
    databases:
    - name: partners
      owner: postgres
      tables:
      - name: authority.amu_reports
        description: the authority's stub, one row a yearly report acknowledged (its key, its reference,
          the body as first acknowledged)
      - name: authority.amu_report_calls
        description: every call to the authority's reports endpoint, its number and the status answered
          (one in fifty 503)
      - name: authority.state
        description: the authority's stub's state (delay_ms 0, fail_one_in 50)
      - name: headoffice.figures
        description: the head office's stub, one row a month's figures acknowledged (its key, its reference,
          the body as first acknowledged)
      - name: headoffice.figure_calls
        description: every call to the head office's figures endpoint, its number and the status answered
          (one in fifty 503)
      - name: headoffice.state
        description: the head office's stub's state (delay_ms 0, fail_one_in 50)
      - name: centres.exchanges
        description: the other centres' stub, one row an exchange a centre holds, the history's open ones
          planted (its fragments left out)
      - name: xlab.orders
        description: the external lab's stub, one row a send-out it holds, the history's open ones planted
          (its fragments left out)
      - name: practices.orders
        description: the practices' stub, one row an order posted to lab-api, the history's open ones
          planted (their fragments left out)
