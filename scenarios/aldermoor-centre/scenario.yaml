- id: I1
  complaint: 'The emergency team is furious: blood gases and other urgent tests we order at night come
    back hours late, as if the lab only looked at them on the pathologist''s morning round. It started
    a while ago and nobody can tell us why. Please find what is wrong and fix it.'
  expected_resolution: fix
  covers:
  - s1
- id: I2
  complaint: 'The external lab is slow: the small-animal PCR panel we sent out came back only on its fourth
    day. Is something wrong with the send-outs?'
  expected_resolution: report
  covers: []

