# --- Topology (master spec 14: 25 nodes) -------------------------------
networks:
- name: backend
  description: 'the clinic''s one network: every node, the players'' SSH and SQL sessions, the partners''
    calls'
nodes:
- name: bastion
  brick:
    id: bastion
    version: 0.6.0
  role: bastion
  stateful: true
  networks:
  - backend
  write_policy: report-only
  parameters:
    web_routes:
      grafana: grafana:3000
      prometheus: prometheus:9090
      health: health:8080
  resources:
    limits:
      cpu: 0.5
      memory: 256M
    reservations:
      cpu: 0.1
      memory: 96M
      disk: 256M
  published_ports:
  - port: 22
    default: 2222
  - port: 8080
    default: 8080
  seed_files:
    README.md: player/README.md
    story.md: player/story.md
    issues.md: player/issues.md
    data-policy.md: player/data-policy.md
    data-register.md: player/data-register.md
    partners.md: player/partners.md
    network-overview.md: player/network-overview.md
  knobs: []
- name: records
  brick:
    id: postgres
    version: 0.5.1
  role: database
  description: The record's database server, the medical record, the agenda and the wards, the back
    office's registers and reports, the owners' portal.
  users: []
  stateful: true
  networks:
  - backend
  write_policy: fixable
  parameters:
    vault_target: cold-storage:8000
    vault_credential: cold_storage
  resources:
    limits:
      cpu: 1
      memory: 1G
    reservations:
      cpu: 0.5
      memory: 512M
      disk: 2.25G
  published_ports: []
  seed_files:
    postgresql.conf: nodes/records/postgresql.conf
    pg_hba.conf: nodes/records/pg_hba.conf
    crontab: nodes/records/crontab
  knobs:
  - setting: shared_buffers
    initial: 128MB
    envelope:
      min: 64MB
      max: 256MB
  - setting: work_mem
    initial: 4MB
    envelope:
      min: 1MB
      max: 64MB
  - setting: maintenance_work_mem
    initial: 64MB
    envelope:
      min: 16MB
      max: 256MB
  - setting: max_connections
    initial: 100
    envelope:
      min: 10
      max: 200
  - setting: max_wal_size
    initial: 1GB
    envelope:
      min: 64MB
      max: 1GB
  - setting: autovacuum
    initial: 'on'
    envelope:
      allowed:
      - 'on'
  data:
    file: data/records.sql
    databases:
    - name: jobs
      owner: postgres
      tables:
      - name: cron.job
        description: pg_cron's jobs; vet-portal's sessions' purge (portal.sessions.purge, 30 3 * * *),
          scheduled by load-data after the part's load, in portal, as portal_housekeeping.
    - name: office
      owner: office
      tables:
      - name: runs
        description: the back office's run ledger, one row a run of its jobs that acted (a periodic job
          on a date not its own writes none)
      - name: regulatory_submissions
        description: the copies of the regulatory submissions sent, here the yearly antimicrobial-use
          reports (kind amu-report)
      - name: medicines_register
        description: the medicines register, one line a supply (a dispensing or a dose given) of a local
          day, fed at 01:30 for yesterday
      - name: controlled_movements
        description: the controlled drugs' register, one line a movement of a controlled batch of a local
          day, fed at 01:45
      - name: register_extracts
        description: the month's extract per product (lines, quantity, an md5 of its lines), closed on
          the 1st at 03:00
      - name: controlled_balances
        description: each controlled batch's month (opening, received, moved, closing, signed by the vet),
          on the 1st at 03:15
      - name: controlled_inventories
        description: the yearly inventory of the controlled batches, on 1 January at 03:30
      - name: antimicrobial_use
        description: the antimicrobials used per local day, species and ATCvet code (doses, dispensings,
          quantity, animals and herds treated), fed at 02:00
      - name: amu_reports
        description: last year's report per species due, summed from the daily rows, sent on 15 January
          at 04:00, its reference or its escalation
      - name: working_time_days
        description: each staff member's local day (shifts, planned and clocked hours, night hours, call-outs),
          fed at 09:30 for yesterday
      - name: rest_breaches
        description: each shift begun after a rest shorter than the minimum, from the day's clocked shifts
      - name: working_time_months
        description: each staff member's month (hours, night hours, call-outs, breaches, the four months'
          weekly average), on the 1st at 05:00
      - name: daily_figures
        description: the centre's activity per local day, section and measure (consultations, admissions,
          discharges, the stays and housing units at midnight, new owners and animals, the lab's tests
          and turnaround), fed at 00:30
      - name: monthly_figures
        description: the month's figures per section and measure, summed from the days, sent to the head
          office from the 1st at 05:00, its reference or its escalation on the 5th
      - name: lab_charge_lines
        description: the lab's charges to the practices made billable or voided per local day (order,
          test, kind, amount, the practice's patient reference and client surname), fed at 02:30
      - name: lab_statements
        description: each practice account's monthly statement (billable less voids, the volume discount's
          bracket, the amount due), on the 1st at 04:00
  options:
  - monitoring
  crontab_roles: []
- name: standby
  brick:
    id: postgres
    version: 0.5.1
  role: database
  description: The record's standby, a streaming replica of records where the back office's reports
    run their heavy reads.
  site: the off-site room, at Lowmoor
  users: []
  stateful: true
  networks:
  - backend
  write_policy: fixable
  parameters: {}
  resources:
    limits:
      cpu: 1
      memory: 1G
    reservations:
      cpu: 0.5
      memory: 512M
      disk: 2.25G
  published_ports: []
  seed_files:
    postgresql.conf: nodes/standby/postgresql.conf
    pg_hba.conf: nodes/standby/pg_hba.conf
  knobs:
  - setting: shared_buffers
    initial: 128MB
    envelope:
      min: 64MB
      max: 256MB
  - setting: work_mem
    initial: 4MB
    envelope:
      min: 1MB
      max: 64MB
  - setting: maintenance_work_mem
    initial: 64MB
    envelope:
      min: 16MB
      max: 256MB
  - setting: max_connections
    initial: 100
    envelope:
      min: 10
      max: 200
  - setting: max_wal_size
    initial: 1GB
    envelope:
      min: 64MB
      max: 1GB
  - setting: autovacuum
    initial: 'on'
    envelope:
      allowed:
      - 'on'
  standby_of: records
  options:
  - monitoring
- name: lab
