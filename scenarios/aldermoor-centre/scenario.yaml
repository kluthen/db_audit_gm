  - setting: work_mem
    initial: 4MB
    envelope:
      min: 1MB
      max: 64MB
  - setting: maintenance_work_mem
    initial: 64MB
    envelope:
      min: 16MB
      max: 256MB
  - setting: max_connections
    initial: 100
    envelope:
      min: 10
      max: 200
  - setting: max_wal_size
    initial: 1GB
