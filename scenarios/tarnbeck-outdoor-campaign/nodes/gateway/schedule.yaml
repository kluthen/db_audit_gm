# Schedule of the customs gateway's callback: its connection to the shop's
# database as customs_gw, one call every 15 seconds day and night, and the
# gateway's maintenance window this morning.
intensity: 1.0
connections:
  customs:
    driver: sql/postgresql
    target: db:5432/shop
    role: customs_gw
    pool: {size: 1}
streams:
  - key: customs.acknowledge
    connection: customs
    rate: 4/min
    arrivals: even
timeline:
  - at: handover-6h
    stream: customs.acknowledge
    set:
      key: customs.unavailable
  - at: handover-4h
    stream: customs.acknowledge
    set:
      key: customs.acknowledge
