# Service times of the web shop's keys (v0.6 master spec 9.7; capture W1
# item 9): the database's work for one call, in seconds, lognormal (median,
# sigma of its logarithm), read by gmctl fill from this folder, never a seed
# file, never on a node. The keys the campaign shares with the shop copy the
# shop's figures with their source; its own keys (consent.unsubscribe,
# consent.unsubscribe-v2, consent.subscribe) were measured by v0.6 chunk
# 11b's run A.
source: >-
  copied from scenarios/tarnbeck-outdoor-shop/nodes/producer/service-times.yaml:
  research/fake-aging 10d1bc6, run R (fa-real, 2026-11-14 to 15), the queue
  model's figures (latency.py, SERVICE) as compared with R's log in
  calibrate-r-producer-20261115.txt. The consent keys: v0.6 chunk 11b, run A
  (a short real run of tarnbeck-outdoor-campaign on armenelos, 2026-11-19
  07:57 to 08:20 UTC, each key also moved to a job a minute from 08:09),
  tools/fake_aging/calibration/tarnbeck-outdoor-campaign-keys-producer-20261119T0817Z.txt
  (sigma 0 where each minute held one call)
