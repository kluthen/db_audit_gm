# Query repository of the marketing team and the shipping manager (the crm
# machine): what their jobs run on the shop's database.
queries:
  # --- The win-back campaign, as shop_crm ------------------------------------
  # The win-back extraction: the lapsed customers (last order 60 to 365
  # days ago) who opted in to marketing e-mail and are not leads yet, with
  # their score, and the run's etl_runs row, in one statement.
  leads.extract:
    sql: >-
      WITH candidates AS (
        SELECT k.id AS campaign_id, c.id AS customer_id,
               round(c.lifetime_value
                     / (1 + extract(epoch FROM now() - c.last_order_at) / 2592000), 2) AS score
          FROM campaigns k
          JOIN customers c
            ON c.last_order_at <= now() - interval '60 days'
           AND c.last_order_at >= now() - interval '365 days'
         WHERE k.active AND k.segment = 'winback'
           AND c.marketing_opt_in
           AND NOT EXISTS (SELECT 1 FROM leads l
                            WHERE l.campaign_id = k.id AND l.customer_id = c.id)),
      ledger AS (
        INSERT INTO etl_runs (job, started_at, finished_at, rows_read, rows_written)
        SELECT 'leads-extract', now(), clock_timestamp(), count(*), count(*) FROM candidates)
      INSERT INTO leads (campaign_id, customer_id, score, extracted_at)
      SELECT campaign_id, customer_id, score, now() FROM candidates
  # --- The customer mailing, as shop_crm -------------------------------------
  # A row of mail_outbox is a mail handed to the mail provider; its sent_at
  # is the run's now().
  #
  # Payloads (the provider's templates):
  #   order-shipped  {name, email, order_id, shipped_at, ship_country, total}
  #   a campaign's   {name, email, campaign}, the template the campaign's code
  # The orders shipped lately: the ten minutes ending at the last whole
  # minute before the run, a minute behind so a warehouse update still
  # committing is not missed, and wide enough that a late run misses
  # nothing. No consent needed: a shipping notice is transactional.
  mail.shipped:
    sql: >-
      WITH slot AS (
        SELECT date_trunc('minute', now()) - interval '1 minute' AS ends),
      shipped AS (
        SELECT o.id, o.customer_id, o.shipped_at, o.ship_country, o.total
          FROM slot, orders o
         WHERE o.shipped_at >= slot.ends - interval '10 minutes' AND o.shipped_at < slot.ends)
      INSERT INTO mail_outbox (customer_id, email, template, order_id, payload, sent_at)
      SELECT s.customer_id, c.email, 'order-shipped', s.id,
             jsonb_build_object('name', c.name, 'email', c.email, 'order_id', s.id,
                                'shipped_at', s.shipped_at, 'ship_country', s.ship_country,
                                'total', s.total),
             now()
        FROM shipped s JOIN customers c ON c.id = s.customer_id
  # A batch of the active campaign's leads not yet mailed, best score
  # first, 50 a run (the provider's contract: 200 an hour): each opted in,
  # and now within the sending hours.
  mail.campaign:
    sql: >-
      WITH pending AS (
        SELECT l.campaign_id, k.code, l.customer_id, c.name, c.email
          FROM campaigns k
          JOIN leads l ON l.campaign_id = k.id
          JOIN customers c ON c.id = l.customer_id
         CROSS JOIN business_settings s
         WHERE k.active AND k.segment = 'winback'
           AND c.marketing_opt_in
           AND (now() AT TIME ZONE s.timezone)::time >= s.mail_window_start
           AND (now() AT TIME ZONE s.timezone)::time < s.mail_window_end
           AND NOT EXISTS (SELECT 1 FROM mail_outbox m
                            WHERE m.campaign_id = l.campaign_id AND m.customer_id = l.customer_id)
         ORDER BY l.score DESC, l.customer_id
         LIMIT 50)
      INSERT INTO mail_outbox (customer_id, email, template, campaign_id, payload, sent_at)
      SELECT customer_id, email, code, campaign_id,
             jsonb_build_object('name', name, 'email', email, 'campaign', code), now()
        FROM pending
  # --- The export declarations, as shop_customs -----------------------------
  # Each job writes its rows and its run's etl_runs row in one statement,
  # so in one transaction: the run's now() is every row's time and the
  # ledger row's started_at.
  #
  # The declaration's payload is the customs gateway's schema, exactly:
  #   {order_ref, consignee_name, consignee_address, destination_country,
  #    lines: [{sku, description, quantity, value}], total_value, currency}
  # The export orders packed in the last two hours (the deadline: an order
  # packed earlier is overdue already) with no declaration yet, one
  # declaration each, keyed by the order. The idempotency key is unique.
  declare.exports:
    sql: >-
      WITH due AS (
        SELECT o.id, o.packed_at, o.ship_country, c.name, c.address
          FROM orders o
          JOIN export_countries x ON x.country = o.ship_country
          JOIN customers c ON c.id = o.customer_id
         WHERE o.packed_at > now() - interval '2 hours'
           AND NOT EXISTS (SELECT 1 FROM customs_outbox d WHERE d.order_id = o.id)),
      ledger AS (
        INSERT INTO etl_runs (job, started_at, finished_at, rows_read, rows_written, watermark)
        SELECT 'declare-exports', now(), clock_timestamp(), count(*), count(*), max(packed_at)
          FROM due)
      INSERT INTO customs_outbox (order_id, payload, sent_at, idempotency_key)
      SELECT d.id,
             jsonb_build_object(
               'order_ref', 'TB-' || d.id,
               'consignee_name', d.name,
               'consignee_address', d.address,
               'destination_country', d.ship_country,
               'lines', l.lines,
               'total_value', l.total_value,
               'currency', 'EUR'),
             now(), 'export-' || d.id
        FROM due d
       CROSS JOIN LATERAL (
             SELECT jsonb_agg(jsonb_build_object('sku', ol.sku, 'description', ol.product_name,
                                                 'quantity', ol.quantity,
                                                 'value', ol.line_total) ORDER BY ol.id) AS lines,
                    sum(ol.line_total) AS total_value
               FROM order_lines ol WHERE ol.order_id = d.id) AS l
  # The declarations of the last day the gateway rejected, with no
  # incident yet: one incident each (source customs, ref the declaration's
  # id).
  escalate.customs:
    sql: >-
      WITH due AS (
        SELECT d.id, 'rejected by the gateway: ' || r.reason AS reason
          FROM customs_outbox d
          JOIN LATERAL (
                SELECT coalesce(k.reason, 'no reason given') AS reason FROM customs_acks k
                 WHERE k.outbox_id = d.id AND k.status = 'rejected'
                 ORDER BY k.received_at LIMIT 1) AS r ON true
         WHERE d.sent_at > now() - interval '1 day'
           AND NOT EXISTS (SELECT 1 FROM incidents i
                            WHERE i.source = 'customs' AND i.ref = d.id::text)),
      ledger AS (
        INSERT INTO etl_runs (job, started_at, finished_at, rows_read, rows_written)
        SELECT 'escalate-customs', now(), clock_timestamp(), count(*), count(*) FROM due)
      INSERT INTO incidents (source, ref, opened_at, reason)
      SELECT 'customs', id::text, now(), reason FROM due
