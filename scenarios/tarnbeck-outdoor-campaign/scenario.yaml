issues:                             # master spec 16.1's six, each covering its one instance
  - id: I1
    complaint: >-
      Customers say they get every shipping notice twice.
    expected_resolution: fix
    covers: [f1]
  - id: I2
    complaint: >-
      People who unsubscribed since last night still get our win-back
      e-mails. That is exactly what the data policy forbids.
    expected_resolution: fix
    covers: [f2]
  - id: I3
    complaint: >-
      A customer abroad, eight hours behind us, complained about a
      promotion at 3 a.m. his time.
    expected_resolution: fix
    covers: [f3]
  - id: I4
    complaint: >-
      The accountant's invoiced revenue never matches the dashboard's, and
      the gap grows. The figures are Lumen's: tell us what they should
      change.
    expected_resolution: propose
    covers: [f4]
  - id: I5
    complaint: >-
      The dashboards stopped updating this morning.
    expected_resolution: fix
    covers: [f5]
  - id: I6
    complaint: >-
      Lumen says the reporting database restarted itself one night this
      week and that it is fine now. Is it? Tell us what happened and what
      should change.
    expected_resolution: report
    covers: [f10]

# --- Host topology it was designed for -------------------------------
# Two hosts (master spec 16.1): reporting on the first, the manager, never
# on a shared host (13.3); bi and gateway on the second. On a one-host
# playground both map onto that host (armenelos).
designed_for:
  platform: swarm
  hosts:
    - name: host-1
      cpu: 2
      memory: 4G
      disk: 12G
    - name: host-2
      cpu: 1
      memory: 1G
      disk: 2G
  placement:
    bastion: host-1
    db: host-1
    pooler: host-1
    producer: host-1
    consumer: host-1
    reporting: host-1
    bi: host-2
    crm: host-1
    gateway: host-2
    prometheus: host-1
    exporter: host-1
    grafana: host-1
