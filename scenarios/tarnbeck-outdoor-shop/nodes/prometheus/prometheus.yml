# prometheus.yml of Tarnbeck Outdoor's monitoring: Prometheus itself, the
# PostgreSQL exporter, the two applications' metrics and the machines'
# node-health endpoints.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Retention: a day of history, bounded in size too.
storage:
  tsdb:
    retention:
      time: 1d
      size: 384MB

scrape_configs:
  - job_name: prometheus
    metrics_path: /prometheus/metrics
    static_configs:
      - targets: ['localhost:9090']
  - job_name: postgres
    static_configs:
      - targets: ['exporter:9187']
  - job_name: scheduler
    static_configs:
      - targets: ['producer:9120', 'consumer:9120']
  - job_name: node-health
    static_configs:
      - targets: ['bastion:9110', 'db:9110', 'producer:9110', 'consumer:9110',
                  'prometheus:9110', 'exporter:9110', 'grafana:9110']
