# Schedule of Tarnbeck Outdoor's web shop, in scenario time (master spec
# 7.1): the shoppers, the warehouse and the carriers' feed, all through the
# pooler. Peak at 12:00; the carriers' feed runs day and night.
intensity: 1.0
connections:
  app:
    driver: sql/postgresql
    target: pooler:6432/shop
    role: shop_app
    pool: {size: 8}
streams:
  - key: orders.place
    connection: app
    rate: 40/min
    arrivals: poisson
    shape: business-hours
    concurrency: 8
  - key: catalog.lookup
    connection: app
    rate: 120/min
    arrivals: poisson
    shape: business-hours
    concurrency: 4
  - key: orders.detail
    connection: app
    rate: 20/min
    arrivals: poisson
    shape: business-hours
    concurrency: 4
  - key: orders.status
    connection: app
    rate: 30/min
    arrivals: poisson
    shape: business-hours
    concurrency: 2
  - key: deliveries.ingest
    connection: app
    rate: 10/min
    arrivals: poisson
    concurrency: 2
shapes:
  business-hours:
    hours: {"00-05": 0.1, "06": 0.3, "07": 0.6, "08-11": 0.8, "12": 1.0, "13-17": 0.8,
            "18-21": 0.6, "22-23": 0.3}
