# Schedule of Tarnbeck Outdoor's back office, in scenario time (master spec
# 7.1), straight to the database: the office's screens and reports in office
# hours, the warehouse dashboard all day and night.
intensity: 1.0
connections:
  reports:
    driver: sql/postgresql
    target: db:5432/shop
    role: shop_reports
    pool: {size: 2}
streams:
  - key: reports.recent
    connection: reports
    rate: 4/min
    arrivals: even
    shape: office-hours
  - key: reports.best-days
    connection: reports
    rate: 20/h
    arrivals: even
    shape: office-hours
  - key: reports.dashboard
    connection: reports
    rate: 12/h
    arrivals: even
    concurrency: 2
shapes:
  office-hours:
    hours: {"00-06": 0.2, "07": 0.6, "08-17": 1.0, "18-21": 0.6, "22-23": 0.2}
