# The PostgreSQL exporter's configuration: the database node's address
# (<db node>:5432/postgres; the server runs without SSL).
DATA_SOURCE_URI=db:5432/postgres?sslmode=disable
# The monitoring role (pg_monitor); its password is a secret of the node,
# never written here.
DATA_SOURCE_USER=monitoring
# Query statistics; needs shared_preload_libraries = 'pg_stat_statements'
# on the database node.
COLLECTORS=--collector.stat_statements
