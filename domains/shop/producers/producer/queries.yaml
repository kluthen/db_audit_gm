# Query repository of the shop's web shop, a fragment (capture W1, items 5
# and 6): the keys the web shop sends to its database, through the
# connection pooler, as shop_app. Derived from tarnbeck-outdoor-shop's
# producer, its planted faults taken out (the product-code search compares
# the sku; the carriers' resent events are stored once), plus master spec
# 9.8: the consent streams, the order's destination and the warehouse's
# packing and shipping times.
queries:
  # Checkout: the order, its lines, the stock and the customer's last order,
  # then the payment provider's authorisation before COMMIT. The order ships
  # to the customer's country, one in twenty elsewhere.
  orders.place:
    sql: >-
      WITH basket AS (
        SELECT id, sku, name, price, 1 + mod(id, 3) AS quantity FROM products
         WHERE id BETWEEN %(product_id)s AND %(product_id)s + %(extra)s),
      destination AS (
        SELECT CASE WHEN %(elsewhere)s <= 95 THEN country
                    ELSE (ARRAY['DE', 'FR', 'NL', 'CH', 'GB'])[%(elsewhere)s - 95] END AS country
          FROM customers WHERE id = %(customer_id)s),
      new_order AS (
        INSERT INTO orders (customer_id, placed_at, status, total, updated_at, ship_country)
        SELECT %(customer_id)s, now(), 'paid', sum(price * quantity), now(),
               (SELECT country FROM destination)
          FROM basket
        RETURNING id, customer_id),
      new_lines AS (
        INSERT INTO order_lines (order_id, product_id, sku, product_name, quantity, unit_price,
                                 vat_rate, line_total, created_at)
        SELECT new_order.id, basket.id, basket.sku, basket.name, basket.quantity, basket.price,
               20.00, basket.quantity * basket.price, now()
          FROM new_order, basket),
      stock AS (
        UPDATE products SET stock = stock - 1, sold = sold + 1
         WHERE id IN (SELECT id FROM basket))
      UPDATE customers SET last_order_at = now()
       WHERE id = (SELECT customer_id FROM new_order)
    params:
      customer_id: {int: [1, 20000]}
      product_id: {int: [1, 1996]}
      extra: {int: [0, 4]}
      elsewhere: {int: [1, 100]}
    transaction: {isolation: read committed, hold: 3s}
  catalog.lookup:                    # the shop's catalogue pages
    - sql: SELECT id, sku, name, price, stock FROM products WHERE id = %(id)s
      params: {id: {int: [1, 2000]}}
      weight: 6
    - sql: >-
        SELECT id, sku, name, price FROM products WHERE category = %(category)s
         ORDER BY sold DESC, name LIMIT 24
      params:
        category: {choice: [tents, sleeping-bags, backpacks, footwear, clothing, stoves, lighting,
                            accessories]}
      weight: 2
    - sql: >-
        SELECT product_id, sku, name, price FROM popular_products
         WHERE category = %(category)s ORDER BY rank LIMIT 12
      params:
        category: {choice: [tents, sleeping-bags, backpacks, footwear, clothing, stoves, lighting,
                            accessories]}
      weight: 1
    - sql: >-
        SELECT id, sku, name, price, stock FROM products
         WHERE sku = 'TB-' || lpad(%(code)s::text, 5, '0')
      params: {code: {int: [1, 2000]}}
      weight: 1
  orders.detail:                     # a customer opens one of their recent orders
    sql: >-
      SELECT o.id, o.placed_at, o.status, o.total, l.product_id, l.quantity, l.unit_price
        FROM orders o JOIN order_lines l ON l.order_id = o.id
       WHERE o.id = (SELECT max(id) FROM orders) - %(back)s
    params:
      back: {int: [0, 20000]}
  # The warehouse packs and ships the newest orders, stamping each step.
  orders.status:
    sql: >-
      UPDATE orders
         SET status = CASE status WHEN 'paid' THEN 'packed' ELSE 'shipped' END,
             packed_at = CASE status WHEN 'paid' THEN now() ELSE packed_at END,
             shipped_at = CASE status WHEN 'packed' THEN now() ELSE shipped_at END,
             updated_at = now()
       WHERE id = (SELECT max(id) FROM orders) - %(back)s AND status IN ('paid', 'packed')
    params:
      back: {int: [0, 5000]}
  deliveries.ingest:                 # the carriers' delivery events
    builder: builders/carrier_feed.py:ingest
    options: {resend: 0.2, orders: 300000}
  # The unsubscribe link in a mail: a withdrawal and the flag. Three clicks
  # in four come from a lapsed customer (last order 60 to 365 days ago), the
  # win-back campaign's audience.
  consent.unsubscribe:
    sql: >-
      WITH target AS (
        SELECT id FROM customers
         WHERE marketing_opt_in
           AND (%(audience)s > 3
                OR last_order_at BETWEEN now() - interval '365 days'
                                     AND now() - interval '60 days')
         ORDER BY id < %(from)s, id LIMIT 1),
      event AS (
        INSERT INTO consent_events (customer_id, purpose, granted, at, source)
        SELECT id, 'marketing-email', false, now(), 'unsubscribe-link' FROM target)
      UPDATE customers SET marketing_opt_in = false
       WHERE id = (SELECT id FROM target)
    params:
      audience: {int: [1, 4]}
      from: {int: [1, 20000]}
  # The newsletter box ticked at checkout: a grant and the flag.
  consent.subscribe:
    sql: >-
      WITH target AS (
        SELECT id FROM customers WHERE NOT marketing_opt_in
         ORDER BY id < %(from)s, id LIMIT 1),
      event AS (
        INSERT INTO consent_events (customer_id, purpose, granted, at, source)
        SELECT id, 'marketing-email', true, now(), 'checkout' FROM target)
      UPDATE customers SET marketing_opt_in = true
       WHERE id = (SELECT id FROM target)
    params:
      from: {int: [1, 20000]}
  # Close of day: invoicing, the customers' lifetime value (the newly
  # invoiced added to it: older orders are archived away), the products'
  # sales; then the day's invoices are posted to the accounting service
  # before COMMIT.
  orders.close-day:
    transaction: {isolation: read committed, hold: 20s}
    steps:
      - sql: >-
          WITH invoiced AS (
            UPDATE orders SET status = 'invoiced', updated_at = now() WHERE status = 'shipped'
            RETURNING customer_id, total)
          UPDATE customers c SET lifetime_value = c.lifetime_value + s.total
            FROM (SELECT customer_id, sum(total) AS total FROM invoiced GROUP BY customer_id) s
           WHERE c.id = s.customer_id
      - sql: >-
          UPDATE products p SET sold = s.quantity
            FROM (SELECT product_id, sum(quantity) AS quantity FROM order_lines
                   GROUP BY product_id) s
           WHERE p.id = s.product_id
