# The shop's classification (master spec 9.9, 11.2, 11.3): every column of
# every table and view of the shop's database, schema public, keyed
# <table>.<column> without the database (v0.5 master spec 6.1, 8.6; v0.5
# capture W1, item 7): the scenario's copy adds it (shop.<table>.<column>).
# The domain classifies; a scenario's governance: states each class's rules.
#
# Classes:
#   personal         names, e-mail and postal addresses, a customer's country
#                    and time zone, consent (the events, and the opt-in flag
#                    stating the same fact), the outboxes' e-mails and
#                    payloads; and a customer id stored beside a direct
#                    identifier (customers.id, mail_outbox.customer_id),
#                    since "a direct identifier, or anything stored with one"
#                    (11.2) and not "a customer id with no direct identifier
#                    beside it";
#   customer-linked  a customer id with no direct identifier beside it:
#                    orders.customer_id, and leads, the whole table;
#   internal         everything else: products, orders and their totals,
#                    destinations, the customs acknowledgements and
#                    incidents, the run ledger, the aggregates.
# A column with no entry is internal; every column is listed all the same.
columns:
  # business_settings: the customer's zone and the mailing hours
  business_settings.timezone: internal
  business_settings.utc_offset_hours: internal
  business_settings.mail_window_start: internal
  business_settings.mail_window_end: internal

  # customers
  customers.id: personal
  customers.name: personal
  customers.email: personal
  customers.address: personal
  customers.country: personal
  customers.timezone: personal
  customers.marketing_opt_in: personal
  customers.created_at: internal
  customers.last_order_at: internal
  customers.lifetime_value: internal

  # consent_events: consent events are personal, every column
  consent_events.id: personal
  consent_events.customer_id: personal
  consent_events.purpose: personal
  consent_events.granted: personal
  consent_events.at: personal
  consent_events.source: personal

  # products
  products.id: internal
  products.sku: internal
  products.name: internal
  products.category: internal
  products.price: internal
  products.stock: internal
  products.sold: internal

  # orders
  orders.id: internal
  orders.customer_id: customer-linked
  orders.placed_at: internal
  orders.status: internal
  orders.total: internal
  orders.updated_at: internal
  orders.packed_at: internal
  orders.shipped_at: internal
  orders.ship_country: internal

  # order_lines
  order_lines.id: internal
  order_lines.order_id: internal
  order_lines.product_id: internal
  order_lines.sku: internal
  order_lines.product_name: internal
  order_lines.quantity: internal
  order_lines.unit_price: internal
  order_lines.vat_rate: internal
  order_lines.line_total: internal
  order_lines.created_at: internal

  # delivery_events: the carriers' feed
  delivery_events.id: internal
  delivery_events.event_id: internal
  delivery_events.order_id: internal
  delivery_events.status: internal
  delivery_events.received_at: internal

  # export_countries
  export_countries.country: internal

  # campaigns
  campaigns.id: internal
  campaigns.code: internal
  campaigns.segment: internal
  campaigns.starts_on: internal
  campaigns.ends_on: internal
  campaigns.active: internal

  # leads: customer-linked, every column
  leads.campaign_id: customer-linked
  leads.customer_id: customer-linked
  leads.score: customer-linked
  leads.extracted_at: customer-linked

  # mail_outbox: the e-mail and the payload; the customer id beside them
  mail_outbox.id: internal
  mail_outbox.customer_id: personal
  mail_outbox.email: personal
  mail_outbox.template: internal
  mail_outbox.campaign_id: internal
  mail_outbox.order_id: internal
  mail_outbox.payload: personal
  mail_outbox.sent_at: internal

  # customs_outbox: the declaration's payload names the consignee
  customs_outbox.id: internal
  customs_outbox.order_id: internal
  customs_outbox.payload: personal
  customs_outbox.sent_at: internal
  customs_outbox.idempotency_key: internal

  # customs_acks
  customs_acks.outbox_id: internal
  customs_acks.status: internal
  customs_acks.reference: internal
  customs_acks.reason: internal
  customs_acks.received_at: internal

  # incidents
  incidents.id: internal
  incidents.source: internal
  incidents.ref: internal
  incidents.opened_at: internal
  incidents.reason: internal

  # etl_runs: the run ledger
  etl_runs.id: internal
  etl_runs.job: internal
  etl_runs.started_at: internal
  etl_runs.finished_at: internal
  etl_runs.rows_read: internal
  etl_runs.rows_written: internal
  etl_runs.watermark: internal

  # popular_products (materialized view): the best sellers
  popular_products.category: internal
  popular_products.rank: internal
  popular_products.product_id: internal
  popular_products.sku: internal
  popular_products.name: internal
  popular_products.price: internal
  popular_products.units: internal
