# vet-portal's classification (v0.5 master spec 9.7; vet-portal-domain.md,
# "Classification", ruled D320): every column of every table of the portal's
# database, schema public, keyed <table>.<column> without the database
# (master spec 6.1): the scenario's copy adds it (portal.<table>.<column>).
#
# Classes (v0.4's three, as vet-core applies them, D280):
#   personal         a direct identifier, or a person's id stored beside one:
#                    an account's name, e-mail and phone, with the account's
#                    and the owner's ids beside them, its password's hash and
#                    its one-time link's; a session token's hash (an online
#                    identifier, GDPR recital 30); a document's vet's name (a
#                    staff member's); the outbox's address and payload (the
#                    recipient's name, the animal's) and the ids beside them;
#   customer-linked  the customer is the owner: an id with no identifier
#                    beside it, as the core's ownerships.animal_id: the
#                    copies' animal, herd, owner and keeper ids, a document's
#                    animal or herd, a session's or a view's account, a
#                    consent event's owner, animal and keeper (the shop
#                    classed its consent events personal, v0.4 9.9, which the
#                    column-by-column reading of D280 refines);
#   internal         everything else: the settings, statuses, times and
#                    counters, a document's body (the medical record, as the
#                    core's diagnoses, once no owner is beside it), the
#                    message keys and the messaging service's ids. Animal
#                    health is no special category (O112).
# Two traps follow (docs/gm.md, "The traps"): a document's body carrying free
# text, which may name a former owner, though classed internal; and the
# copies carrying more than the portal shows (an address, a chip).
