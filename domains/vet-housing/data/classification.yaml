# vet-housing's classification (v0.5 master spec 9.5; vet-housing-domain.md,
# "Classification"): every column of every table and view of the part, in
# the core's database, schema public, keyed <table>.<column> without the
# database (v0.5 master spec 6.1): the scenario's copy adds it
# (clinic.<table>.<column>). The domain classifies; a scenario's governance:
# states each class's rules.
#
# Readings, as the core's (vet-core data/classification.yaml):
#   no housing table carries an identifier: a unit, a display, a stay id, a
#   staff id are the clinic's work record, internal, as the core's
#   administrations.stay_id is;
#   the unit board carries the animal's id with no identifier beside it, so
#   customer-linked, as the core's animal_board.animal_id;
#   free text (a plan's or a care event's note) is internal, with the trap the
#   core's readings name: it may name the owner (T169), and the board shows
#   no note.
# Housing holds no personal data, which its rules keep so (docs/policy.md).
columns:
  # housing_units
  housing_units.id: internal
  housing_units.section_id: internal
  housing_units.code: internal
  housing_units.kind: internal
  housing_units.isolation: internal
  housing_units.intensive: internal
  housing_units.state: internal
  housing_units.state_since_at: internal

  # housing_displays
  housing_displays.id: internal
  housing_displays.unit_id: internal
  housing_displays.serial: internal
  housing_displays.installed_on: internal
  housing_displays.removed_on: internal

  # housing_placements
  housing_placements.id: internal
  housing_placements.unit_id: internal
  housing_placements.stay_id: internal
  housing_placements.from_at: internal
  housing_placements.until_at: internal
