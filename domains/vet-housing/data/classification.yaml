  housing_feeding_plans.stay_id: internal
  housing_feeding_plans.kind: internal
  housing_feeding_plans.diet: internal
  housing_feeding_plans.meals_a_day: internal
  housing_feeding_plans.from_at: internal
  housing_feeding_plans.until_at: internal
  housing_feeding_plans.set_by: internal
  housing_feeding_plans.note: internal

  # housing_care_events
