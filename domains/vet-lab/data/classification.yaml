# vet-lab's classification (v0.5 master spec 9.3; vet-lab-domain.md,
# "Classification", D302): every column of every table of the lab's database,
# schema public, keyed <table>.<column> without the database (master spec
# 6.1): the scenario's copy adds it (lab.<table>.<column>).
#
# Classes (v0.4's three, as vet-core applies them, D280):
#   personal         a direct identifier, or a person's id stored beside one:
#                    the centre's animal's id beside its natural identifiers
#                    (microchip, UELN, ear tag); a practice's patient reference,
#                    its client's surname (or the centre's owner's, lab.identity's);
#                    the other party of a custody handover; a person called at
#                    a practice;
#   customer-linked  none: every order holding an animal's id holds an
#                    identifier beside it;
#   internal         everything else: the reference tables, a practice's id,
#                    account and callback (a business), child rows (samples,
#                    tests, results: they refer to their order and carry no
#                    identifier), the core's request and consultation ids, staff
#                    ids. Animal health is no special category (O112).
# Two traps follow (docs/gm.md, "The traps"): free text (clinical notes, a
# test's comment, a report) may name the owner or the client, though classed
# internal; and a send-out or a callback carrying more than its rule allows.
