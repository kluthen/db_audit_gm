# queries.yaml of the external reference lab's stub, a fragment for
# partners-backend (v0.5 master spec 10.2; capture W2 item 6, W3 item 1): its
# baseline key, every answer at once (delay_ms, the milliseconds its orders
# endpoint adds before each answer), and its tick. A fault's key
# (xlab.<behaviour>) upserts other values.
queries:
  xlab.normal:
    sql: >-
      INSERT INTO xlab.state (hostname, name, value) VALUES ('northfield-lab', 'delay_ms', '0')
      ON CONFLICT (hostname, name) DO UPDATE SET value = EXCLUDED.value, set_at = now()
  xlab.answer:
    call: POST /tick
