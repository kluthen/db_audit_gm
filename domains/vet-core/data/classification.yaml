# vet-core's classification (v0.5 master spec 9.2; vet-core-domain.md,
# "Classification", ruled D280): every column of every table and view of the
# core's database, schema public, keyed <table>.<column> without the database
# (v0.5 master spec 6.1): the scenario's copy adds it (clinic.<table>.<column>).
# The domain classifies; a scenario's governance: states each class's rules.
#
# Classes (v0.4's three, as the shop applies them):
#   personal         a direct identifier, or a person's id stored beside one:
#                    owners' identity and contacts; staff and referring vets'
#                    id, name, e-mail; an animal's natural identifiers
#                    (microchip, UELN, passport number, ear tag) and a herd's
#                    holding number, which lead to the owner or keeper through
#                    the national registries, and the id beside them; an
#                    inbound exchange's partner_patient summary, which may name
#                    the owner;
#   customer-linked  the customer is the owner: an animal's or a herd's id
#                    with no identifier beside it, the ownerships' keys, a
#                    herd's keeper, a dispensing's owner;
#   internal         everything else: sites, sections, the reference tables,
#                    the medical content (findings, diagnoses, procedures,
#                    doses), the animals' species, breed, name and food-chain
#                    status, a staff id or a referring vet's id as the clinic's
#                    work record. Animal health is no special category (O112).
# Two traps follow (docs/gm.md, "The traps"): free text (findings, an alert,
# a referral's reason) may name the owner, though classed internal; and the
# board the displays read must carry no natural identifier.
