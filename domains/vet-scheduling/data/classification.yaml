# vet-scheduling's classification (v0.5 master spec 9.4; vet-scheduling-domain.md,
# "Classification"): every column of every table of the part, in the core's
# database, schema public, keyed <table>.<column> without the database (v0.5
# master spec 6.1): the scenario's copy adds it (clinic.<table>.<column>).
# The domain classifies; a scenario's governance: states each class's rules.
#
# Readings, as the core's (vet-core data/classification.yaml):
#   the patient follows the core: a booking's animal_id with no identifier
#   beside it is customer-linked (it leads to its owner through ownerships);
#   a teaching animal leads to the clinic, owner 1, no person: an
#   allocation's animal_id, which holds teaching animals only, is internal;
#   staff ids are the clinic's work record, internal on bookings,
#   allocations, shifts and absences; an absence's note is about a named
#   staff member and may reveal health: personal, and rule 4 forbids a
#   reason in it;
#   trainees are people: their id, name, contacts and a referring vet's id
#   beside a name personal, their id customer-linked on an enrolment; a
#   certificate number identifies its holder: personal;
#   free text (a booking's notes) may name the owner: internal by class, a
#   trap (T24), as the core's findings are.
# sched_upcoming is not built in v0.5 (D321).
