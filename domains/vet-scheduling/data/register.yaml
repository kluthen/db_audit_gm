# vet-scheduling's register fragment (v0.5 master spec 6.1, 9.4, 13.1, D334;
# template register.yaml): one entry per processing activity, every table of
# data/schema.sql in exactly one, transcribed from the classification and
# docs/policy.md's rules. The people concerned are the owners through their
# animals' bookings, the staff by id (the rota and the working-time record),
# and the trainees. Retention follows rules 9 and 10 (game values stated as
# such). The scenario's data register (a player handout, chunks 17 and 27) is
# built from it.
activities:
  - id: vet-scheduling-agenda
    name: The agenda, its rooms, machines and appointment types
    purpose: Booking owners' animals, imaging studies, theatre plans, maintenance blocks and training days on the centre's rooms and machines with the staff they take, never one resource in two places at once (rules 1, 2, 5, 6)
    people: [owners, staff]
    tables: [sched_settings, sched_rooms, sched_hours, sched_machines, sched_types, sched_bookings, sched_allocations]
    retention:
      period: 5 years from the booking, as the clinical record (rule 10, core rule 9, a game value)
      then: erased
  - id: vet-scheduling-rota
    name: The staff rota, its clocked hours and absences
    purpose: Planning and publishing each staff member's shifts, recording the hours actually worked and absences by kind only, the working-time record an inspector may ask for (Directive 2003/88/EC; CJEU C-55/18; rules 3, 4)
    people: [staff]
    tables: [sched_shifts, sched_absences]
    retention:
      period: 2 years (rule 10, the working-time record; a game value after Germany's rule)
      then: erased
  - id: vet-scheduling-training
    name: The training centre's courses, sessions, trainees and certificates
    purpose: Running the courses for vets, nurses, students, owners and handlers, their waiting lists, attendance and certificates (GDPR Art 6(1)(b); rules 7, 8, 9)
    people: [trainees]
    tables: [sched_courses, sched_sessions, sched_trainees, sched_enrolments]
    retention:
      period: contacts 3 years after the trainee's last session, enrolments and certificates 5 years (rule 9, game values)
      then: erased
