# vet-machinery's classification (v0.5 master spec 9.6; vet-machinery-domain.md,
# "Classification", ruled D319): every column of every table of the part's
# three databases, keyed <table>.<column> without the database (master spec
# 6.1): the names are unique across pacs, vitals and biomed, and the
# scenario's copy adds each table's database (pacs.mach_worklist.accession).
# The partitions (mach_vitals_<day>, mach_readings_<day>, mach_events_<month>
# and the defaults) go with their parent. The domain classifies; a
# scenario's governance: states each class's rules.
#
#   personal         a study names its owner: DICOM's Patient's Name holds the
#                    owner's family name (PS3.5 6.2) and Responsible Person is
#                    the owner; the animal's id and the A-<id> patient id beside
#                    them, and its natural identifiers (D280); a vendor
#                    engineer's name;
#   customer-linked  a session's and the census's animal id, with no
#                    identifier beside it (the core's stay);
#   internal         everything else: machines are no one; a raw vitals row, a
#                    chart row, an alarm, a series and a report refer to their
#                    parent by id (so the shipped vitals stay internal while
#                    they carry the session's id only, rule 10); an operator's
#                    staff id is the clinic's work record. Free text (a
#                    report's findings, an event's message) may name the owner:
#                    a trap (T213), not a class.
