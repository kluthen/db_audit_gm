# Schedule of the centre's integration engine for the exchanges, a fragment
# (purpose 4; clinic-purposes.md 8; capture W4 items 0 and 4): the record's
# connection as vet_interfaces, and one HTTP connection per centre, each to
# its hostname on the partners' api node with the customer's own key with
# the centres, centres_customer; no stream (a transformer runs jobs only).
# Written for the nodes records and partners-api's three hostnames; the GM
# adapts the targets as it copies.
connections:
  clinic:
    driver: sql/postgresql
    target: records:5432/clinic
    role: vet_interfaces
    pool: {size: 2}
  centres-central:
    driver: http
    target: aldermoor-central:8000
    credential: centres_customer
    pool: 1
    timeout: 10s
  centres-south:
    driver: http
    target: aldermoor-south:8000
    credential: centres_customer
    pool: 1
    timeout: 10s
  centres-abroad:
    driver: http
    target: aldermoor-abroad:8000
    credential: centres_customer
    pool: 1
    timeout: 10s
streams: []
