# The agenda's three script keys on the centre's integration engine, a
# fragment (purpose 11; vet-scheduling-domain.md, "11. vet-bookings-sync";
# capture W4 items 0 and 6): scripts/bookings_sync.py. batch bounds the rows
# a run takes; site is the hospital's own site in the core (sites 2 to 6 are
# the other centres), where every booked consultation is opened.
queries:
  bookings.check-in:
    script: scripts/bookings_sync.py:check_in
    options: {batch: 50, site: 1}
  bookings.book-requests:
    script: scripts/bookings_sync.py:book_requests
    options: {batch: 20}
  bookings.cancel-deceased:
    script: scripts/bookings_sync.py:cancel_deceased
    options: {batch: 50}
