# The imaging round trip's two script keys on the centre's integration
# engine, a fragment (purpose 13; vet-machinery-domain.md,
# "vet-imaging-orders"; capture W4 items 0 and 6):
# scripts/imaging_orders.py. batch bounds the rows a run takes; the
# turnarounds (D376): an urgent study's final within urgent_hours of its
# posting, a routine one's within routine_working_days (Monday to Friday,
# local dates).
queries:
  imaging.post:
    script: scripts/imaging_orders.py:post
    options: {batch: 50}
  imaging.fetch:
    script: scripts/imaging_orders.py:fetch
    options: {batch: 100, urgent_hours: 18, routine_working_days: 3}
