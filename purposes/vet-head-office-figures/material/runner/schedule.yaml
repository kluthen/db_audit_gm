# Schedule of the back office's report runner for the head office's figures,
# a fragment (purpose 9; clinic-purposes.md 13; capture W4 items 0 and 5):
# the record read on its standby as the core's vet_reports, the laboratory's
# database on its only node as the lab's lab_reports, office written on the
# primary as office_jobs, the head office called under its hostname with the
# customer's key (headoffice_customer); no stream. clinic-reports and office
# are purposes 7, 8 and 12's identical entries, lab-reports purpose 10's.
# Written for the nodes standby, lab, records and partners-api; the GM adapts
# the targets as it copies.
connections:
  clinic-reports:
    driver: sql/postgresql
    target: standby:5432/clinic
    role: vet_reports
    pool: {size: 1}
  lab-reports:
    driver: sql/postgresql
    target: lab:5432/lab
    role: lab_reports
    pool: {size: 1}
  office:
    driver: sql/postgresql
    target: records:5432/office
    role: office_jobs
    pool: {size: 1}
  headoffice:
    driver: http
    target: head-office:8000
    credential: headoffice_customer
    pool: 1
    timeout: 10s
streams: []
