# api.yaml of the authority's stub, a fragment for partners-api (v0.5 master
# spec 10.2, 12.2 purpose 8; clinic-purposes.md 12; capture W4 items 0 and 5,
# W2 item 6, W2-f; partners/README.md). Prefix authority, hostname authority:
# the national veterinary authority, the receiver of the yearly
# antimicrobial-use report (this purpose) and of the notifiable diseases
# (purpose 5, vet-notifiable-diseases, its own endpoint on the same prefix).
# Its reports endpoint behind the customer's own key with the authority,
# authority_customer. No stream of its own (the authority only answers): the
# back end keeps its state (authority.normal). The GM copies it into the
# scenario layer compose/partners-api/; its connection is purpose 5's, the
# same entry (compose merges identical entries).
endpoints:
  authority_amu_reports:
    hosts: [authority]
    credentials: [authority_customer]
connections:
  authority-db: {driver: sql/postgresql, target: partners-db:5432/partners, role: authority, pool: {size: 2}}
