# Purpose 7, the medicines registers (v0.5 master spec 11.3, 12.1, 12.2
# purpose 7; clinic-purposes.md 11; Regulation (EU) 2019/6 Art 103(3); spec
# D265, D278, D280, D300, D436; capture W4 items 0 and 5 of
# specs/versions/v0.5/wave-log.md): pulled, periodic. The register of
# supplies and the controlled-drugs register, published in the back office's
# database office for the inspector and the vets to query: fed daily from the
# record's standby, the month's extract and the controlled batches' balances
# on the 1st, the yearly inventory on 1 January, each periodic job run daily
# and acting on its own date only.
#
# Material (material/) is written for the clinic's mapping: source
# records/clinic (read on its standby, standby), target records/office,
# runner backoffice. The GM adapts the names as it copies; gm.md says where
# each name lives. office's DDL (material/target/office.sql, the same text in
# every periodic purpose, once, then material/target/data.sql) goes into
# records' data file, office belonging to no domain; material/history.sql
# plants the past periods after the domains' loads.
id: vet-medicines-registers
title: The register of supplies and the controlled-drugs register, fed daily into the back office, closed monthly
domains: [vet-core]
kind: pulled

parts:
  source: the core's record, clinic (the supplies, read on its standby; the history reads the primary)
  target: the back office's database, office (the registers, the extracts, the balances, the inventories)
  runner: the back office's report runner, backoffice

jobs:
  - name: feed-medicines-register
    key: meds.register
    part: runner
    source: source
    target: target
    method: script
    computes: >-
      yesterday's supplies (the customer's local date): each dispensing and each dose given, with
      the product, its form and authorisation number, the batch, the quantity, the recipient (the
      owner's name and address for a dispensing, the centre for a dose given) and the prescribing
      vet, read on the standby (meds.register.read), one medicines_register line each, once a day;
      one runs row.
    cadence: "30 1 * * *"
    connections:
      clinic: vet_reports
      office: office_jobs
  - name: feed-controlled-drugs
    key: meds.controlled
    part: runner
    source: source
    target: target
    method: script
    computes: >-
      yesterday's movements of controlled medicines (dispensings and doses given, out of their
      batches; meds.controlled.read), one controlled_movements row each, once a day; one runs row.
    cadence: "45 1 * * *"
    connections:
      clinic: vet_reports
      office: office_jobs
  - name: close-medicines-register
    key: meds.close
    part: runner
    source: source
    target: target
    method: script
    computes: >-
      run daily, acting on the 1st only (the customer's local date; any other day writes nothing):
      the past month's extract from the register, per product its lines, quantity and checksum
      (meds.close.compute), once a month; one runs row.
    cadence: "0 3 * * *"
    connections:
      clinic: vet_reports
      office: office_jobs
    feeder: feed-medicines-register
  - name: balance-controlled-drugs
    key: meds.balance
    part: runner
    source: source
    target: target
    method: script
    computes: >-
      run daily, acting on the 1st only: each controlled batch's past month, the opening (the
      previous closing, else the quantity received), the month's movements and the closing
      (meds.balance.compute), signed by the centre's senior vet, once a month; one runs row.
    cadence: "15 3 * * *"
    connections:
      clinic: vet_reports
      office: office_jobs
    feeder: feed-controlled-drugs
  - name: inventory-controlled-drugs
    key: meds.inventory
    part: runner
    source: source
    target: target
    method: script
    computes: >-
      run daily, acting on 1 January only: each controlled batch's stock at the year's start,
      December's closing (meds.inventory.compute), once a year; one runs row.
    cadence: "30 3 * * *"
    connections:
      clinic: vet_reports
      office: office_jobs
    feeder: feed-controlled-drugs

trace:
  - kind: published-results
    part: target
    table: medicines_register
    run_column: run_id
  - kind: published-results
    part: target
    table: controlled_movements
    run_column: run_id
  - kind: published-results
    part: target
    table: register_extracts
    run_column: run_id
  - kind: published-results
    part: target
    table: controlled_balances
    run_column: run_id
  - kind: published-results
    part: target
    table: controlled_inventories
    run_column: run_id
  - kind: run-ledger
    part: target
    table: runs
    run_column: id
  - kind: run-ledger
    part: runner
    file: /var/log/scheduler/scheduler.log

invariants:
  - id: MR1
    statement: >-
      Each feed-medicines-register run since the judged moment finds its local day's supplies in the
      register once each, every dispensing and every dose given, its batch and quantity equal to
      the source's, and no other line.
    check: checks/mr1-supplies-once.sh
    parameters: {}
    witness: about 75 dispensings and 210 doses given a day.
    judged: runs
  - id: MR2
    statement: >-
      A register line carries the fields of Art 103(3) and no more: the product, its form and
      authorisation, the batch, the quantity, the recipient (an owner's name and address, or the
      centre), the prescribing vet; no e-mail, no phone.
    check: checks/mr2-legal-fields.sh
    parameters: {}
    witness: every feed-medicines-register run with a dispensing.
    judged: runs
  - id: MR3
    statement: >-
      Each feed-controlled-drugs run since the judged moment finds its local day's movements of
      controlled medicines in the register once each, as the source's, and no other.
    check: checks/mr3-controlled-once.sh
    parameters: {}
    witness: the anaesthetics of the day's procedures (about three consultations in ten).
    judged: runs
  - id: MR4
    statement: >-
      A month's balance equals the previous closing (the quantity received for a batch's first
      month) less the month's movements, per batch.
    check: checks/mr4-balance-code.sh
    parameters: {}
    witness: the planted months, against which the balance's code runs; the 1st's run if the GM places one.
    judged: code

history: material/history.sql

data_moved:
  - job: feed-medicines-register
    reads: [clinic.owners.name, clinic.owners.address, clinic.staff.name]
    writes: [target:medicines_register, target:runs]
  - job: feed-controlled-drugs
    reads: []
    writes: [target:controlled_movements, target:runs]
  - job: close-medicines-register
    reads: []
    writes: [target:register_extracts, target:runs]
  - job: balance-controlled-drugs
    reads: [clinic.staff.name]
    writes: [target:controlled_balances, target:runs]
  - job: inventory-controlled-drugs
    reads: []
    writes: [target:controlled_inventories, target:runs]

roles:
  - name: vet_reports
    part: source
    reads: [business_settings, sites, staff, owners (name and address), dispensings, administrations,
            prescriptions, prescription_lines, medicines, medicine_batches]
    writes: []
  - name: office_jobs
    part: target
    reads: [medicines_register, controlled_movements, register_extracts, controlled_balances,
            controlled_inventories]
    writes: [medicines_register, controlled_movements, register_extracts, controlled_balances,
             controlled_inventories, runs]

