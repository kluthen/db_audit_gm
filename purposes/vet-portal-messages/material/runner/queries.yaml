# The portal's messages, three script keys on the centre's integration engine,
# a fragment (purpose 16; vet-portal-domain.md, "vet-portal-messages"; capture
# W4 items 0 and 6): scripts/portal_messages.py. margin_minutes the notices'
# watermark margin; link the portal's base for the notices' and reminders'
# links; species the reminders' (domestic animals and horses); batch the
# messages a sending run takes; attempts the posts before a message fails.
queries:
  messages.notices:
    script: scripts/portal_messages.py:queue_notices
    options: {margin_minutes: 2, link: "https://portal.example.net/"}
  messages.reminders:
    script: scripts/portal_messages.py:queue_reminders
    options: {link: "https://portal.example.net/", species: "dog,cat,rabbit,ferret,horse"}
  messages.send:
    script: scripts/portal_messages.py:send_messages
    options: {batch: 100, attempts: 6}
