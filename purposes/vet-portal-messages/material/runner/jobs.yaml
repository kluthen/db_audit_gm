# Fixed-time operations of the centre's integration engine for the portal's
# messages, a fragment (purpose 16; vet-portal-domain.md,
# "vet-portal-messages"; capture W4 items 0 and 6), in scenario time: the
# notices every five minutes, the reminders' queue at 09:00, the sending every
# minute. The scripts hold the portal as portal_dispatch (portal) and the
# messaging service's endpoint with the customer's key (messaging). Written
# for the node records and the hostname messaging; the GM adapts them.
jobs:
  - name: queue-notices
    key: messages.notices
    connections: {portal: portal-dispatch}
    at: "*/5 * * * *"
  - name: queue-reminders
    key: messages.reminders
    connections: {portal: portal-dispatch}
    at: "0 9 * * *"
  - name: send-messages
    key: messages.send
    connections: {portal: portal-dispatch, partner: messaging}
    at: "* * * * *"
