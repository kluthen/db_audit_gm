# schedule.yaml of the messaging service's stub, a fragment for
# partners-backend (v0.5 master spec 10.2; capture W2 item 6, W4 item 0;
# partners/README.md): its baseline stream only, upserting its state once a
# minute as its own role (the service answers, with no stream). A fault's
# timeline change of messaging.normal to messaging.<behaviour> is the
# scenario's. The GM copies it into the scenario layer compose/partners-backend/.
connections:
  messaging-db: {driver: sql/postgresql, target: partners-db:5432/partners, role: messaging, pool: {size: 1}}
streams:
  - key: messaging.normal
    connection: messaging-db
    rate: 1/min
    arrivals: even
