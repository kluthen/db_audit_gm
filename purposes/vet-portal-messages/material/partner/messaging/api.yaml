# api.yaml of the messaging service's stub, a fragment for partners-api (v0.5
# master spec 10.2, 12.2 purpose 16; vet-portal-domain.md,
# "vet-portal-messages"; capture W4 items 0 and 6, W3 item 5, W2 item 6, W2-f;
# partners/README.md). Prefix messaging, hostname messaging: the franchise's
# messaging service (D293), a processor. Its one endpoint behind the
# customer's own key with the service, messaging_customer. No stream of its
# own (the service only answers): the back end keeps its state
# (messaging.normal). The GM copies it into the scenario layer
# compose/partners-api/.
endpoints:
  messaging_messages:
    hosts: [messaging]
    credentials: [messaging_customer]
connections:
  messaging-db: {driver: sql/postgresql, target: partners-db:5432/partners, role: messaging, pool: {size: 2}}
