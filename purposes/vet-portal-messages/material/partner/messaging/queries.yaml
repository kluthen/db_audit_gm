# queries.yaml of the messaging service's stub, a fragment for
# partners-backend (v0.5 master spec 10.2; capture W2 item 6, W4 item 0): its
# baseline key. delay_ms the milliseconds its route adds before each answer;
# fail_one_in the standing 503 (every call whose number, messaging.calls, is
# a multiple of it answers 503: one in fifty, D214's precedent). A fault's key
# (messaging.<behaviour>) upserts other values.
queries:
  messaging.normal:
    sql: >-
      INSERT INTO messaging.state (hostname, name, value) VALUES ('messaging', 'delay_ms', '0'),
      ('messaging', 'fail_one_in', '50')
      ON CONFLICT (hostname, name) DO UPDATE SET value = EXCLUDED.value, set_at = now()
